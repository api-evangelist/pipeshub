    - source: https://pipeshub.com/terms
      http_status: 200
      fetched: '2026-10-09'
      quote: >-
        PipesHub will not use Customer Materials to train shared foundation models or third-party LLMs for
        general-purpose model training without Customer's explicit written consent.
    note: >-
      Contractual AI disclosure in the Terms: outputs are AI-generated and may be inaccurate or biased,
      human review is the customer's responsibility, and customer data is not used for general-purpose model
      training without written consent. This is a terms clause, not a dedicated AI transparency page and not a
      training-data summary.
  exit_assistance:
    url: https://pipeshub.com/terms
    section: '15. Effects of Termination'
    stated_period: 'within thirty (30) days after termination'
    evidence:
    - source: https://pipeshub.com/terms
      http_status: 200
      fetched: '2026-10-09'
      quote: >-
        For paid Services, Customer may request export of Customer Materials during the period stated in the
        applicable Order Form or, if none is stated, within thirty (30) days after termination. After that
        period, PipesHub may delete Customer Materials from production systems, subject to routine backups,
        legal retention obligations, and technical constraints.
    note: >-
      A post-termination data export window for paid services only; the same section states that hosted
      Community Edition data may be deleted "at any time, including after inactivity". No export format or
      tooling is named.
not_found:
