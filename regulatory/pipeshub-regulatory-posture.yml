- data_residency: no region or hosting-location statement on the legal pages
- accessibility_conformance: /accessibility returns 404; no VPAT or WCAG statement found
- sbom, support_lifetime, age_assurance, notice_and_action, transparency_report, training_data_summary: not addressed on the pages read
