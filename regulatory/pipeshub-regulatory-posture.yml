  ai_transparency:
    url: https://pipeshub.com/terms
    section: '10. Inputs, Outputs, and AI Features'
    evidence:
    - source: https://pipeshub.com/terms
      http_status: 200
      fetched: '2026-10-09'
      quote: >-
        Customer acknowledges that AI-enabled features may generate inaccurate, incomplete, inconsistent,
