signals:
  data_subject_request:
    url: https://pipeshub.com/privacy-policy
    section: '3. Right to Access Personal Information'
    channel: contact@pipeshub.com
    stated_sla: 'PipesHub will make reasonable efforts to fulfill requests within 30 days or as required by law.'
    rights_named: [access, correct, suppress, deactivate]
    evidence:
    - source: https://pipeshub.com/privacy-policy
      http_status: 200
      fetched: '2026-10-09'
      quote: >-
        You have the right to access, correct, suppress, or deactivate your personal information. To exercise
        these rights, email: contact@pipeshub.com PipesHub will make reasonable efforts to fulfill requests
        within 30 days or as required by law.
    note: >-
      A published data-subject request channel (email, no API or form) with a best-efforts 30-day response
      statement and identity verification ("To safeguard your privacy, identity verification may be requested.").
      No portability or erasure right is named.
  data_retention:
    url: https://pipeshub.com/privacy-policy
    section: '4. Retention of Personal Information'
    evidence:
    - source: https://pipeshub.com/privacy-policy
      http_status: 200
      fetched: '2026-10-09'
      quote: >-
        PipesHub retains personal data only as long as necessary to meet: Purpose of collection Legal,
        regulatory, accounting, and reporting requirements Business obligations
    note: >-
      A purpose-limited retention statement with listed factors (volume, sensitivity, risk, applicable legal
      retention periods); no fixed retention period is stated.
