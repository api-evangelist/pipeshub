aid: pipeshub

name: PipesHub

description: PipesHub is an open-source, enterprise-ready workplace AI platform positioned as an open-source alternative to Glean. It unifies
  scattered business data by connecting to business and enterprise apps, provides explainable, permission-aware enterprise search across them,
  and powers AI agents that get work done. It can be self-hosted from its public GitHub repository (pipeshub-ai/pipeshub-ai) or used as a hosted
  app, and documents a developer API reference for building on its enterprise context layer.

