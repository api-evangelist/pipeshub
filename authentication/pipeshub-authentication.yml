documented:
  personal_access_tokens:
    prefix: phpat_
    header: 'Authorization: Bearer phpat_YOUR_TOKEN'
    note: Long-lived, scoped, revocable; the phpat_ prefix is display-only. Refused
      with 403 on PAT and OAuth app management endpoints.
    docs: https://docs.pipeshub.com/developer/personal-access-tokens
  session_tokens:
