openapi: 3.2.0
info:
  title: Pipeshub User Account API
  version: 1.0.0
  contact:
    name: API Support
    email: support@pipeshub.com
  description: 'Operations tagged User Account across 2 of this provider''s published API definitions: pipeshub-openapi.yaml, pipeshub-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: '{instance_url}/api/v1'
  description: Base API URL
  variables:
    instance_url:
      default: https://app.pipeshub.com
      description: Base server URL (without /api/v1)
- url: '{instance_url}'
  description: Root URL (used for MCP endpoints mounted at /mcp)
  variables:
    instance_url:
      default: https://app.pipeshub.com
      description: Base server URL
security:
- bearerAuth: []
- oauth2: []
tags:
- name: User Account
  description: User authentication including multi-step MFA, password reset, OTP login, and token management
paths:
  /userAccount/initAuth:
    post:
      tags:
      - User Account
      summary: Initialize authentication session
      description: 'Start a server-side authentication session and discover which sign-in methods are

        configured for the organization. This is the first step in the multi-step login flow.


        **Request body (optional)**


        - You may omit the body, send an empty JSON object `{}`, or send `{ "email": "..." }`.

        - `email` in the body is optional and kept for legacy reasons; omitting it does not prevent

        initialization. The web client typically calls this endpoint without a body and sends

        `email` on `/authenticate` instead.

        - When provided, `email` is stored on the session for correlation with subsequent steps.


        **Flow:**


        1. Call this endpoint (optional JSON body as above).

        2. Receive a session token in the `x-session-token` response header.

        3. Send that token on subsequent `/authenticate` requests (`x-session-token` header).

        4. Use `allowedMethods` and `authProviders` from the response to render the login UI.


        **Session token**


        - Returned as header `x-session-token`.

        - Required for `/authenticate` (and related steps) until it expires.


        **Multi-factor authentication**


        If the organization has MFA, complete multiple authentication steps; each step may

        return the next step''s allowed methods.'
      operationId: initAuth
      x-pipeshub-sdk: true
      security: []
      requestBody:
        description: 'Optional. Omit entirely or send `{}`. You may include `email` for legacy compatibility (pre-fills the session); invalid `email` format is rejected when the field is present.

          '
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitAuthRequest'
        required: false
      responses:
        '200':
          description: Authentication session initialized successfully
          headers:
            x-session-token:
              schema:
                type: string
              description: Session token for subsequent authentication requests. Store this securely.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitAuthResponse'
        '400':
          description: Invalid request (e.g. malformed `email` when that property is sent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    servers:
    - url: '{instance_url}/api/v1'
      description: Base API URL
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL (without /api/v1)
    - url: '{instance_url}'
      description: Root URL (used for MCP endpoints mounted at /mcp)
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL
  /userAccount/authenticate:
    post:
      tags:
      - User Account
      summary: Authenticate user with credentials
      description: 'Authenticate a user using the specified method and credentials.

        Requires a valid session token from `/initAuth`.


        **Credential Formats by Method:**


        - `password`: `{ "credentials": { "password": "your-password" } }`

        - `otp`: `{ "credentials": { "otp": "123456" } }` (6-digit code, valid for 10 minutes)

        - `google`: `{ "credentials": "google-id-token-string" }`

        - `microsoft`: `{ "credentials": { "accessToken": "...", "idToken": "..." } }`

        - `azureAd`: `{ "credentials": { "accessToken": "...", "idToken": "..." } }`

        - `oauth`: `{ "credentials": { "accessToken": "...", "idToken": "..." } }`

        - `samlSso`: not accepted here; this endpoint answers `400`. SAML sign-in runs as a browser

        redirect: send the browser to `/saml/signIn` instead


        **Multi-Step Response:**


        If organization uses MFA, successful authentication returns:

        - `status: "success"` with `nextStep` and `allowedMethods` for next step


        **Fully Authenticated Response:**


        After completing all steps:

        - `message: "Fully authenticated"` with `accessToken` (1hr) and `refreshToken` (7d)


        **Security:**


        - Account locks for 24 hours after 5 consecutive failed attempts, and the owner is

        sent an email saying so. While it is locked, sign-in is refused with the same answer

        as a wrong password or code, even when the password or code is right

        - CAPTCHA may be required if enabled (pass `cf-turnstile-response`)

        - An email with no account gets the same status and message as a real account given

        a wrong password (`400`) or a wrong, missing or expired sign-in code (`401`)'
      operationId: authenticate
      x-pipeshub-sdk: true
      security: []
      parameters:
      - name: x-session-token
        in: header
        required: true
        description: Session token received from `/initAuth` endpoint
        schema:
          type: string
      requestBody:
        description: Request payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticateRequest'
        required: true
      responses:
        '200':
          description: Authentication step successful or fully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticateResponse'
        '400':
          description: Invalid request, method not allowed, invalid credential format, `samlSso` sent here instead of `/saml/signIn`, or wrong or missing password. A wrong password, an email with no account and a locked account all get the same message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Wrong, missing or expired sign-in code (the same message for an email with no account and for a locked account), CAPTCHA refused, or the identity provider rejected the sign-in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Sign-in session expired or missing; start again with `/initAuth`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    servers:
    - url: '{instance_url}/api/v1'
      description: Base API URL
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL (without /api/v1)
    - url: '{instance_url}'
      description: Root URL (used for MCP endpoints mounted at /mcp)
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL
  /userAccount/login/otp/generate:
    post:
      tags:
      - User Account
      summary: Request a sign-in code (OTP) for login
      description: 'Ask for a 6-digit one-time password (OTP) to be emailed, for use with the `otp`

        method on `/authenticate`. If that email can sign in with a code, one is sent;

        the answer is the same either way (see **Account privacy** below).


        **OTP Details:**


        - 6 digits numeric code

        - Valid for **10 minutes** after generation

        - Sent only to the email of an existing account that isn''t locked


        **Rate Limiting:**


        - Multiple OTP requests may be rate-limited

        - Wait for the current OTP to expire before requesting a new one


        **CAPTCHA:**


        If Cloudflare Turnstile is enabled, include `cf-turnstile-response` in the request body.


        **Account privacy:**


        The answer is the same `200` and message whether or not the email has an account,

        and also when the account is locked or the email could not be sent. A code is only

        sent when the account exists and isn''t locked. Failures to send are logged on the

        server.


        **Success response body**


        - `200` returns a **plain string**: `If that email can sign in with a code, one is being sent. ...`

        - The answer doesn''t wait for the email to go out, and a failed send is only

        logged on the server'
      operationId: generateLoginOtp
      security: []
      requestBody:
        description: Request payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpGenerateRequest'
        required: true
      responses:
        '200':
          description: Request accepted. If that email can sign in with a code (an existing account that isn't locked), one is being sent. The answer is the same either way, and doesn't say whether the email was delivered.
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/LoginOtpGenerateResponse'
        '400':
          description: Invalid request or malformed email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: The account lookup failed on the server (the same for every email)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    servers:
    - url: '{instance_url}/api/v1'
      description: Base API URL
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL (without /api/v1)
    - url: '{instance_url}'
      description: Root URL (used for MCP endpoints mounted at /mcp)
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL
  /userAccount/password/forgot:
    post:
      tags:
      - User Account
      summary: Request password reset email
      description: 'Send a password reset link to the user''s email.

        The link contains a time-limited token that can be used to reset the password.


        **Note:** To prevent account enumeration, this endpoint always returns

        200 with the same generic message regardless of whether the supplied

        email is registered. If the account exists a reset link is sent;

        otherwise the request is silently ignored. Internal lookup or mail

        delivery failures are logged server-side and do not change the response.'
      operationId: forgotPassword
      security: []
      requestBody:
        description: Request body for Request password reset email
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
        required: true
      responses:
        '200':
          description: Request accepted. Same response is returned whether the email is registered or not.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataStringResponse'
        '400':
          description: Missing or invalid email in the request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: CAPTCHA verification failed (when Turnstile is configured)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    servers:
    - url: '{instance_url}/api/v1'
      description: Base API URL
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL (without /api/v1)
    - url: '{instance_url}'
      description: Root URL (used for MCP endpoints mounted at /mcp)
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL
  /userAccount/password/reset/token:
    post:
      tags:
      - User Account
      summary: Reset password with email token
      description: 'Reset password using a token received via email from the forgot password flow.


        **Password Requirements:**


        - Minimum 8 characters

        - At least 1 uppercase letter

        - At least 1 lowercase letter

        - At least 1 number

        - At least 1 special character (#?!@$%^&*-)


        **Security Notes:**


        - Token is single-use and expires after a set time

        - Response body contains a confirmation string in `data`'
      operationId: resetPasswordWithToken
      security:
      - scopedToken: []
      requestBody:
        description: Request payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenPasswordResetRequest'
        required: true
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataStringResponse'
        '400':
          description: Invalid request or password doesn't meet requirements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid or expired password reset token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    servers:
    - url: '{instance_url}/api/v1'
      description: Base API URL
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL (without /api/v1)
    - url: '{instance_url}'
      description: Root URL (used for MCP endpoints mounted at /mcp)
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL
  /userAccount/validateEmailChange:
    put:
      tags:
      - User Account
      summary: Validate email change token
      description: 'Validate a token for changing the user''s email address.

        This is used in the email change flow to verify the token before allowing the change.


        **Flow:**


        1. User requests email change and receives a token via email

        2. This endpoint validates the token and returns success if valid

        3. If valid, user can proceed to change their email address'
      operationId: validateEmailChangeToken
      security:
      - scopedToken: []
      responses:
        '200':
          description: Email change token is valid and email is updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateEmailChangeResponse'
        '400':
          description: New email address is already in use by another account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Missing, expired, invalid-scope, or already-consumed token

            (link was previously used to complete an email change)

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    servers:
    - url: '{instance_url}/api/v1'
      description: Base API URL
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL (without /api/v1)
    - url: '{instance_url}'
      description: Root URL (used for MCP endpoints mounted at /mcp)
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL
  /userAccount/refresh/token:
    post:
      tags:
      - User Account
      summary: Refresh access token
      description: 'Get a new access token using a valid refresh token.


        **Usage:**


        - Pass the refresh token as a Bearer token in the Authorization header

        - Returns a new access token and basic user information


        **Token Lifetimes:**


        - Access token: 24 hours (configurable via `ACCESS_TOKEN_EXPIRY` environment variable)

        - Refresh token: 30 days (configurable via `REFRESH_TOKEN_EXPIRY` environment variable)


        **Best Practices:**


        - Call this endpoint before the access token expires

        - Store the new access token and continue using it for authenticated requests

        - If refresh fails with 401, redirect user to login flow'
      operationId: refreshToken
      x-pipeshub-sdk: true
      security:
      - scopedToken: []
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '400':
          description: Disabled user account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid or expired refresh token - user must re-authenticate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found (account may have been deleted), User credentials not found, or Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    servers:
    - url: '{instance_url}/api/v1'
      description: Base API URL
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL (without /api/v1)
    - url: '{instance_url}'
      description: Root URL (used for MCP endpoints mounted at /mcp)
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL
  /userAccount/logout/manual:
    post:
      tags:
      - User Account
      summary: Logout current session
      description: 'Log out the current user session.


        **Effects:**


        - Records a logout activity entry for the user

        - Client should clear stored tokens locally after calling this endpoint


        **Note:** This endpoint requires the access token, not the refresh token.'
      operationId: logout
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully (empty response body)
        '401':
          description: Unauthorized - invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Auth container not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    servers:
    - url: '{instance_url}/api/v1'
      description: Base API URL
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL (without /api/v1)
    - url: '{instance_url}'
      description: Root URL (used for MCP endpoints mounted at /mcp)
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL
  /userAccount/password/reset:
    post:
      tags:
      - User Account
      summary: Reset password
      description: 'Reset the password for the currently authenticated user.


        **Overview:**


        Allows a logged-in user to change their password by providing the current password and a new password.'
      operationId: resetPassword
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      requestBody:
        required: true
        description: Request payload
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - currentPassword
              - newPassword
              properties:
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
                cf-turnstile-response:
                  type: string
                  description: Cloudflare Turnstile CAPTCHA token (required when Turnstile is configured server-side)
      responses:
        '200':
          description: Password reset successfully - returns new access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedPasswordResetResponse'
        '400':
          description: 'Bad request. Possible causes:

            - `currentPassword` or `newPassword` missing from request body

            - Current and new password are the same (plain-text comparison)

            - New password does not meet strength requirements (min 8 chars, uppercase, lowercase, number, special character)

            - Old and new password are the same (hash comparison against stored password)

            - Account is blocked due to too many incorrect login attempts

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Unauthorized. Possible causes:

            - Invalid or expired access token

            - Current password is incorrect

            - Invalid CAPTCHA verification (when Turnstile is configured)

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Not found. Possible causes:

            - Auth container not found

            - User credentials not found (no password set for account)

            - User not found in IAM service

            - Organization not found

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    servers:
    - url: '{instance_url}/api/v1'
      description: Base API URL
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL (without /api/v1)
    - url: '{instance_url}'
      description: Root URL (used for MCP endpoints mounted at /mcp)
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL
components:
  schemas:
    OAuthCredentials:
      type: object
      additionalProperties: false
      description: Credentials for OAuth authentication (Microsoft, Azure AD, generic OAuth)
      properties:
        accessToken:
          type: string
          description: OAuth access token
        idToken:
          type: string
          description: OAuth ID token (JWT)
      required:
      - accessToken
    AuthenticateResponse:
      oneOf:
      - $ref: '#/components/schemas/AuthenticateMultiStepResponse'
      - $ref: '#/components/schemas/AuthenticateFinalResponse'
      description: 'Either the next step in a multi-factor flow (`status`, `nextStep`, `allowedMethods`, `authProviders`)

        or final tokens (`message`, `accessToken`, `refreshToken`).

        '
    OtpGenerateRequest:
      type: object
      additionalProperties: false
      description: Request for a sign-in code (OTP); a code is sent only if that email can sign in with one
      properties:
        email:
          type: string
          format: email
          description: Email address to send OTP to
        cf-turnstile-response:
          type: string
          description: Cloudflare Turnstile CAPTCHA token (optional)
      required:
      - email
    AuthenticatedPasswordResetResponse:
      type: object
      additionalProperties: false
      description: Response after authenticated user changes password (new access token issued)
      properties:
        data:
          type: string
          example: password reset
        accessToken:
          type: string
          description: New JWT access token after password change
      required:
      - data
      - accessToken
    DataStringResponse:
      type: object
      additionalProperties: false
      description: Generic success payload with a single string field (e.g. password reset email, token reset)
      properties:
        data:
          type: string
      required:
      - data
    InitAuthResponse:
      type: object
      additionalProperties: false
      description: Response containing available authentication methods and session info
      properties:
        currentStep:
          type: integer
          description: Current authentication step (0-indexed). Always 0 for initial response.
          example: 0
        allowedMethods:
          type: array
          items:
            type: string
            enum:
            - samlSso
            - otp
            - password
            - google
            - microsoft
            - azureAd
            - oauth
          description: List of allowed authentication methods for the current step
          example:
          - password
          - google
          - otp
        message:
          type: string
          description: Response message
          example: Authentication initialized
        authProviders:
          $ref: '#/components/schemas/AuthProviders'
        jitEnabled:
          type: boolean
          description: True when at least one allowed external provider has JIT provisioning enabled
      required:
      - currentStep
      - allowedMethods
      - message
      - authProviders
      - jitEnabled
    ValidateEmailChangeResponse:
      type: object
      additionalProperties: false
      description: Response after validating an email change token
      properties:
        message:
          type: string
          example: Email updated successfully
      required:
      - message
    RefreshTokenResponse:
      type: object
      additionalProperties: false
      description: Response with new access token
      properties:
        user:
          $ref: '#/components/schemas/RefreshTokenUser'
        accessToken:
          type: string
          description: New JWT access token (24 hour default expiry, configurable via ACCESS_TOKEN_EXPIRY)
      required:
      - user
      - accessToken
    ErrorResponse:
      type: object
      additionalProperties: false
      description: 'Standard error envelope returned by all errors routed through `ErrorMiddleware`.

        Applies to all `BaseError` subclasses including `HttpError`, `ValidationError`, and others.

        The `code` field is a machine-readable string identifying the error type (e.g.

        `HTTP_UNAUTHORIZED`, `HTTP_NOT_FOUND`, `VALIDATION_ERROR`, `INTERNAL_ERROR`).

        '
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          properties:
            requestId:
              type: string
              description: 'Identifier for this request, echoed so a bug report can quote it.

                Absent when the request never reached the middleware that assigns one.

                '
            code:
              type: string
              description: 'Machine-readable error code. For application errors it takes the form `HTTP_<VARIANT>`

                For unhandled runtime errors (e.g. database unavailable) it is `INTERNAL_ERROR`.

                '
              example: HTTP_BAD_REQUEST
            message:
              type: string
              description: Human-readable description of the error
              example: Admin access required
            metadata:
              type: object
              description: Additional context (only present in development environments)
              additionalProperties: true
      required:
      - error
    AuthProviderAzureAdPublicConfig:
      type: object
      additionalProperties: false
      description: Public Azure AD OAuth settings returned to clients
      properties:
        tenantId:
          type: string
          description: Azure AD tenant ID
        clientId:
          type: string
          description: Azure AD client ID
        enableJit:
          type: boolean
          description: Whether just-in-time user provisioning is enabled for Azure AD
