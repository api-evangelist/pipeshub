openapi: 3.2.0
info:
  title: PipesHub Personal Access Tokens API
  description: Unified API documentation for PipesHub services.
  version: 1.0.0
  contact:
    name: API Support
    email: support@pipeshub.com
servers:
- url: '{instance_url}/api/v1'
  description: Base API URL
  variables:
    instance_url:
      default: https://app.pipeshub.com
      description: Base server URL (without /api/v1)
- url: '{instance_url}'
  description: Root URL (used for MCP endpoints mounted at /mcp)
  variables:
    instance_url:
      default: https://app.pipeshub.com
      description: Base server URL
security:
- bearerAuth: []
- oauth2: []
tags:
- name: Personal Access Tokens
  description: 'Self-service, long-lived, scoped, revocable credentials that act as their

    creator — unlike an OAuth app''s `client_credentials` flow, which acts as

    the app.'
paths:
  /personal-access-tokens:
    get:
      tags:
      - Personal Access Tokens
      summary: List your own personal access tokens
      description: 'Lists the caller''s own active (non-revoked, unexpired) personal

        access tokens, newest first, capped at 100 rows server-side. Never

        returns another user''s tokens — see `GET /personal-access-tokens/admin`

        for the org-admin, cross-user view.


        Shares the same per-user rate limiter as `/oauth-clients/*`

        (default 1000 req/min, `MAX_OAUTH_CLIENT_REQUESTS_PER_MINUTE`).'
      operationId: listPersonalAccessTokens
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: The caller's active personal access tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPatResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationJsonErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClientManagementRateLimitError'
    post:
      tags:
      - Personal Access Tokens
      summary: Create a personal access token
      description: 'Mints a new personal access token for the caller. Deliberately not

        admin-gated — any authenticated org member may create their own,

        unlike OAuth app registration.


        The token is minted against a lazily-created, per-org synthetic

        OAuth app (`clientId: pat-system:`) shared by every PAT in

        that org — the same signing, hashing, and revocation machinery as

        `/oauth2/token`, reused rather than duplicated.


        `scopes` is validated against the org''s configured `MCP_SCOPES`

        env var, not the full role-aware OAuth-app scope catalog — a

        non-admin can request any scope in that set.


        **Session only.** The bearer token must be the user''s interactive

        session JWT. OAuth access tokens and personal access tokens

        (`phpat_...`) are rejected with `403`, so a token that is already

        issued cannot mint another with wider scopes or a longer life.


        The response''s `accessToken` is shown **once**; only its SHA-256

        hash is stored. It''s prefixed `phpat_` (see the `bearerAuth`

        security scheme).'
      operationId: createPersonalAccessToken
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      requestBody:
        description: Request body for Create personal access token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePatRequest'
        required: true
      responses:
        '201':
          description: Personal access token created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePatResponse'
        '400':
          description: Invalid request (validation error, or a requested scope isn't in the org's configured `MCP_SCOPES`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationJsonErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationJsonErrorResponse'
        '403':
          description: Bearer token is an OAuth access token or personal access token rather than a user session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationJsonErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClientManagementRateLimitError'
  /personal-access-tokens/scopes:
    get:
      tags:
      - Personal Access Tokens
      summary: List scopes available for a new personal access token
      description: 'Returns the org''s configured `MCP_SCOPES` as a flat array of scope

        definitions, for populating the create-token scope picker. Unlike

        `GET /oauth-clients/scopes`, this is **not** grouped by category and

        **not** role-aware — every org member sees the same set, since PAT

        scope selection isn''t gated by admin status.'
      operationId: listPersonalAccessTokenScopes
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Scopes available to grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatScopesListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationJsonErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClientManagementRateLimitError'
  /personal-access-tokens/{tokenId}:
    delete:
      tags:
      - Personal Access Tokens
      summary: Revoke one of your own personal access tokens
      description: 'Revokes a token by id, scoped to `{tokenId, clientId, callerUserId}`

        — a caller can never revoke another user''s token through this route,

        even though everyone in the org shares the same underlying

        `pat-system:` client. Revocation takes effect immediately: the

        token''s next verification attempt fails, including one already in

        flight.'
      operationId: revokePersonalAccessToken
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      parameters:
      - name: tokenId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
        description: Personal access token ID
      requestBody:
        description: Optional request body for Revoke personal access token
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokePatRequest'
      responses:
        '200':
          description: Personal access token revoked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokePatResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationJsonErrorResponse'
        '404':
          description: Token not found, already revoked, not owned by the caller, or the org has no PAT app yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationJsonErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClientManagementRateLimitError'
  /personal-access-tokens/admin:
    get:
      tags:
      - Personal Access Tokens
      summary: 'Admin: list every active personal access token in the org'
      description: 'Lists every active personal access token across every member of the

        org, paginated, with each token''s owner attached (including owners

        who''ve since been deleted from the org — see `ownerDeleted` on

        `AdminPatListItem`). For incident response: a departed employee or a

        compromised laptop, where only the token''s own creator could

        otherwise see or revoke it.


        Requires org-admin privileges (`userAdminCheck`) — note this returns

        **`400`**, not `403`, for a non-admin caller (shared middleware

        behavior across the codebase, not specific to this route).'
      operationId: adminListPersonalAccessTokens
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Page number (defaults to `1` when omitted or empty)
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
        description: Items per page (defaults to `100` when omitted or empty; max 100)
      responses:
        '200':
          description: Every active personal access token in the org
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPatListResponse'
        '400':
          description: Invalid query parameters, or the caller is not an org admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationJsonErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationJsonErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClientManagementRateLimitError'
  /personal-access-tokens/admin/{tokenId}:
    delete:
      tags:
      - Personal Access Tokens
      summary: 'Admin: revoke any user''s personal access token by id'
      description: 'Revokes a token by id, scoped to the org''s PAT client but **not** to

        a specific owning user — the admin counterpart to

        `DELETE /personal-access-tokens/{tokenId}`. Requires org-admin

        privileges (`userAdminCheck`); returns `400` (not `403`) for a

        non-admin caller, same as `GET /personal-access-tokens/admin`.'
      operationId: adminRevokePersonalAccessToken
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      parameters:
      - name: tokenId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
        description: Personal access token ID
      requestBody:
        description: Optional request body for Admin revoke personal access token
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokePatRequest'
      responses:
        '200':
          description: Personal access token revoked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokePatResponse'
        '400':
          description: Invalid token ID, or the caller is not an org admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationJsonErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationJsonErrorResponse'
        '404':
          description: Token not found in this org, already revoked, or the org has no PAT app yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationJsonErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClientManagementRateLimitError'
components:
  schemas:
    AdminPatListItem:
      description: 'A personal access token as seen by an org admin — extends

        `PatListItem` with who it belongs to, since an admin is looking

        across every member''s tokens rather than just their own.

        '
      allOf:
      - $ref: '#/components/schemas/PatListItem'
      - type: object
        required:
        - userId
        - ownerDeleted
        properties:
          userId:
            type: string
            description: ID of the user who created this token
          ownerEmail:
            type: string
            format: email
            description: 'Owner''s email. Populated even when `ownerDeleted` is true

              (last-known value), for auditing.

              '
          ownerFullName:
            type: string
            description: Owner's full name (same last-known-value behavior as `ownerEmail`)
          ownerDeleted:
            type: boolean
            description: 'True if the owning user has been removed from the org (or no

              longer resolves at all). The token still appears — a deleted

              user''s tokens stop authenticating automatically, but stay

              visible here so an admin can audit/clean them up.

              '
    ApplicationJsonErrorResponse:
      type: object
      description: 'Standard JSON error envelope from `ErrorMiddleware` for `BaseError` subclasses (`error.middleware.ts`).

        Returned for most API 4xx errors (unauthorized, forbidden, not found, validation failures, etc.).

        '
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: Machine-readable code (e.g. `HTTP_UNAUTHORIZED`, `HTTP_FORBIDDEN`).
            message:
              type: string
            metadata:
              type: object
              description: Optional; may appear in non-production for some errors.
              additionalProperties: true
    CreatePatRequest:
      type: object
      description: 'Request to create a personal access token (`createPatTokenSchema` in `pat.validators.ts`).

        '
      required:
      - name
      properties:
        name:
          type: string
          description: Label to help you recognize the token later
          minLength: 1
          maxLength: 100
          example: Claude Desktop
        scopes:
          type: array
          items:
            type: string
          minItems: 1
          description: 'Scopes to grant, validated against the org''s configured `MCP_SCOPES`

            (not the full role-aware OAuth-app scope set). Defaults to every

            scope in `MCP_SCOPES` if omitted.

            '
          example:
          - kb:read
          - semantic:write
        expiryDays:
          oneOf:
          - type: integer
            enum:
            - 30
            - 90
            - 365
          - type: string
            enum:
            - never
          description: 'Token lifetime. Defaults to `30` if omitted — a token minted

            without an explicit choice shouldn''t default to the longest

            lifetime. `"never"` is stored as a ~100-year expiry (the

            underlying schema field is required and TTL-indexed, so there''s

            no literal null option).

            '
          default: 30
          example: 30
    OAuthClientManagementRateLimitError:
      type: object
      description: JSON body when OAuth client management routes exceed the per-minute rate limit (same limiter as other `/oauth-clients/*` routes).
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              example: TOO_MANY_REQUESTS
            message:
              type: string
              example: Too many OAuth client requests. Please try again later.
            retryAfter:
              type:
              - integer
              - 'null'
              description: Seconds until the limit window resets (when `Retry-After` is present); may be null.
    PatWithSecret:
      allOf:
      - $ref: '#/components/schemas/PatListItem'
      - type: object
        required:
        - accessToken
        properties:
          accessToken:
            type: string
            description: 'The raw token, `phpat_`-prefixed. Returned **only** in this

              creation response — only its hash is stored server-side, so

              it cannot be retrieved again later.

              '
            example: phpat_eyJhbGciOiJIUzI1NiIs...
    RevokePatResponse:
      type: object
      required:
      - message
      properties:
        message:
          type: string
          example: Personal access token revoked successfully
    CreatePatResponse:
      type: object
      description: Response body for `POST /personal-access-tokens` (`pat.controller.ts` `createToken`).
      required:
      - message
      - token
      properties:
        message:
          type: string
          example: Personal access token created successfully
        token:
          $ref: '#/components/schemas/PatWithSecret'
    PatListItem:
      type: object
      description: 'A personal access token as seen by its own creator (one element of

        `GET /personal-access-tokens`''s `tokens` array, or the `token` object

        returned by `POST /personal-access-tokens` before `accessToken` is added).

        '
      required:
      - id
      - name
      - scopes
      - createdAt
      - expiresAt
      properties:
        id:
          type: string
          description: Token ID
        name:
          type: string
          description: Token name
        scopes:
          type: array
          items:
            type: string
          description: Granted scopes
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: 'Expiry timestamp. A `"never"`-expiry token is stored as a

            ~100-year-out date, not a literal null — treat anything decades

            out as "never" rather than a real deadline.

            '
        lastUsedAt:
          type: string
          format: date-time
          description: 'Last time this token successfully authenticated a request.

            Throttled server-side to update at most once per 5 minutes per

            token; absent if the token has never been used.

            '
    RevokePatRequest:
      type: object
      description: 'Optional request body for `DELETE /personal-access-tokens/{tokenId}`

        and `DELETE /personal-access-tokens/admin/{tokenId}`. The body itself

        is optional; `reason`, if present, is stored on the revocation for

        auditing.

        '
      properties:
        reason:
          type: string
          example: rotated
    OAuthScopeInfo:
      type: object
      description: Information about an OAuth scope
      properties:
        name:
          type: string
          description: Scope identifier
          example: openid
        description:
          type: string
          description: Human-readable scope description
          example: OpenID Connect authentication
        category:
          type: string
          description: Scope category for grouping (matches the key under `scopes` on list responses)
          example: Identity
        requiresUserConsent:
          type: boolean
          description: Whether end-user consent is required when this scope is requested
          example: false
      required:
      - name
      - description
      - category
      - requiresUserConsent
    ListPatResponse:
      type: object
      description: 'Response body for `GET /personal-access-tokens` (`listTokens`) — the

        caller''s own active tokens, capped at 100 most-recent server-side.

        Unlike the admin list, this is a flat array with no pagination

        envelope and no owner fields (it''s implicitly scoped to the caller).

        '
      required:
      - tokens
      properties:
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/PatListItem'
    AdminPatListResponse:
      type: object
      description: 'Response body for `GET /personal-access-tokens/admin` (`adminListTokens`).

        Paginated — unlike the self-service `ListPatResponse` — since an org

        can have far more active tokens than a fixed-window cap''s worth.

        '
      required:
      - data
      - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminPatListItem'
        pagination:
          type: object
          required:
          - page
          - limit
          - total
          - totalPages
          properties:
            page:
              type: integer
            limit:
              type: integer
              description: Items per page (max 100)
            total:
              type: integer
            totalPages:
              type: integer
    PatScopesListResponse:
      type: object
      description: 'Response body for `GET /personal-access-tokens/scopes` (`listScopes`).

        Unlike `GET /oauth-clients/scopes`, this is a **flat array**, not

        grouped by category, and reflects the org''s configured `MCP_SCOPES`

        rather than the full role-aware OAuth-app scope catalog.

        '
      required:
      - scopes
      properties:
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/OAuthScopeInfo'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT Bearer token for authenticated requests.


        A personal access token (see the **Personal Access Tokens** tag) is a

        `phpat_`-prefixed variant of this same JWT — e.g. `phpat_eyJhbGci...`.

        The prefix is display-only, added for secret-scanner detectability; the

        gateway strips it before verifying the token, so send it exactly as

        issued, prefix included.

        '
    scopedToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Scoped JWT token for service-to-service authentication.

        Format: "Bearer {scoped_token}"

        Required scopes vary by endpoint.

        '
    oauth2:
      type: oauth2
      description: 'OAuth 2.0 authentication with fine-grained scopes.

        Supports authorization_code (with PKCE) and client_credentials flows.

        OAuth tokens are Bearer JWTs — use the same Authorization header as regular tokens.

        For **client_credentials**, machine JWTs may use `userId === client_id`; the Node gateway resolves the OAuth app creator — see **OAuth Provider** tag.

        '
      flows:
        authorizationCode:
          authorizationUrl: /api/v1/oauth2/authorize
          tokenUrl: /api/v1/oauth2/token
          refreshUrl: /api/v1/oauth2/token
          scopes:
            openid: OpenID Connect authentication
            profile: User profile information
            email: User email address
            offline_access: Offline access (refresh tokens)
            org:read: Read organization information
            org:write: Update organization settings
            org:admin: Full organization administration
            user:read: Read user profiles
            user:write: Update user profiles
            user:invite: Invite new users
            user:delete: Delete users
            usergroup:read: Read user groups
            usergroup:write: Create and manage user groups
            team:read: Read team information
            team:write: Create and manage teams
            kb:read: Read knowledge bases and records
            kb:write: Create and update knowledge bases
            kb:delete: Delete knowledge bases and records
            kb:upload: Upload files to knowledge bases
            semantic:read: Read semantic search results and history
            semantic:write: Execute semantic search
            semantic:delete: Delete semantic search history
            conversation:read: Read conversations
            conversation:write: Create and manage conversations
            conversation:chat: Send messages in conversations
            project:read: Read projects and their conversations
            project:write: Create and manage projects
            project:delete: Delete projects
            agent:read: Read AI agents
            agent:write: Create and manage AI agents
            agent:execute: Execute AI agents
            connector:read: Read connector configurations
            connector:write: Create and update connectors
            connector:sync: Trigger connector synchronization
            connector:delete: Delete connectors
            config:read: Read system configuration
            config:write: Update system configuration
            crawl:read: Read crawling jobs
            crawl:write: Create and manage crawling jobs
            crawl:delete: Delete crawling jobs
        clientCredentials:
          tokenUrl: /api/v1/oauth2/token
          scopes:
            openid: OpenID Connect authentication
            profile: User profile information
            email: User email address
            offline_access: Offline access (refresh tokens)
            org:read: Read organization information
            org:write: Update organization settings
            org:admin: Full organization administration
            user:read: Read user profiles
            user:write: Update user profiles
            user:invite: Invite new users
            user:delete: Delete users
            usergroup:read: Read user groups
            usergroup:write: Create and manage user groups
            team:read: Read team information
            team:write: Create and manage teams
            kb:read: Read knowledge bases and records
            kb:write: Create and update knowledge bases
            kb:delete: Delete knowledge bases and records
            kb:upload: Upload files to knowledge bases
            semantic:write: Execute semantic search
            semantic:read: Read semantic search results and history
            semantic:delete: Delete semantic search history
            conversation:read: Read conversations
            conversation:write: Create and manage conversations
            conversation:chat: Send messages in conversations
            project:read: Read projects and their conversations
            project:write: Create and manage projects
            project:delete: Delete projects
            agent:read: Read AI agents
            agent:write: Create and manage AI agents
            agent:execute: Execute AI agents
            connector:read: Read connector configurations
            connector:write: Create and update connectors
            connector:sync: Trigger connector synchronization
            connector:delete: Delete connectors
            config:read: Read system configuration
            config:write: Update system configuration
            crawl:read: Read crawling jobs
            crawl:write: Create and manage crawling jobs
