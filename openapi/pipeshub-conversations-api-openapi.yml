    RegenerateRequest:
      type: object
      additionalProperties: false
      description: "Request body for regenerating an AI response. All fields are optional;\nwhen omitted the model selection and execution context from the\noriginal message are reused.\n\nSupported fields:\n- `filters` — optional `{ apps?, kb? }` filter object\n- `chatMode` — optional non-empty chat mode string\n- `modelKey`, `modelName`, `modelFriendlyName` —\n  optional non-empty model override fields\n- `timezone` — optional non-empty client timezone string\n- `currentTime` — optional ISO 8601 / RFC 3339 datetime string with\n  UTC `Z` or a numeric offset\n- `tools` — optional array of non-empty tool identifiers\n- `protocol` — optional inert compatibility field; when present it must\n  be `agui`, which is also the protocol used when the field is omitted\n- `agentCapabilities` — optional per-request agent capability toggles\n"
      properties:
        filters:
          $ref: '#/components/schemas/Filters'
        modelKey:
          type: string
          minLength: 1
          description: 'Identifier of the AI model configuration to use for regeneration.

            Typically a UUID returned by the model-management endpoints. When

            omitted, the model used for the original message is reused.

            '
          example: 05438a37-68f2-4641-a8dc-6c47e63278ca
        modelName:
          type: string
          minLength: 1
          description: Provider model name (e.g. the underlying LLM identifier).
          example: gpt-5.6-luna
        modelFriendlyName:
          type: string
          minLength: 1
          description: Friendly display name of the selected model.
          example: mini
        chatMode:
          type: string
          minLength: 1
          description: 'Chat mode used for regeneration (for example `internal_search`,

            `web_search`, or the universal `agent` mode).

            '
          example: internal_search
        timezone:
          type: string
          minLength: 1
          description: 'IANA timezone identifier from the client. Used to provide

            time-aware context to the AI during regeneration.

            '
          example: Asia/Calcutta
        currentTime:
          type: string
          format: date-time
          description: 'ISO 8601 / RFC 3339 datetime from the client (UTC `Z` or numeric

            offset). Used to anchor any relative time references in the query.

            '
          example: '2026-05-11T15:43:21+05:30'
        tools:
          type: array
          items:
            type: string
            minLength: 1
          description: 'Optional list of tool identifiers (fully-qualified action names

            such as `jira.create_issue`) the agent may invoke when

            regenerating. Applicable only in agent chat modes.

            '
          example:
          - jira.create_issue
          - confluence.search_content
        protocol:
          type: string
          enum:
          - agui
          description: 'AG-UI is the only supported wire protocol. When present must be

            `"agui"`. Omitting the field is equivalent — the server always

            uses the AG-UI vocabulary. Kept in the schema for backward

            compatibility with callers that already send it.

            '
        agentCapabilities:
          $ref: '#/components/schemas/AgentCapabilities'
        runId:
          type: string
          format: uuid
          description: 'Client-generated identifier for this regeneration run. Send it

            here to enable `POST .../cancel {runId}` while it is still

            generating.

            '
    AddMessageRequest:
      type: object
