    MessagePart:
      type: object
      additionalProperties: false
      description: 'One entry in the ordered agent-activity transcript for a message turn.

        Every field beyond `type` is optional and depends on the part kind, and

        `sub_agent` nests this same shape recursively under `parts`.


        Tool results here are always a bounded preview, never the full payload —

        `artifactId` points at the complete result.

        '
      properties:
        type:
          type: string
          enum:
          - text
          - reasoning
          - tool_call
          - sub_agent
        content:
          type: string
        toolCallId:
          type: string
        toolName:
          type: string
        displayName:
          type: string
        args:
          type: string
        argsSummary:
          type: string
          description: Human-readable summary of `args`, computed server-side.
        status:
          type: string
          enum:
          - running
          - completed
          - failed
          - blocked
        resultPreview:
          type: string
        resultSummary:
          type: string
          description: 'Human-readable summary of the tool result, computed server-side from

            the full untruncated output.

            '
        artifactId:
          type: string
          description: Blob-backed artifact id for the full tool result.
        runId:
          type: string
        roleName:
          type: string
        isFinal:
          type: boolean
          description: 'Set on the single root-level `text` part carrying the answer. Every

            other root `text` part is an abandoned preamble turn. Never set on

            child parts nested under a `sub_agent`.

