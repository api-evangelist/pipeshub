                                        - string
                                        - 'null'
                                      end:
                                        type:
                                        - string
                                        - 'null'
                                  applied:
                                    type: boolean
                          messageFilters:
                            type: object
                            additionalProperties: false
                            properties:
                              messageType:
                                type: object
                                additionalProperties: false
                                properties:
                                  values:
                                    type: array
                                    items:
                                      type: string
                                  description:
                                    type: string
                                  current:
                                    type:
                                    - string
                                    - 'null'
                                  applied:
                                    type: boolean
                          sortingMessages:
                            type: object
                            additionalProperties: false
                            description: Sort applied to messages within the conversation (separate from the conversation-list `sorting` block).
                            properties:
                              sortBy:
                                type: object
                                additionalProperties: false
                                properties:
                                  values:
                                    type: array
                                    items:
                                      type: string
                                  default:
                                    type: string
                                  description:
                                    type: string
                                  current:
                                    type: string
                              sortOrder:
                                type: object
                                additionalProperties: false
                                properties:
                                  values:
                                    type: array
                                    items:
                                      type: string
                                  default:
                                    type: string
                                  description:
                                    type: string
                                  current:
                                    type: string
                  meta:
                    type: object
                    additionalProperties: false
                    properties:
                      requestId:
                        type: string
                      timestamp:
                        type: string
                        format: date-time
                      duration:
                        type: integer
                        description: Server processing time in milliseconds
                      conversationId:
                        type: string
                        format: objectId
                      messageCount:
                        type: integer
                        description: Total number of messages in the conversation
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - No access to this conversation
        '404':
          description: Conversation not found
    delete:
      tags:
      - Conversations
      summary: Delete conversation
      description: 'Delete a conversation by its ID.


        **Overview:**


        Performs a soft delete by setting `isDeleted: true`. The conversation is

        removed from listings but preserved in the database. All citations

        referenced by messages in the conversation are also soft-deleted.


        **Permissions:**


        The conversation initiator can always delete. Users the conversation has

        been shared with may delete it only when their `sharedWith.accessLevel`

        is `write`.'
      operationId: deleteConversationById
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      - oauth2:
        - conversation:write
      parameters:
      - name: conversationId
        in: path
        required: true
        description: Unique conversation identifier
        schema:
          type: string
          format: objectId
      responses:
        '200':
          description: Conversation deleted successfully
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  id:
                    type: string
                    format: objectId
                    description: Identifier of the conversation that was deleted
                  status:
                    type: string
                    enum:
                    - deleted
                    description: Outcome of the operation
                  deletedAt:
                    type: string
                    format: date-time
                    description: Timestamp when the conversation was marked deleted
                  deletedBy:
                    type: string
                    format: objectId
                    description: Identifier of the user who performed the delete
                  citationsDeleted:
                    type: integer
                    description: Number of citations soft-deleted alongside the conversation
                  meta:
                    type: object
                    additionalProperties: false
                    properties:
                      requestId:
                        type: string
                        description: Server-assigned identifier for the request
                      timestamp:
                        type: string
                        format: date-time
                        description: Server time the response was produced
                      duration:
                        type: integer
                        description: Server processing time in milliseconds
        '400':
          description: Invalid `conversationId` path parameter
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - token is missing the `conversation:write` scope
        '404':
          description: Conversation not found, already deleted, or caller has no delete access
        '500':
          description: Internal server error while deleting the conversation
    servers:
    - url: '{instance_url}/api/v1'
      description: Base API URL
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL (without /api/v1)
    - url: '{instance_url}'
      description: Root URL (used for MCP endpoints mounted at /mcp)
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL
  /conversations/{conversationId}/messages:
    post:
      tags:
      - Conversations
      summary: Add message (non-streaming)
      description: 'Ask a follow-up in an existing assistant conversation and wait for

        the complete answer. The JSON counterpart of

        `POST /conversations/{conversationId}/messages/stream`. Earlier turns

        are sent to the model as history; project context comes from the

        conversation, never from the request.


        **How a turn runs**


        1. The user''s message is saved (in its own short transaction on a

        replica set).

        2. The AI backend runs the same agent-loop pipeline as the `/stream`

        route and returns only its final result. No transaction is held

        during this call, and the call is never retried.

        3. The answer, citations and status are saved exactly as the

        streaming route saves them, and the updated conversation is

        returned.


        Every failure after step 1 is persisted: the conversation ends with

        status `Failed`, a `failReason`, and an `error` message, and the

        response carries `X-Conversation-Id` so the caller can fetch it.

        A 4xx from the AI backend (for example no model configured) keeps

        its status and user-facing message; other failures return 500 with

        a generic message.


        The response arrives only when the whole answer is ready, which can

        take minutes for agent runs. Allow a generous client and proxy

        timeout, or use the `/stream` variant for interactive clients.'
      operationId: addMessage
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      - oauth2:
        - conversation:chat
      parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: objectId
      requestBody:
        required: true
        description: The follow-up question, with optional scope and model overrides.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMessageRequest'
      responses:
        '200':
          description: The conversation with the new question and answer.
          headers:
            X-Conversation-Id:
              $ref: '#/components/headers/X-Conversation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddMessageResponse'
        '400':
          description: 'Invalid request — `query` is missing or empty, contains markup or

            printf-style format specifiers, or another field fails validation.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized — valid bearer token required.
        '403':
          description: Forbidden — the token lacks the `conversation:chat` OAuth scope.
        '404':
          description: 'Conversation not found — it does not exist, belongs to another

            user, is of the other type (assistant vs agent), or, for agent

            routes, belongs to a different agent.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: The request is larger than the selected model accepts.
          headers:
            X-Conversation-Id:
              $ref: '#/components/headers/X-Conversation-Id'
        '422':
          description: The model provider's content filter blocked the request.
          headers:
            X-Conversation-Id:
              $ref: '#/components/headers/X-Conversation-Id'
        '424':
          description: 'No usable LLM — none is configured for the organization, or the

            selected one could not start. The message says what to fix.

            '
          headers:
            X-Conversation-Id:
              $ref: '#/components/headers/X-Conversation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: The model provider is rate limiting or out of quota.
          headers:
            X-Conversation-Id:
              $ref: '#/components/headers/X-Conversation-Id'
        '500':
          description: 'The answer failed (AI service unreachable, timed out, returned

            no answer, or could not be saved). The conversation is kept with

            status `Failed` and an `error` message.

            '
          headers:
            X-Conversation-Id:
              $ref: '#/components/headers/X-Conversation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    servers:
    - url: '{instance_url}/api/v1'
      description: Base API URL
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL (without /api/v1)
    - url: '{instance_url}'
      description: Root URL (used for MCP endpoints mounted at /mcp)
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL
  /conversations/{conversationId}/messages/stream:
    post:
      tags:
      - Conversations
      summary: Add message to a conversation with streaming response
      description: 'Add a follow-up message to an existing conversation and stream the

        assistant''s response over Server-Sent Events.


        Functionally equivalent to `POST /conversations/{conversationId}/messages`

        but the response is delivered as an SSE stream so clients can render

        the answer incrementally.


        AG-UI is the sole wire protocol. The vocabulary is described by

        `ConversationMessageStreamSSEEvent`; it is the same event set as

        `/conversations/stream`, while the terminal result reflects an

        existing conversation.'
      operationId: addMessageStream
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      - oauth2:
        - conversation:chat
      parameters:
      - name: conversationId
        in: path
        required: true
        description: 'Identifier of the conversation to append the message to. The

          conversation must belong to the caller and must not be deleted.

          '
        schema:
          type: string
          format: objectId
      requestBody:
        required: true
        description: Request payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationMessageStreamRequest'
      responses:
        '200':
          description: 'SSE stream established. The body is a sequence of

            `text/event-stream` frames using the event vocabulary described

            on the schema below.

            '
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ConversationMessageStreamSSEEvent'
        '400':
          description: 'Invalid request — `query` is missing or empty, or another field

            fails validation (for example a malformed `currentTime`).

            '
        '401':
          description: Unauthorized — valid bearer token required.
        '403':
          description: 'Forbidden — the caller''s token does not include the

            `conversation:chat` OAuth scope.

            '
        '404':
          description: 'The conversation does not exist, is deleted, or does not belong

            to the caller.

            '
        '500':
          description: 'Internal error before the SSE stream is established (for

            example, the user message could not be persisted to the

            conversation). Once the stream is open, terminal failures are

            surfaced as a `RUN_ERROR` SSE event instead of an HTTP status

            change.

            '
    servers:
    - url: '{instance_url}/api/v1'
      description: Base API URL
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL (without /api/v1)
    - url: '{instance_url}'
      description: Root URL (used for MCP endpoints mounted at /mcp)
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL
  /conversations/{conversationId}/share:
    post:
      tags:
      - Conversations
      summary: Share conversation with users
      description: 'Share a conversation with other users in your organization.


        **Overview:**


        Allows the conversation owner to grant access to other users.

        Shared users can view the conversation and optionally add messages.


        **Access Levels:**


        - `read` - Can view conversation and messages (default)

        - `write` - Can view and add new messages


        **Permissions:**


        Only the conversation initiator (owner) can share. Users must belong

        to the same organization.'
      operationId: shareConversation
      security:
      - bearerAuth: []
      - oauth2:
        - conversation:write
      parameters:
      - name: conversationId
        in: path
        required: true
        description: Unique conversation identifier
        schema:
          type: string
          format: objectId
      requestBody:
        required: true
        description: Request payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareRequest'
      responses:
        '200':
          description: Conversation shared successfully
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - id
                - isShared
                - sharedWith
                - meta
                properties:
                  id:
                    type: string
                    format: objectId
                    description: Conversation identifier
                  isShared:
                    type: boolean
                    description: Always `true` after a successful share
                  sharedWith:
                    type: array
                    description: Full list of users the conversation is now shared with, including pre-existing entries.
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - userId
                      - accessLevel
                      - _id
                      properties:
                        userId:
                          type: string
                          format: objectId
                        accessLevel:
                          type: string
                          enum:
                          - read
                          - write
                        _id:
                          type: string
                          format: objectId
                          description: Subdocument identifier auto-assigned by MongoDB.
                  meta:
                    type: object
                    additionalProperties: false
                    required:
                    - requestId
                    - timestamp
                    - duration
                    properties:
                      requestId:
                        type: string
                        description: 'Server-side request identifier. Read from the

                          `X-Request-ID` header when supplied, otherwise

                          auto-generated, so this field is always present.

                          '
                      timestamp:
                        type: string
                        format: date-time
                      duration:
                        type: integer
                        description: Server-side processing time in milliseconds.
        '400':
          description: Invalid request - userIds array required
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Only owner can share
        '404':
          description: Conversation or users not found
    servers:
    - url: '{instance_url}/api/v1'
      description: Base API URL
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL (without /api/v1)
    - url: '{instance_url}'
      description: Root URL (used for MCP endpoints mounted at /mcp)
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL
  /conversations/{conversationId}/title:
    patch:
      tags:
      - Conversations
      summary: Update conversation title
      description: 'Update the title of a conversation.


        **Overview:**


        Conversation titles are auto-generated from the first query by default.

        Use this endpoint to set a custom, more descriptive title.


        **Title limits:**


        - Minimum: 1 character

        - Maximum: 200 characters


        **Permissions:**


        The conversation must exist, belong to the calling user''s organization,

        be owned by the caller (matched on `userId`), and not be soft-deleted.'
      operationId: updateConversationTitle
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      - oauth2:
        - conversation:write
      parameters:
      - name: conversationId
        in: path
        required: true
        description: Unique conversation identifier
        schema:
          type: string
          format: objectId
      requestBody:
        required: true
        description: Request payload
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - title
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: New conversation title
                  example: Q4 Sales Analysis Discussion
      responses:
        '200':
          description: Title updated successfully
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - conversation
                - meta
                properties:
                  conversation:
                    type: object
                    additionalProperties: false
                    description: 'The conversation document after the title update, as

                      stored in the `chatSessions` collection.


                      Carries no `messages`: they live in `chatSessionMessages`

                      (see `chat.session.schema.ts`) and this route neither

                      reads nor joins them. Fetch the conversation by id to

                      get its messages.

                      '
                    required:
                    - _id
                    - userId
                    - orgId
                    - initiator
                    - isShared
                    - isDeleted
                    - isArchived
                    - sharedWith
                    - conversationErrors
                    - lastActivityAt
                    - createdAt
                    - updatedAt
                    - __v
                    properties:
                      _id:
                        type: string
                        format: objectId
                        description: Unique conversation identifier
                      userId:
                        type: string
                        format: objectId
                        description: ID of the user who owns this conversation
                      orgId:
                        type: string
                        format: objectId
                        description: Organization this conversation belongs to
                      title:
                        type: string
                        description: 'Conversation title. Present and equal to the value

                          submitted in the request body after a successful

                          update.

                          '
                      initiator:
                        type: string
                        format: objectId
                        description: User who started the conversation
                      status:
                        type: string
                        enum:
                        - None
                        - Inprogress
                        - Complete
                        - Failed
                        - Stopped
                        description: 'Current status of the conversation:

                          - `None` — no activity yet

                          - `Inprogress` — AI is processing

                          - `Complete` — response ready

                          - `Failed` — error occurred

                          - `Stopped` — cancelled, or the client disconnected mid-answer

                          '
                      failReason:
                        type: string
                        description: 'Error description, populated only when `status`

                          is `Failed`.

                          '
                      modelInfo:
                        $ref: '#/components/schemas/ConversationModelInfo'
                      isShared:
                        type: boolean
                        default: false
                        description: Whether this conversation is shared with others
                      shareLink:
                        type: string
                        description: Shareable link if the conversation is shared
                      sharedWith:
                        type: array
                        description: Users this conversation is shared with
                        items:
                          type: object
                          additionalProperties: false
                          required:
                          - userId
                          - accessLevel
                          properties:
                            userId:
                              type: string
                              format: objectId
                            accessLevel:
                              type: string
                              enum:
                              - read
                              - write
                              default: read
                      isArchived:
                        type: boolean
                        default: false
                        description: Whether this conversation is archived
                      archivedBy:
                        type:
                        - string
                        - 'null'
                        format: objectId
                        description: 'User ID of the last user who archived this row, or `null` after

                          unarchive cleared the archive state. Absent on rows that have

                          never been archived.

                          '
                      isDeleted:
                        type: boolean
                        default: false
                        description: Whether this conversation has been soft-deleted.
                      deletedBy:
                        type: string
                        format: objectId
                        description: User who soft-deleted this conversation.
                      conversationErrors:
                        type: array
                        description: 'Errors recorded against this conversation

                          (e.g. failed message generations).

                          '
                        items:
                          type: object
                          additionalProperties: false
                          required:
                          - _id
                          - message
                          - timestamp
                          properties:
                            _id:
                              type: string
                              format: objectId
                              description: Sub-document identifier auto-assigned by MongoDB.
                            message:
                              type: string
                            errorType:
                              type: string
                            timestamp:
                              type: string
                              format: date-time
                              description: 'Time the error was recorded. Server-defaulted

                                to `Date.now` when the entry is pushed, so

                                always present.

                                '
                            messageId:
                              type: string
                              format: objectId
                            stack:
                              type: string
                            metadata:
                              type: object
                              additionalProperties: true
                              description: 'Free-form metadata attached to this error

                                entry (Map of Mixed in the schema).

                                '
                      metadata:
                        type: object
                        additionalProperties: true
                        description: Free-form metadata attached to the conversation.
                      lastActivityAt:
                        type: integer
                        format: int64
                        description: 'Unix timestamp of the last activity, stored as

                          epoch milliseconds (server-side default `Date.now`).

                          '
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
                      __v:
                        type: integer
                        description: Mongoose document version key.
                  meta:
                    type: object
                    additionalProperties: false
                    required:
                    - requestId
                    - timestamp
                    - duration
                    properties:
                      requestId:
                        type: string
                        description: 'Server-side request identifier. Read from the

                          `X-Request-ID` header when supplied, otherwise

                          auto-generated, so this field is always present.

                          '
                      timestamp:
                        type: string
                        format: date-time
                      duration:
                        type: integer
                        description: Server-side processing time in milliseconds.
        '400':
          description: 'Invalid request. Possible causes:


            - `title` missing, empty, or longer than 200 characters.

            - `conversationId` path parameter is not a valid ObjectId.

            '
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - token is missing the `conversation:write` scope
        '404':
          description: Conversation not found, soft-deleted, or not owned by the caller.
        '500':
          description: Persistence layer failed to update the conversation document.
    servers:
    - url: '{instance_url}/api/v1'
      description: Base API URL
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL (without /api/v1)
    - url: '{instance_url}'
      description: Root URL (used for MCP endpoints mounted at /mcp)
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL
  /conversations/{conversationId}/archive:
    patch:
      tags:
      - Conversations
      summary: Archive conversation
      description: 'Archive a conversation to hide it from the main list.


        **Overview:**


        Archived conversations are preserved but hidden from the default conversation list.

        Use archiving to clean up your workspace without permanently deleting conversations.


        **Access:**


        The caller must be the conversation''s initiator, or be listed in `sharedWith`

        with `accessLevel: write`. Already-archived conversations return `400`.


        **Retrieval:**


        View archived conversations using `GET /conversations/show/archives`.

        Restore one with `PATCH /conversations/{conversationId}/unarchive`.'
      operationId: archiveConversation
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      - oauth2:
        - conversation:write
      parameters:
      - name: conversationId
        in: path
        required: true
        description: Conversation identifier
        schema:
          type: string
          format: objectId
      responses:
        '200':
          description: Conversation archived successfully
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  id:
                    type: string
                    format: objectId
                    description: Conversation identifier
                  status:
                    type: string
                    enum:
                    - archived
                    description: New archive status of the conversation
                  archivedBy:
                    type: string
                    format: objectId
                    description: User who archived the conversation
                  archivedAt:
                    type: string
                    format: date-time
                    description: Timestamp when the conversation was archived
                  meta:
                    type: object
                    additionalProperties: false
                    properties:
                      requestId:
                        type: string
                        description: Request correlation identifier
                      timestamp:
                        type: string
                        format: date-time
                        description: Response generation timestamp
                      duration:
                        type: integer
                        description: Server processing time in milliseconds
        '400':
          description: Conversation is already archived
        '401':
          description: Unauthorized
        '404':
          description: Conversation not found or caller lacks archive permission
    servers:
    - url: '{instance_url}/api/v1'
      description: Base API URL
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL (without /api/v1)
    - url: '{instance_url}'
      description: Root URL (used for MCP endpoints mounted at /mcp)
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL
  /conversations/{conversationId}/unarchive:
    patch:
      tags:
      - Conversations
      summary: Unarchive conversation
      description: 'Restore an archived conversation.


        - Path params: `conversationId`

        - Query params: none

        - Body: none'
      operationId: unarchiveConversation
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      - oauth2:
        - conversation:write
      parameters:
      - name: conversationId
        in: path
        required: true
        description: Conversation identifier
        schema:
          type: string
          format: objectId
      responses:
        '200':
          description: Conversation unarchived successfully
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  id:
                    type: string
                    format: objectId
                    description: Conversation identifier
                  status:
                    type: string
                    enum:
                    - unarchived
                    description: New archive status of the conversation
                  unarchivedBy:
                    type: string
                    format: objectId
                    description: User who unarchived the conversation
                  unarchivedAt:
                    type: string
                    format: date-time
                    description: Timestamp when the conversation was unarchived
                  meta:
                    type: object
                    additionalProperties: false
                    properties:
                      requestId:
                        type: string
                        description: Request correlation identifier
                      timestamp:
                        type: string
                        format: date-time
                        description: Response generation timestamp
                      duration:
                        type: integer
                        description: Server processing time in milliseconds
        '400':
          description: Conversation is not currently archived
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - token is missing the `conversation:write` scope
        '404':
          description: Conversation not found or caller lacks unarchive permission
        '500':
          description: Persistence layer failed to update the conversation document.
    servers:
    - url: '{instance_url}/api/v1'
      description: Base API URL
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL (without /api/v1)
    - url: '{instance_url}'
      description: Root URL (used for MCP endpoints mounted at /mcp)
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL
  /conversations/{conversationId}/message/{messageId}/regenerate:
    post:
      tags:
      - Conversations
      summary: Regenerate AI response
      description: 'Regenerate the AI response for a specific message and stream the new

        answer over Server-Sent Events.


        **Overview:**


        If you''re not satisfied with an AI response, use this endpoint to generate

        a new answer. The original user query is re-processed and a new bot

        response replaces the previous one in place.


        **Constraints:**


        - Only the *last* message of the conversation can be regenerated.

        - The target message must be of type `bot_response`.


        **Use Cases:**


        - Response was incomplete or unclear

        - Want to try a different AI model

        - New documents have been indexed since original response


        **Model Override:**


        Specify `modelKey` to use a different model for regeneration.


        **Streaming:**


        The response is delivered as an AG-UI `text/event-stream` stream.

        Routing still depends on `chatMode`: `internal_search` and

        `web_search` use the assistant backend, while `agent` uses the

        universal agent loop. See `SSEEvent` for the event vocabulary.'
      operationId: regenerateAnswer
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      - oauth2:
        - conversation:chat
      parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: objectId
      - name: messageId
        in: path
        required: true
        description: ID of the message to regenerate response for
        schema:
          type: string
          format: objectId
      requestBody:
        description: Request payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegenerateRequest'
      responses:
        '200':
          description: 'SSE stream established. The body is a sequence of

            `text/event-stream` frames using the event vocabulary described

            on `SSEEvent`. The exact subset of events emitted depends on

            `chatMode` (see the route description for routing rules).


            The gateway emits a root `RUN_FINISHED` as `{ type, result }`

            after persistence and a root `RUN_ERROR` as

            `{ type, message, code? }` on failure. Forwarded lifecycle and

            child-run events may contain `runId`, `threadId`, and

            `parentRunId`. Clients should ignore unknown event names.

            '
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SSEEvent'
        '400':
          description: 'Cannot regenerate. Common causes: target message is not the last

            message in the conversation, target message is not of type

            `bot_response`, or no preceding `user_query` exists.

            '
        '401':
          description: Unauthorized
        '404':
          description: Conversation or message not found
    servers:
    - url: '{instance_url}/api/v1'
      description: Base API URL
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL (without /api/v1)
    - url: '{instance_url}'
      description: Root URL (used for MCP endpoints mounted at /mcp)
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL
  /conversations/{conversationId}/cancel:
    post:
      tags:
      - Conversations
      summary: Cancel an in-flight chat stream
      description: 'Cooperatively stop a `POST /conversations/stream` or

        `POST /conversations/{conversationId}/messages/stream` run that is

        still generating, using the `runId` sent when that stream started.


        This is a synchronous JSON ack, not another SSE stream. The

        cancelled run''s own stream (if still connected) receives a terminal

        frame with a `stopped` status and whatever partial answer had

        already generated; nothing further is delivered here.


        `{ cancelled: false }` — not an error — covers a `runId` that

        already finished or was never registered; the caller only needs to

        know the stream is not running anymore, not why.


        `runId` must belong to a run started on THIS `conversationId` — a

        `runId` that exists but was registered under a different

        conversation (even one owned by the same caller) is rejected with

        `403`, same as a `runId` owned by a different user/org.'
      operationId: cancelConversationStream
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      - oauth2:
        - conversation:chat
      parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: objectId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - runId
              properties:
                runId:
                  type: string
                  format: uuid
                  description: The `runId` sent when the stream was started.
      responses:
        '200':
          description: Cancellation requested, or the run had already finished.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelled:
                    type: boolean
        '400':
          description: Missing or malformed `runId`.
        '401':
          description: Unauthorized
        '403':
          description: '`runId` exists but was registered under a different user, org, or conversation than this request.'
        '404':
          description: Conversation not found or unauthorized
    servers:
    - url: '{instance_url}/api/v1'
      description: Base API URL
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL (without /api/v1)
    - url: '{instance_url}'
      description: Root URL (used for MCP endpoints mounted at /mcp)
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL
  /conversations/{conversationId}/message/{messageId}/feedback:
    post:
      tags:
      - Conversations
      summary: Submit feedback on AI response
      description: 'Append a feedback entry to a bot-response message.


        **Overview**


        Feedback helps improve AI response quality over time. You can record an

        overall helpfulness signal, issue categories, and free-text comments.

        Each call appends a new entry to the message; previous entries are

        preserved.


        **Feedback options**


        - `isHelpful` — overall thumbs up/down.

        - `categories` — issue or positive categories from a fixed list.

        - `comments` — free-text `positive` and `negative`.


        **Restrictions**


        Feedback can only be submitted on `bot_response` messages — user

        queries and system messages are rejected with `400`.'
      operationId: updateMessageFeedback
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      - oauth2:
        - conversation:write
      parameters:
      - name: conversationId
        in: path
        required: true
        description: Unique conversation identifier.
        schema:
          type: string
          format: objectId
      - name: messageId
        in: path
        required: true
        description: Identifier of the bot-response message being rated.
        schema:
          type: string
          format: objectId
      requestBody:
        required: true
        description: Request payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageFeedbackSubmitRequest'
      responses:
        '200':
          description: Feedback submitted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageFeedbackUpdateResponse'
        '400':
          description: 'Invalid request. Possible causes:


            - Feedback target is not a `bot_response` message.

            - A `categories` value is not in the allowed list.

            - `conversationId` or `messageId` is not a valid ObjectId.

            '
        '401':
          description: Unauthorized.
        '404':
          description: 'Conversation or message not found, or the caller does not have

            access to this conversation.

            '
        '500':
          description: Persistence layer failed to append the feedback entry.
    servers:
    - url: '{instance_url}/api/v1'
      description: Base API URL
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL (without /api/v1)
    - url: '{instance_url}'
      description: Root URL (used for MCP endpoints mounted at /mcp)
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL
  /conversations/{conversationId}/unshare:
    post:
      tags:
      - Conversations
      summary: Unshare a conversation
      description: Revoke sharing for a conversation, making it private again.
      operationId: unshareConversationById
      security:
      - bearerAuth: []
      - oauth2:
        - conversation:write
      parameters:
      - name: conversationId
        in: path
        required: true
        description: Unique conversation identifier
        schema:
          type: string
          format: objectId
      requestBody:
        required: true
        description: Request payload
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - userIds
              properties:
                userIds:
                  type: array
                  items:
                    type: string
                    format: objectId
                  minItems: 1
                  description: IDs of users to remove from the conversation's share list.
                  example:
                  - 507f1f77bcf86cd799439011
      responses:
        '200':
          description: Conversation unshared successfully
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - id
                - isShared
                - sharedWith
                - unsharedUsers
                - meta
                properties:
                  id:
                    type: string
                    format: objectId
                    description: Conversation identifier
                  isShared:
                    type: boolean
                    description: 'Reset to `false` when the last user is removed; otherwise

                      remains `true`.

                      '
                  sharedWith:
                    type: array
                    description: 'Remaining users with access after the requested userIds

                      were removed. Empty array when no one is left.

                      '
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - userId
                      - accessLevel
                      - _id
                      properties:
                        userId:
                          type: string
                          format: objectId
                        accessLevel:
                          type: string
                          enum:
                          - read
                          - write
                        _id:
                          type: string
                          format: objectId
                          description: Subdocument identifier auto-assigned by MongoDB.
                  unsharedUsers:
                    type: array
                    description: Echo of the `userIds` from the request body.
                    items:
                      type: string
                      format: objectId
                  meta:
                    type: object
                    additionalProperties: false
                    required:
                    - requestId
                    - timestamp
                    - duration
                    properties:
                      requestId:
                        type: string
                        description: 'Server-side request identifier. Read from the

                          `X-Request-ID` header when supplied, otherwise

                          auto-generated, so this field is always present.

                          '
                      timestamp:
                        type: string
                        format: date-time
                      duration:
                        type: integer
                        description: Server-side processing time in milliseconds.
        '400':
          description: 'Invalid request. Possible causes:


            - `userIds` empty, missing, or not an array.

            - One or more `userIds` is not a valid ObjectId.

            '
        '401':
          description: Unauthorized
        '404':
          description: Conversation not found, or caller is not the initiator.
        '500':
          description: Persistence layer failed to update the conversation document.
    servers:
    - url: '{instance_url}/api/v1'
      description: Base API URL
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL (without /api/v1)
    - url: '{instance_url}'
      description: Root URL (used for MCP endpoints mounted at /mcp)
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL
  /conversations/{conversationId}/project:
    put:
      tags:
      - Conversations
      summary: Link or unlink a conversation to a project
      description: 'Set (`projectId: `) or clear (`projectId: null`) the project this

        conversation belongs to. Initiator-only.


        **Access:**


        The caller must be the conversation''s initiator. Linking to a

        non-null `projectId` also requires at least viewer access to that

        project (`404` if not visible to the caller — never `403`, to avoid

        leaking project existence across an org boundary).


        **Visibility on link:**


        When linking, `projectVisibility` defaults from the project''s

        `chatSharing` setting (`members` → `project`, otherwise `private`)

        unless the conversation was already `project`-visible, in which case

        that is preserved. Use

        `PATCH /conversations/{conversationId}/project-visibility` to

        override it explicitly. Unlinking (`projectId: null`) always clears

        both `projectId` and `projectVisibility`.'
      operationId: setConversationProject
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      - oauth2:
        - conversation:write
      parameters:
      - name: conversationId
        in: path
        required: true
        description: Unique conversation identifier
        schema:
          type: string
          format: objectId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - projectId
              properties:
                projectId:
                  type:
                  - string
                  - 'null'
                  format: objectId
                  description: Target project id, or `null` to unlink.
      responses:
        '200':
          description: Conversation's project link updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - conversationId
                properties:
                  conversationId:
                    type: string
                    format: objectId
                  projectId:
                    type:
                    - string
                    - 'null'
                    format: objectId
                  projectVisibility:
                    type:
                    - string
                    - 'null'
                    enum:
                    - private
                    - project
        '400':
          description: '`projectId` missing or not a valid ObjectId/`null`.'
        '401':
          description: Unauthorized
        '404':
          description: 'Conversation not found or caller is not the initiator, or the

            target project does not exist or is not visible to the caller.

            '
    servers:
    - url: '{instance_url}/api/v1'
      description: Base API URL
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL (without /api/v1)
    - url: '{instance_url}'
      description: Root URL (used for MCP endpoints mounted at /mcp)
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL
  /conversations/{conversationId}/project-visibility:
    patch:
      tags:
      - Conversations
      summary: Override a conversation's project visibility
      description: 'Explicitly set whether a project-linked conversation is visible to

        other members of that project (`project`) or only to its owner

        (`private`). Initiator-only. Requires the conversation to already be

        linked to a project via

        `PUT /conversations/{conversationId}/project`.'
      operationId: setConversationProjectVisibility
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      - oauth2:
        - conversation:write
      parameters:
      - name: conversationId
        in: path
        required: true
        description: Unique conversation identifier
        schema:
          type: string
          format: objectId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - visibility
              properties:
                visibility:
                  type: string
                  enum:
                  - private
                  - project
      responses:
        '200':
          description: Conversation's project visibility updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - conversationId
                - projectVisibility
                properties:
                  conversationId:
                    type: string
                    format: objectId
                  projectVisibility:
                    type: string
                    enum:
                    - private
                    - project
        '400':
          description: '`visibility` missing/invalid, or the conversation is not linked

            to a project.

            '
        '401':
          description: Unauthorized
        '404':
          description: Conversation not found or caller is not the initiator.
    servers:
    - url: '{instance_url}/api/v1'
      description: Base API URL
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL (without /api/v1)
    - url: '{instance_url}'
      description: Root URL (used for MCP endpoints mounted at /mcp)
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL
  /projects/{projectId}/conversations:
    get:
      tags:
      - Conversations
      summary: List a project's conversations
      description: 'Requires viewer access to the project. Returns both chat and agent

        sessions (`chatSessions`, discriminated by `sessionType`/`agentKey`)

        that the caller may see: rows they own, plus rows with

        `projectVisibility: project`. Access to the project is asserted

        first, so a private conversation belonging to a *different* project

        member never leaks through this endpoint.'
      operationId: getProjectConversations
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      - oauth2:
        - project:read
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: objectId
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Paginated conversations linked to the project
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - conversations
                - pagination
                properties:
                  conversations:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConversationListItem'
                  pagination:
                    type: object
                    additionalProperties: false
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      totalCount:
                        type: integer
                      totalPages:
                        type: integer
        '401':
          description: Unauthorized
        '404':
          description: Project not found or not visible to the caller.
    servers:
    - url: '{instance_url}/api/v1'
      description: Base API URL
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL (without /api/v1)
    - url: '{instance_url}'
      description: Root URL (used for MCP endpoints mounted at /mcp)
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL
components:
  schemas:
    AddMessageResponse:
      type: object
      additionalProperties: false
      description: 'Envelope returned by `POST /conversations/{conversationId}/messages`.

        Contains the updated conversation, the number of citation records used

        to ground the AI response for this turn, and request metadata.

        '
      required:
      - conversation
      - recordsUsed
      - meta
      properties:
        conversation:
          $ref: '#/components/schemas/Conversation'
        recordsUsed:
          type: integer
          minimum: 0
          description: 'Number of citation records used to ground the AI response generated

            for this turn.

            '
        meta:
          type: object
          additionalProperties: false
          required:
          - timestamp
          - duration
          properties:
            requestId:
              type: string
              description: 'Request correlation id. Omitted when upstream middleware did

                not set `req.context.requestId`.

                '
            timestamp:
              type: string
              format: date-time
              description: Server timestamp when the response was sent.
            duration:
              type: integer
              minimum: 0
              description: Total handler duration in milliseconds.
            recordsUsed:
              type: integer
              minimum: 0
              description: 'Same value as the top-level `recordsUsed`. Duplicated inside

                `meta` for client convenience.

                '
    MessageReasoningTurn:
      type: object
      additionalProperties: false
      description: 'One model turn''s chain-of-thought. Persisted only when reasoning

        persistence is enabled; the array is empty otherwise.

        '
      required:
      - content
      properties:
        messageId:
          type: string
        turnIndex:
          type: number
        content:
          type: string
    AppliedFilterNode:
      type: object
      additionalProperties: false
      description: A single filter node selected by the user (used for display/persistence of active filters)
      properties:
        id:
          type: string
          description: Unique identifier of the filter node
        name:
          type: string
          description: Display name of the filter node
        nodeType:
          type: string
          description: Type of the node (e.g. app, recordGroup, folder, record)
        connector:
          type: string
          description: Connector identifier associated with this node
    Message:
      type: object
      additionalProperties: false
      description: 'A single message within a conversation. Messages can be user queries,

        AI responses, system messages, or error notifications.

        '
      properties:
        _id:
          type: string
          format: objectId
          description: Unique message identifier
        messageType:
          type: string
          enum:
          - user_query
          - bot_response
          - error
          - feedback
          - system
          - tool_call
          description: 'Type of message:

            - `user_query` - User''s question or input

            - `bot_response` - AI-generated response

            - `error` - Error message from the system

            - `feedback` - User feedback on a response

            - `system` - System notification or status

            - `tool_call` - Tool invocation turn; details are on `tools`

            '
        content:
          type: string
          description: The message text content
        contentFormat:
          type: string
          enum:
          - MARKDOWN
          - JSON
          - HTML
          description: Format of the content for rendering
          default: MARKDOWN
        citations:
          type: array
          items:
            anyOf:
            - $ref: '#/components/schemas/CitationReference'
            - $ref: '#/components/schemas/PopulatedCitationReference'
          description: 'References to source documents used in the response. Routes that

            return the saved conversation after a turn (create, add message)

            populate each item to `{ citationId, citationData }`.

            '
        confidence:
          type:
          - string
          - 'null'
          description: 'AI confidence in the answer. Present only on `bot_response` messages,

            and only when the model emitted a trailing confidence block.


            This field is now optional and nullable; it was previously always present and non-nullable. Treat a missing or `null` value as "no confidence reported" and guard before using it. Change effective in SDK v1.3.0 (v1.2.0 and earlier always populated it).

            '
        followUpQuestions:
          type: array
          items:
            $ref: '#/components/schemas/FollowUpQuestion'
          description: Suggested follow-up questions
        feedback:
          type: array
          items:
            $ref: '#/components/schemas/MessageFeedback'
          description: User feedback on this message
        metadata:
          type: object
          additionalProperties: false
          properties:
            processingTimeMs:
              type: number
              description: Time taken to generate response in milliseconds
            modelVersion:
              type: string
              description: Version of the AI model used
            aiTransactionId:
              type: string
              description: Transaction ID for tracking in AI backend
            reason:
              type: string
              description: Additional context or reasoning
        modelInfo:
          $ref: '#/components/schemas/ConversationModelInfo'
        appliedFilters:
          $ref: '#/components/schemas/AppliedFilters'
        referenceData:
          type: array
          description: 'Reference identifiers extracted from tool responses, used to scope

            follow-up queries (for example Jira project keys or record IDs).

            '
          items:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
                description: Display name shown to the user.
              id:
                type: string
                description: Technical identifier (numeric ID, UUID, etc.).
              type:
                type: string
                description: Item type (e.g. `project`, `issue`, `file`, `notebook`, `page`).
              app:
                type: string
                description: 'Source application (e.g. `jira`, `confluence`, `sharepoint`,

                  `slack`, `drive`, `gmail`).

                  '
              webUrl:
                type: string
                description: URL to open the item in a browser.
              metadata:
                type: object
                additionalProperties:
                  type: string
                description: 'App-specific fields keyed by name (e.g. `key` for a Jira project,

                  `siteId` for a SharePoint document).

                  '
        attachments:
          type: array
          description: 'Files uploaded for this message turn (see

            `POST /conversations/attachments/upload`).

            '
          items:
            $ref: '#/components/schemas/ChatAttachmentRef'
        tools:
          type: array
          description: Tool call results invoked during this message turn.
          items:
            $ref: '#/components/schemas/MessageToolCall'
        reasoning:
          type: array
          description: Persisted chain-of-thought for this turn.
          items:
            $ref: '#/components/schemas/MessageReasoningTurn'
        parts:
          type: array
          description: Ordered agent-activity transcript for this turn.
          items:
            $ref: '#/components/schemas/MessagePart'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ShareRequest:
      type: object
      description: Request to share a conversation or search with other users
      required:
      - userIds
      properties:
        userIds:
          type: array
          items:
            type: string
            format: objectId
          minItems: 1
          description: IDs of users to share with
          example:
          - 507f1f77bcf86cd799439011
        accessLevel:
          type: string
          enum:
          - read
          - write
          default: read
          description: 'Permission level for shared users:


            - `read` — Can view only

            - `write` — Can add messages

            '
    Filters:
      type: object
      additionalProperties: false
      description: 'App connector instance ids and knowledge-base / record-group ids that narrow retrieval

        for a turn. For **org assistant** chat streams, send explicit `apps` / `kb` lists.

        For **agent** chat streams, send explicit id lists, or **omit** `filters` (and `tools`)

        to let the service use the agent’s stored knowledge and tool configuration. Sending

        `{ "apps": [], "kb": [] }` on an agent stream means **no** knowledge sources for that

        turn (it is not “full org default”).

        '
      properties:
        apps:
          type: array
          items:
            type: string
          description: 'Connector instance ids to scope retrieval for this turn. Each element

            must be a valid UUID (connector app id, KB app id, record-group id, etc.).

            Gateway validation matches Zod `appOrKbIdSchema`.

            '
        kb:
          type: array
          items:
            type: string
          description: 'Knowledge-base app ids to scope retrieval for this turn.

            Each element must be a valid UUID.

            '
    ChatAttachmentRef:
      type: object
      additionalProperties: false
      description: 'Reference to an attachment produced by `POST /conversations/attachments/upload`

        (or the equivalent agent route). Include in create/stream/message bodies

        so the turn is sent with uploaded files.

        '
      required:
      - recordId
      properties:
        recordId:
          type: string
          minLength: 1
          description: Attachment record id returned from the upload endpoint.
        recordName:
          type: string
          minLength: 1
          description: Original display name of the file when known.
        mimeType:
          type: string
          minLength: 1
          description: MIME type of the uploaded file.
        extension:
          type: string
          minLength: 1
          description: File extension (e.g. `pdf`).
        virtualRecordId:
          type: string
          minLength: 1
          description: Optional synthetic record id used by the graph layer.
    CitationReference:
      type: object
      additionalProperties: false
      description: Reference to a source document cited in a response
      properties:
        citationId:
          type: string
          format: objectId
          description: ID of the citation record
        relevanceScore:
          type: number
          minimum: 0
          maximum: 1
          description: How relevant this citation is to the query (0-1)
        excerpt:
          type: string
          description: Relevant excerpt from the source document
        context:
          type: string
          description: Additional context around the citation
    ErrorResponse:
      type: object
      additionalProperties: false
      description: 'Standard error envelope returned by all errors routed through `ErrorMiddleware`.

        Applies to all `BaseError` subclasses including `HttpError`, `ValidationError`, and others.

        The `code` field is a machine-readable string identifying the error type (e.g.

        `HTTP_UNAUTHORIZED`, `HTTP_NOT_FOUND`, `VALIDATION_ERROR`, `INTERNAL_ERROR`).

        '
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          properties:
            requestId:
              type: string
              description: 'Identifier for this request, echoed so a bug report can quote it.

                Absent when the request never reached the middleware that assigns one.

                '
            code:
              type: string
              description: 'Machine-readable error code. For application errors it takes the form `HTTP_<VARIANT>`

                For unhandled runtime errors (e.g. database unavailable) it is `INTERNAL_ERROR`.

                '
              example: HTTP_BAD_REQUEST
            message:
              type: string
              description: Human-readable description of the error
              example: Admin access required
            metadata:
              type: object
              description: Additional context (only present in development environments)
              additionalProperties: true
      required:
      - error
    FollowUpQuestion:
      type: object
      additionalProperties: false
      description: AI-suggested follow-up question
      properties:
        question:
          type: string
          description: The suggested question text
        confidence:
          type: string
          description: Confidence level for this suggestion
        reasoning:
          type: string
          description: Why this question might be relevant
    CreateConversationRequest:
      type: object
      description: 'Request body for creating a new AI conversation.


        **Query Processing:**


        The query is processed through PipesHub''s AI pipeline which:


        - Performs semantic search across indexed knowledge bases

        - Retrieves relevant context from matching documents

        - Generates a response with citations to source materials

        - Suggests follow-up questions based on the conversation

        '
      required:
      - query
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 100000
          description: 'The user''s question or prompt to start the conversation.

            Supports natural language queries of any complexity.

            '
          example: What are the key findings from our Q4 financial report?
        recordIds:
          type: array
          items:
            type: string
            format: objectId
          description: 'Limit the AI''s knowledge scope to specific records/documents.

            When provided, only these records will be searched for context.

            '
          example:
          - 507f1f77bcf86cd799439011
          - 507f1f77bcf86cd799439012
        filters:
          $ref: '#/components/schemas/Filters'
        appliedFilters:
          $ref: '#/components/schemas/AppliedFilters'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/ChatAttachmentRef'
          description: 'Uploaded chat attachments to associate with this conversation turn (see

            `POST /conversations/attachments/upload`).

            '
        projectId:
          type: string
          format: objectId
          description: 'Link the new conversation to a project the caller has at least

            viewer access to. When the project''s instructions, knowledge

            scope, or files are set and this request didn''t supply its own

            `filters`/`attachments`, they are merged in as a fallback (the

            request always wins). Ignored on follow-up turns — only

            meaningful when creating a conversation.

            '
        projectVisibility:
          type: string
          enum:
          - private
          - project
          description: 'Only meaningful together with `projectId`. Overrides the

            project''s default sharing behavior for this one conversation:

            `private` keeps it visible to the owner only; `project` exposes

            it to every project member. Defaults from the project''s

            `chatSharing` setting when omitted.

            '
        modelKey:
          type: string
          description: 'Identifier for the AI model configuration to use.

            Available models depend on organization settings.

            '
          example: gpt-5.6-luna
        modelName:
          type: string
          description: Display name of the AI model
          example: gpt-5.6-luna
        modelFriendlyName:
          type: string
          description: Friendly display name of the selected model
          example: gpt-5.6-Luna
        chatMode:
          type: string
          enum:
          - agent
          - internal_search
          - web_search
          description: 'Optional execution mode for non-stream consumers of this shared

            request schema.

            `agent` uses the universal agent loop, while `internal_search`

            and `web_search` use their corresponding assistant search paths.

            '
          example: internal_search
        timezone:
          type: string
          minLength: 1
          description: 'IANA timezone identifier from the client (top-level field).

            Used to provide time-aware context to the AI.

            '
          example: America/New_York
        currentTime:
          type: string
          format: date-time
          description: 'ISO 8601 / RFC 3339 datetime from the client (top-level field; UTC `Z` or numeric offset).

            '
          example: '2026-04-12T16:00:00+05:30'
        tools:
          type: array
          items:
            type: string
            minLength: 1
          description: 'Optional list of tool identifiers (fully-qualified action names such as

            "jira.create_issue") that the AI agent is permitted to invoke for this

            request. When omitted the agent may use any configured tool. Applicable

            only when `chatMode` is `agent`.

            '
          example:
          - jira.create_issue
          - confluence.search_content
        protocol:
          type: string
          enum:
          - agui
          description: 'AG-UI is the only supported wire protocol. When present must be

            `"agui"`. Omitting the field is equivalent — the server always

            uses the AG-UI vocabulary (`RUN_STARTED`, `TEXT_MESSAGE_CONTENT`,

            etc.). Kept in the schema for backward compatibility with callers

            that already send it.

            '
        agentCapabilities:
          $ref: '#/components/schemas/AgentCapabilities'
        runId:
          type: string
          format: uuid
          description: 'Client-generated identifier for this run. Send it here to enable

            `POST /conversations/{conversationId}/cancel {runId}` while the

            stream is still generating. Optional — a caller that never sends

            one just can''t cooperatively cancel the run.

            '
    AgentCapabilities:
      type: object
      additionalProperties: false
      description: 'Per-request agent capability toggles. Only meaningful when `chatMode`

        selects an agent mode; ignored otherwise. Each field falls back to its

        own `default` below when omitted — a missing flag is not uniformly

        `true`. Omitting the whole object applies every default.

        '
      properties:
        internalSearch:
          type: boolean
          default: true
          description: Whether the agent may search internal knowledge bases for this turn.
        webSearch:
          type: boolean
          default: true
          description: Whether the agent may perform web search for this turn.
        deepSearch:
          type: boolean
          default: false
          description: Whether the agent may use deeper, higher-latency retrieval for this turn.
    ConversationStreamSSEEvent:
      type: object
      description: "Server-Sent Event envelope for public conversation streams using\n`agent`, `internal_search`, or `web_search`. AG-UI is the sole wire\nprotocol.\n\n`event` carries the AG-UI type name and `data` is a JSON-encoded\nobject that includes a `\"type\"` field matching `event`, plus\ntype-specific fields. Universal `agent` mode may emit `STEP_STARTED`,\n`STEP_FINISHED`, and nested child-run events carrying `parentRunId`.\nStable gateway-generated top-level outcomes:\n\n- `CUSTOM` (`name: \"conversation_created\"`) — fired once on\n  connection. Carries the newly created `conversationId` and\n  `title` so the client can link the stream to the new row before\n  any tokens arrive.\n- `RUN_FINISHED` — fired once after the AI backend finishes.\n  The gateway emits `{ type, result }`; `result` carries the full\n  persisted `conversation` and a `meta` block.\n- `RUN_ERROR` — fired when the stream fails. Carries a `message`\n  and optional `code`; the conversation row is marked FAILED\n  before close.\n\nForwarded upstream lifecycle or child-run events may contain `runId`,\n`threadId`, and `parentRunId`. Gateway-generated root terminal events\ndo not.\nClients should ignore unknown event names rather than treating them\nas errors.\n"
      properties:
        event:
          type: string
          enum:
          - RUN_STARTED
          - RUN_FINISHED
          - RUN_ERROR
          - STEP_STARTED
          - STEP_FINISHED
          - TEXT_MESSAGE_START
          - TEXT_MESSAGE_CONTENT
          - TEXT_MESSAGE_END
          - REASONING_START
          - REASONING_MESSAGE_START
          - REASONING_MESSAGE_CONTENT
          - REASONING_MESSAGE_END
          - REASONING_END
          - TOOL_CALL_START
          - TOOL_CALL_ARGS
          - TOOL_CALL_END
          - TOOL_CALL_RESULT
          - STATE_DELTA
          - STATE_SNAPSHOT
          - CUSTOM
          - HEARTBEAT
        data:
          type: string
          description: 'JSON-encoded event payload. The decoded JSON includes a `"type"`

            field matching `event`, plus type-specific fields. Shape depends

            on `event`. Forwarded lifecycle events may carry `runId`,

            `threadId`, and `parentRunId`.

            '
    Conversation:
      type: object
      description: 'A conversation represents a chat session between a user and the AI.

        Conversations maintain context across multiple messages and can be

        shared, archived, and organized.

        '
      properties:
        _id:
          type: string
          format: objectId
          description: Unique conversation identifier
        userId:
          type: string
          format: objectId
          description: ID of the user who owns this conversation
        orgId:
          type: string
          format: objectId
          description: Organization this conversation belongs to
        title:
          type: string
          description: 'Conversation title, auto-generated from first query

            or manually updated

            '
          example: Q4 Financial Report Discussion
        initiator:
          type: string
          format: objectId
          description: User who started the conversation
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
          description: All messages in this conversation
        status:
          type: string
          enum:
          - None
          - Inprogress
          - Complete
          - Failed
          - Stopped
          description: "Current status of the conversation:\n- `None` — no activity yet\n- `Inprogress` — AI is processing\n- `Complete` — response ready\n- `Failed` — error occurred\n- `Stopped` — cancelled, or the client disconnected mid-answer;\n  the last message keeps the partial answer\n"
        failReason:
          type: string
          description: Error description, populated only when `status` is `Failed`.
        modelInfo:
          type: object
          properties:
            modelKey:
              type: string
            modelName:
              type: string
            modelFriendlyName:
              type: string
              description: Friendly display name of the selected model
            modelProvider:
              type: string
            chatMode:
              type: string
          description: AI model configuration used
        isShared:
          type: boolean
          default: false
          description: Whether this conversation is shared with others
        shareLink:
          type: string
          description: Shareable link if conversation is shared
        sharedWith:
          type: array
          items:
            type: object
            properties:
              userId:
                type: string
                format: objectId
              accessLevel:
                type: string
                enum:
                - read
                - write
          description: Users this conversation is shared with
        isArchived:
          type: boolean
          default: false
          description: Whether this conversation is archived
        archivedBy:
          type:
          - string
          - 'null'
          format: objectId
          description: 'User ID of the last user who archived this row, or `null` after

            unarchive cleared the archive state. Absent on rows that have

            never been archived.

            '
        isDeleted:
          type: boolean
          default: false
          description: Whether this conversation has been soft-deleted.
        deletedBy:
          type: string
          format: objectId
          description: User who soft-deleted this conversation.
        conversationErrors:
          type: array
          description: Errors recorded against this conversation (e.g. failed message generations).
          items:
            type: object
            required:
            - message
            properties:
              message:
                type: string
              errorType:
                type: string
              timestamp:
                type: string
                format: date-time
              messageId:
                type: string
                format: objectId
              stack:
                type: string
              metadata:
                type: object
                additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
          description: Free-form metadata attached to the conversation.
        lastActivityAt:
          type: integer
          description: Unix timestamp of last activity
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        isOwner:
          type: boolean
          description: 'Computed per request. `true` when the requesting user is the

            conversation''s `initiator`.

            '
          readOnly: true
        accessLevel:
          type: string
          enum:
          - read
          - write
          description: 'Computed per request. The requester''s effective access level:

            their entry in `sharedWith`, or `read` by default.

            '
          readOnly: true
        projectId:
          type:
          - string
          - 'null'
          format: objectId
          description: 'The project this conversation is linked to, if any. Set via

            `PUT /conversations/{conversationId}/project` or at creation

            time; absent on conversations that were never linked.

            '
        projectVisibility:
          type:
          - string
          - 'null'
          enum:
          - private
          - project
          description: 'Only meaningful when `projectId` is set. `private` (default)

            keeps the conversation visible to its owner only; `project`

            exposes it to every member of the linked project. See

            `PATCH /conversations/{conversationId}/project-visibility`.

            '
        sharedBy:
          $ref: '#/components/schemas/ConversationSharedBy'
    MessageFeedback:
      type: object
      additionalProperties: false
      description: 'Comprehensive feedback on an AI response. Feedback helps improve

        the AI''s performance and response quality over time.

        '
      properties:
        isHelpful:
          type: boolean
          description: Overall helpfulness rating
        ratings:
          type: object
          additionalProperties: false
          properties:
            accuracy:
              type: integer
              minimum: 1
              maximum: 5
              description: How accurate was the information (1-5)
            relevance:
              type: integer
              minimum: 1
              maximum: 5
              description: How relevant was the response (1-5)
            completeness:
              type: integer
              minimum: 1
              maximum: 5
              description: How complete was the answer (1-5)
            clarity:
              type: integer
              minimum: 1
              maximum: 5
              description: How clear was the explanation (1-5)
        categories:
          type: array
          items:
            type: string
            enum:
            - incorrect_information
            - missing_information
            - irrelevant_information
            - unclear_explanation
            - poor_citations
            - excellent_answer
            - helpful_citations
            - well_explained
            - other
          description: Categories of issues or positive attributes identified
        comments:
          type: object
          additionalProperties: false
          properties:
            positive:
              type: string
              description: What was good about the response
            negative:
              type: string
              description: What could be improved
            suggestions:
              type: string
              description: Specific suggestions for improvement
        citationFeedback:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              _id:
                type: string
                format: objectId
                description: Auto-generated sub-document identifier
              citationId:
                type: string
                format: objectId
              isRelevant:
                type: boolean
              relevanceScore:
                type: integer
                minimum: 1
                maximum: 5
              comment:
                type: string
          description: Feedback on individual citations
        followUpQuestionsHelpful:
          type: boolean
          description: Were the suggested follow-up questions helpful
        unusedFollowUpQuestions:
          type: array
          items:
            type: string
          description: Follow-up questions that were suggested but not used by the user
        source:
          type: string
          enum:
          - user
          - system
          - admin
          - auto
          default: user
          description: Origin of the feedback. Always present in responses (server applies the default `user`).
        feedbackProvider:
          type: string
          format: objectId
          description: User who submitted the feedback
        timestamp:
          type: integer
          format: int64
          description: 'Time the feedback was created, stored as a Number (epoch milliseconds)

            with a server-side default of `Date.now`, so always present in responses.

            Not an ISO 8601 datetime.

            '
        revisions:
          type: array
          description: Audit trail of edits to this feedback entry
          items:
            type: object
            additionalProperties: false
            properties:
              _id:
                type: string
                format: objectId
                description: Auto-generated sub-document identifier
              updatedFields:
                type: array
                items:
                  type: string
                description: Names of feedback fields modified in this revision
              previousValues:
                type: object
                additionalProperties: true
                description: 'Map of previously-set values for the fields named in `updatedFields`,

                  keyed by field name. Stored as a Mongoose Map of Mixed values.

                  '
              updatedBy:
                type: string
                format: objectId
              updatedAt:
                type: integer
                format: int64
                description: Time the revision was recorded, as epoch milliseconds.
        metrics:
          type: object
          additionalProperties: false
          description: Optional telemetry captured alongside the feedback
          properties:
            timeToFeedback:
              type: number
              description: Time from response delivery to feedback submission
            userInteractionTime:
              type: number
              description: Total time the user spent reviewing the response
            feedbackSessionId:
              type: string
            userAgent:
              type: string
            platform:
              type: string
    ChatAttachmentUploadRef:
      type: object
      additionalProperties: false
      description: 'Concrete attachment metadata returned by `POST /conversations/attachments/upload`

        (or the equivalent agent route).

        '
      required:
      - recordId
      - recordName
      - mimeType
      - extension
      - virtualRecordId
      properties:
        recordId:
          type: string
          minLength: 1
          description: Server-assigned attachment record id.
        recordName:
          type: string
          minLength: 1
          description: Original filename stored for the attachment.
        mimeType:
          type: string
          minLength: 1
          description: MIME type of the uploaded file.
        extension:
          type: string
          minLength: 1
          description: File extension derived by the backend.
        virtualRecordId:
          type: string
          minLength: 1
          description: Synthetic record id used by the graph layer.
        parseMode:
          type: string
          minLength: 1
          description: Backend-reported parsing mode used for the attachment (e.g. `pdfplumber`, `docling`, `csv_lightweight`).
        ocrMode:
          type: string
          minLength: 1
          deprecated: true
          description: Deprecated alias for `parseMode`, kept for backward compatibility. Use `parseMode` instead.
    MessageToolCall:
      type: object
      additionalProperties: false
      description: One tool invocation recorded on a message turn.
      properties:
        toolName:
          type: string
        toolResult: {}
    ConversationStreamRequest:
      allOf:
      - $ref: '#/components/schemas/CreateConversationRequest'
      - type: object
        description: 'Request body for `POST /conversations/stream`. The public stream

          requires an explicit universal execution mode.

          '
        required:
        - chatMode
    SSEEvent:
      type: object
      description: "Server-Sent Event envelope for streaming chat responses. AG-UI is\nthe sole wire protocol.\n\n`event` carries the AG-UI type name and `data` is a JSON-encoded\nobject that includes a `\"type\"` field matching `event`, plus\ntype-specific fields. Stable gateway-generated top-level outcomes:\n\n- `RUN_FINISHED` — `{ type, result }`; `result` carries the full\n  persisted `conversation` and a `meta` block with `requestId`,\n  `timestamp` and `duration`.\n- `RUN_ERROR` — `{ type, message, code? }`. The conversation row is\n  marked FAILED before the stream closes.\n\nForwarded upstream lifecycle or child-run events may contain `runId`,\n`threadId`, and `parentRunId`. Gateway-generated root terminal events\ndo not. Clients should ignore unknown event names.\n"
      properties:
        event:
          type: string
          enum:
          - RUN_STARTED
          - RUN_FINISHED
          - RUN_ERROR
          - STEP_STARTED
          - STEP_FINISHED
          - TEXT_MESSAGE_START
          - TEXT_MESSAGE_CONTENT
          - TEXT_MESSAGE_END
          - REASONING_START
          - REASONING_MESSAGE_START
          - REASONING_MESSAGE_CONTENT
          - REASONING_MESSAGE_END
          - REASONING_END
          - TOOL_CALL_START
          - TOOL_CALL_ARGS
          - TOOL_CALL_END
          - TOOL_CALL_RESULT
          - STATE_DELTA
          - STATE_SNAPSHOT
          - CUSTOM
          - HEARTBEAT
        data:
          type: string
          description: 'JSON-encoded event payload. The decoded JSON includes a `"type"`

            field matching `event`, plus type-specific fields. Shape depends

            on `event`.

            '
    ConversationMessageStreamSSEEvent:
      type: object
      description: "Server-Sent Event envelope for public follow-up streams using `agent`,\n`internal_search`, or `web_search` on an existing conversation. AG-UI\nis the sole wire protocol.\n\n`event` carries the AG-UI type name and `data` is a JSON-encoded\nobject that includes a `\"type\"` field matching `event`, plus\ntype-specific fields. Universal `agent` mode may emit step and nested\nchild-run events. Stable gateway-generated top-level outcomes:\n\n- `CUSTOM` (`name: \"conversation_created\"`) — fired once on\n  connection.\n- `RUN_FINISHED` — fired once after the AI backend finishes.\n  The gateway emits `{ type, result }`; `result` carries\n  `{ conversation, recordsUsed, meta }`.\n  `recordsUsed` is the count of citations attached to the new\n  assistant message.\n- `RUN_ERROR` — fired when the stream fails. Carries a `message`\n  and optional `code`; the conversation row is marked FAILED\n  before close.\n\nForwarded upstream lifecycle or child-run events may contain `runId`,\n`threadId`, and `parentRunId`. Gateway-generated root terminal events\ndo not.\nClients should ignore unknown event names rather than treating them\nas errors.\n"
      properties:
        event:
          type: string
          enum:
          - RUN_STARTED
          - RUN_FINISHED
          - RUN_ERROR
          - STEP_STARTED
          - STEP_FINISHED
          - TEXT_MESSAGE_START
          - TEXT_MESSAGE_CONTENT
          - TEXT_MESSAGE_END
          - REASONING_START
          - REASONING_MESSAGE_START
          - REASONING_MESSAGE_CONTENT
          - REASONING_MESSAGE_END
          - REASONING_END
          - TOOL_CALL_START
          - TOOL_CALL_ARGS
          - TOOL_CALL_END
          - TOOL_CALL_RESULT
          - STATE_DELTA
          - STATE_SNAPSHOT
          - CUSTOM
          - HEARTBEAT
        data:
          type: string
          description: 'JSON-encoded event payload. The decoded JSON includes a `"type"`

            field matching `event`, plus type-specific fields. Shape depends

            on `event`. Forwarded lifecycle events may carry `runId`,

            `threadId`, and `parentRunId`.

            '
    CreateConversationResponse:
      type: object
      additionalProperties: false
      description: 'Envelope returned by `POST /conversations/create`. Contains the

        persisted conversation (including the initial user message and the AI

        response) plus request metadata.

        '
      required:
      - conversation
      - meta
      properties:
        conversation:
          $ref: '#/components/schemas/Conversation'
        meta:
          type: object
          additionalProperties: false
          required:
          - timestamp
          - duration
          properties:
            requestId:
              type: string
              description: 'Request correlation id. Omitted when upstream middleware did

                not set a request id on the context.

                '
            timestamp:
              type: string
              format: date-time
              description: Server timestamp when the response was sent.
            duration:
              type: integer
              minimum: 0
              description: Total handler duration in milliseconds.
    MessageFeedbackAppendEntry:
      type: object
      additionalProperties: false
      required:
      - feedbackProvider
      - timestamp
      - metrics
      description: 'The feedback entry just appended to the message. Echoes the fields

        supplied in the request plus server-stamped `feedbackProvider`,

        `timestamp`, and `metrics`.

        '
      properties:
        isHelpful:
          type: boolean
          description: Echoed from the request when supplied.
        categories:
          type: array
          description: Echoed categories from the request.
          items:
            type: string
            enum:
            - incorrect_information
            - missing_information
            - irrelevant_information
            - unclear_explanation
            - poor_citations
            - excellent_answer
            - helpful_citations
            - well_explained
            - other
        comments:
          type: object
          additionalProperties: false
