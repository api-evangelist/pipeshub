        least 1 character.


        A `UpdateUserEvent` is published to the event bus on success.


        **Authorization:** Admin or the user themselves (`userAdminOrSelfCheck` — throws `400`

        not `403`).'
      operationId: updateDesignation
      security:
      - bearerAuth: []
      - oauth2:
        - user:write
      parameters:
      - name: id
        in: path
        required: true
        description: User ID (24-character MongoDB ObjectId)
        schema:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
      requestBody:
        required: true
        description: Request payload
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - designation
              properties:
                designation:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Designation updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: 'Invalid request. Possible reasons:


            - Missing or empty `designation` (Zod)

            - Invalid user ID format (Zod)

            - Requester is not admin and is not the target user (`userAdminOrSelfCheck`)

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - Valid bearer token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Not found. Possible reasons:


            - `userId` or `orgId` missing from token (`userAdminOrSelfCheck`)

            - Organization or user not found (`userExists`)

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users/{id}/adminCheck:
    get:
      tags:
      - Users
      summary: Check if requester is admin
      description: 'Checks whether the **authenticated requester** has admin privileges in their organization.

        The `{id}` path parameter is validated for ObjectId format but is not used to look up a

        user — the check is performed on `req.user` (the token bearer), not on the target ID.


        Returns `200` if the requester is an admin. Returns `400` if not (from `userAdminCheck`

        which throws `BadRequestError`, not `ForbiddenError`).'
      operationId: adminCheck
      security:
      - bearerAuth: []
      - oauth2:
        - user:read
      parameters:
      - name: id
        in: path
        required: true
        description: User ID (validated for ObjectId format only; not checked against DB)
        schema:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
      responses:
        '200':
          description: Requester has admin access
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - message
                properties:
                  message:
                    type: string
                    example: User has admin access
        '400':
          description: 'Invalid request. Possible reasons:


            - Invalid user ID format (Zod)

            - Requester does not have admin privileges (`userAdminCheck`)

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - Valid bearer token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`userId` or `orgId` missing from token (`userAdminCheck`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users/me/role:
    get:
      tags:
      - Users
      summary: Get the requester's role
      description: 'Returns the **authenticated requester''s** current role in their organization, read

        live from the user record. Only the bearer''s own role is disclosed, so no OAuth scope

        is required.


        Returns `401` when the credentials are no longer valid — an expired or revoked

        OAuth/PAT token, an invalidated session, or a user that no longer exists. Internal

        services rely on this to stop accepting such tokens.'
      operationId: getMyRole
      security:
      - bearerAuth: []
      - oauth2: []
      responses:
        '200':
          description: The requester's role
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - role
                properties:
                  role:
                    type: string
                    enum:
                    - admin
                    - member
        '401':
          description: Unauthorized - token missing, invalid, expired or revoked, or the user no longer exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    User:
      type: object
      additionalProperties: false
      description: User account in an organization
      properties:
        _id:
          type: string
          format: ObjectId
          description: Unique user identifier (MongoDB ObjectId)
        slug:
          type: string
          description: Unique slug for the user
        orgId:
          type: string
          format: ObjectId
          description: Organization ID the user belongs to
        fullName:
          type: string
          description: Full name of the user
          minLength: 1
        firstName:
          type: string
          description: First name
        lastName:
          type: string
          description: Last name
        middleName:
          type: string
          description: Middle name
        email:
          type: string
          format: email
          description: Email address (unique, lowercase)
        mobile:
          type: string
          description: Mobile number (10-15 digits with optional +)
          pattern: ^$|^\+?[0-9]{10,15}$
        hasLoggedIn:
          type: boolean
          description: Whether user has logged in at least once
          default: false
        designation:
          type: string
          description: Job title/designation
        kind:
          type: string
          enum:
          - human
          - service
          description: 'Whether this account is a person who signs in (`human`) or a

            machine identity that automation authenticates as (`service`).

            Absent on records written before service accounts existed, which

            are all human.

            '
        description:
          type: string
          description: Free text explaining what a service account is for. Unused for people.
        isDisabled:
          type: boolean
          default: false
          description: 'The account is suspended: its tokens stop working and no session

            can be issued, but the record, its group memberships and its

            permission-graph node survive so it can be switched back on.

            '
        restoreOpId:
          type: string
          description: 'Internal and transient. Present only while a deleted service

            account is being brought back, and cleared when that finishes

            either way. It lets the steps that complete or undo a restore tell

            their own attempt from a later one. Not something to depend on.

            '
        role:
          type: string
          enum:
          - admin
          - member
          description: Organization role stored on the user document (`admin` or `member`)
        address:
          $ref: '#/components/schemas/Address'
        dataCollectionConsent:
          type: boolean
          description: Whether user has consented to data collection
        isDeleted:
          type: boolean
          description: Soft delete flag
          default: false
        deletedBy:
          type: string
          description: ID of user who deleted this user
        profilePicture:
          type:
          - string
          - 'null'
          description: Base64-encoded data URI of the user's display picture. Present in list responses when the user has uploaded a picture.
        __v:
          type: integer
          description: Document version (MongoDB)
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (ISO 8601)
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp (ISO 8601)
      required:
      - _id
      - orgId
    PaginationMetadata:
      type: object
      additionalProperties: false
      description: 'Generic pagination block emitted by `buildPaginationMetadata` (utils.ts).

        `totalPages` is `Math.ceil(totalCount / limit)`; an empty result yields

        `totalPages: 0`, not `1`.

        '
      required:
      - page
      - limit
      - totalCount
      - totalPages
      - hasNextPage
      - hasPrevPage
      properties:
        page:
          type: integer
        limit:
          type: integer
        totalCount:
          type: integer
        totalPages:
          type: integer
        hasNextPage:
          type: boolean
        hasPrevPage:
          type: boolean
    ErrorResponse:
      type: object
      additionalProperties: false
      description: 'Standard error envelope returned by all errors routed through `ErrorMiddleware`.

        Applies to all `BaseError` subclasses including `HttpError`, `ValidationError`, and others.

        The `code` field is a machine-readable string identifying the error type (e.g.

        `HTTP_UNAUTHORIZED`, `HTTP_NOT_FOUND`, `VALIDATION_ERROR`, `INTERNAL_ERROR`).

        '
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          properties:
            requestId:
              type: string
              description: 'Identifier for this request, echoed so a bug report can quote it.

                Absent when the request never reached the middleware that assigns one.

                '
            code:
              type: string
              description: 'Machine-readable error code. For application errors it takes the form `HTTP_<VARIANT>`

                For unhandled runtime errors (e.g. database unavailable) it is `INTERNAL_ERROR`.

                '
              example: HTTP_BAD_REQUEST
            message:
              type: string
              description: Human-readable description of the error
              example: Admin access required
            metadata:
              type: object
              description: Additional context (only present in development environments)
              additionalProperties: true
      required:
      - error
    UpdateUserResponse:
      type: object
      additionalProperties: false
      description: Response returned by the updateUser endpoint — all User fields plus operation metadata
      required:
      - _id
      - orgId
      - meta
      properties:
        _id:
          type: string
          format: ObjectId
          description: Unique user identifier (MongoDB ObjectId)
        slug:
          type: string
          description: Unique slug for the user
        orgId:
          type: string
          format: ObjectId
          description: Organization ID the user belongs to
        fullName:
          type: string
          description: Full name of the user
          minLength: 1
        firstName:
          type: string
          description: First name
        lastName:
          type: string
          description: Last name
        middleName:
          type: string
          description: Middle name
        email:
          type: string
          format: email
          description: Email address (unique, lowercase)
        mobile:
          type: string
          description: Mobile number (10-15 digits with optional +)
          pattern: ^$|^\+?[0-9]{10,15}$
        hasLoggedIn:
          type: boolean
          description: Whether user has logged in at least once
          default: false
        designation:
          type: string
          description: Job title/designation
        kind:
          type: string
          enum:
          - human
          - service
          description: 'Whether this account is a person who signs in (`human`) or a

            machine identity that automation authenticates as (`service`).

            Absent on records written before service accounts existed, which

            are all human.

            '
        description:
          type: string
          description: Free text explaining what a service account is for. Unused for people.
        isDisabled:
          type: boolean
          default: false
          description: 'The account is suspended: its tokens stop working and no session

            can be issued, but the record, its group memberships and its

            permission-graph node survive so it can be switched back on.

            '
        restoreOpId:
          type: string
          description: 'Internal and transient. Present only while a deleted service

            account is being brought back, and cleared when that finishes

            either way. It lets the steps that complete or undo a restore tell

            their own attempt from a later one. Not something to depend on.

            '
        role:
          type: string
          enum:
          - admin
          - member
          description: Organization role stored on the user document (`admin` or `member`)
        address:
          $ref: '#/components/schemas/Address'
        dataCollectionConsent:
          type: boolean
          description: Whether user has consented to data collection
        isDeleted:
          type: boolean
          description: Soft delete flag
          default: false
        deletedBy:
          type: string
          description: ID of user who deleted this user
        profilePicture:
          type:
          - string
          - 'null'
          description: Base64-encoded data URI of the user's display picture
        __v:
          type: integer
          description: Document version (MongoDB)
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (ISO 8601)
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp (ISO 8601)
        meta:
          type: object
          additionalProperties: false
          description: Operation metadata
          required:
          - emailChangeMailStatus
          properties:
            emailChangeMailStatus:
              type: string
              enum:
              - notNeeded
              - sent
              - failed
              description: Result of sending the email-change verification mail
    Address:
      type: object
      additionalProperties: false
      properties:
        _id:
          type: string
          format: ObjectId
          description: Optional address document id
        addressLine1:
          type: string
          description: Address line 1
        city:
          type: string
          description: City
        state:
          type: string
          description: State/Province
        postCode:
          type: string
          description: Postal/ZIP code
        country:
          type: string
          description: Country
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT Bearer token for authenticated requests.


        A personal access token (see the **Personal Access Tokens** tag) is a

        `phpat_`-prefixed variant of this same JWT — e.g. `phpat_eyJhbGci...`.

        The prefix is display-only, added for secret-scanner detectability; the

        gateway strips it before verifying the token, so send it exactly as

        issued, prefix included.

        '
    scopedToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Scoped JWT token for service-to-service authentication.

        Format: "Bearer {scoped_token}"

        Required scopes vary by endpoint.

        '
    oauth2:
      type: oauth2
      description: 'OAuth 2.0 authentication with fine-grained scopes.

        Supports authorization_code (with PKCE) and client_credentials flows.

        OAuth tokens are Bearer JWTs — use the same Authorization header as regular tokens.

        For **client_credentials**, machine JWTs may use `userId === client_id`; the Node gateway resolves the OAuth app creator — see **OAuth Provider** tag.

        '
      flows:
        authorizationCode:
          authorizationUrl: /api/v1/oauth2/authorize
          tokenUrl: /api/v1/oauth2/token
          refreshUrl: /api/v1/oauth2/token
          scopes:
            openid: OpenID Connect authentication
            profile: User profile information
            email: User email address
            offline_access: Offline access (refresh tokens)
            org:read: Read organization information
            org:write: Update organization settings
            org:admin: Full organization administration
            user:read: Read user profiles
            user:write: Update user profiles
            user:invite: Invite new users
            user:delete: Delete users
            usergroup:read: Read user groups
            usergroup:write: Create and manage user groups
            team:read: Read team information
            team:write: Create and manage teams
            kb:read: Read knowledge bases and records
            kb:write: Create and update knowledge bases
            kb:delete: Delete knowledge bases and records
            kb:upload: Upload files to knowledge bases
            semantic:read: Read semantic search results and history
            semantic:write: Execute semantic search
