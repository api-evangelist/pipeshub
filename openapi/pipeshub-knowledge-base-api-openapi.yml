openapi: 3.2.0
info:
  title: Pipeshub Knowledge Base API
  version: 1.0.0
  contact:
    name: API Support
    email: support@pipeshub.com
  description: 'Operations tagged Knowledge Base across 2 of this provider''s published API definitions: pipeshub-openapi.yaml, pipeshub-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: '{instance_url}/api/v1'
  description: Base API URL
  variables:
    instance_url:
      default: https://app.pipeshub.com
      description: Base server URL (without /api/v1)
- url: '{instance_url}'
  description: Root URL (used for MCP endpoints mounted at /mcp)
  variables:
    instance_url:
      default: https://app.pipeshub.com
      description: Base server URL
security:
- bearerAuth: []
- oauth2: []
tags:
- name: Knowledge Base
  description: Knowledge base management operations
paths:
  /knowledgeBase:
    post:
      tags:
      - Knowledge Base
      summary: Create a new knowledge base
      description: 'Create a new knowledge base for organizing and managing documents within your organization.


        **Overview:**


        A knowledge base is a container for organizing related documents, files, and content. It provides a central location for teams to collaborate on shared information.


        **Features:**


        - Hierarchical folder structure support

        - Role-based access control (OWNER, WRITER, READER)

        - Full-text search across all records

        - Integration with external connectors (Google Drive, OneDrive, etc.)

        - Automatic content indexing for AI-powered search


        **Naming Rules:**


        - Name must be 1-255 characters

        - Special characters and HTML tags are sanitized

        - Names don''t need to be unique within organization


        **Creator Permissions:**


        The user creating the KB automatically becomes the OWNER with full administrative rights.'
      operationId: createKnowledgeBase
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      - oauth2:
        - kb:write
      requestBody:
        required: true
        description: Request payload
        content:
          application/json:
            schema:
              type: object
              properties:
                kbName:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: Name of the knowledge base
                  example: Product Documentation
              required:
              - kbName
      responses:
        '200':
          description: Knowledge base created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBaseCreateResponse'
        '400':
          description: '**Invalid request:**


            - Name too short or too long

            - Invalid characters in name

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - Valid bearer token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Forbidden. Possible reasons:


            - OAuth token lacks the `kb:write` scope

            - Connector service denied the request

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found - Authenticated user does not exist in the graph database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error - Knowledge base creation failed in connector or database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service unavailable - Connector service is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - Knowledge Base
      summary: List all knowledge bases
      description: 'Retrieve a paginated list of all knowledge bases accessible to the authenticated user.


        **Overview:**


        Returns knowledge bases where the user has at least READER permission. Results include the user''s role for each KB.


        **Filtering:**


        - **search:** Full-text search on KB names (max 1000 chars)

        - **permissions:** Filter by user''s role (comma-separated: OWNER, WRITER, READER)


        **Sorting Options:**


        - `name` — Alphabetical by KB name

        - `createdAtTimestamp` — By creation date

        - `updatedAtTimestamp` — By last modification

        - `userRole` — By permission level


        **Performance:**


        Uses efficient pagination with limit/offset. For large result sets, use smaller page sizes.


        **Query parameters:**


        Only `page`, `limit`, `search`, `permissions`, `sortBy`, and `sortOrder` are allowed; unknown query keys are rejected.'
      operationId: listKnowledgeBases
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      - oauth2:
        - kb:read
      parameters:
      - name: page
        in: query
        required: false
        description: Page number (1-indexed). Omitted values default to 1.
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        required: false
        description: Results per page (max 100). Omitted values default to 20.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: search
        in: query
        required: false
        description: 'Search KB names (max 1000 chars). Rejected if it contains HTML/script tags,

          event handlers, `javascript:`, or format specifiers (validated in Zod + controller).

          '
        schema:
          type: string
          maxLength: 1000
      - name: permissions
        in: query
        required: false
        description: 'Comma-separated permission roles to filter by. Each token must be one of:

          OWNER, WRITER, READER.

          '
        schema:
          type: string
          example: OWNER,WRITER
      - name: sortBy
        in: query
        required: false
        description: Field to sort by.
        schema:
          type: string
          enum:
          - name
          - createdAtTimestamp
          - updatedAtTimestamp
          - userRole
          default: name
      - name: sortOrder
        in: query
        required: false
        description: Sort direction.
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllKnowledgeBaseResponseSchema'
        '400':
          description: '**Invalid query parameters:**


            - `page` not a positive integer

            - `limit` not between 1 and 100

            - Unknown query parameter (only `page`, `limit`, `search`, `permissions`, `sortBy`, `sortOrder` allowed)

            - Invalid `sortBy` or `sortOrder`

            - Invalid `permissions` role token

            - `search` too long, or contains HTML/scripts/format specifiers

            - Connector returned a 400 error

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized — valid bearer token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Forbidden. Possible reasons:


            - OAuth token lacks the `kb:read` scope

            - Connector service denied the request

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found — authenticated user does not exist in the graph database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error — listing knowledge bases failed in connector or database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service unavailable — connector service is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    servers:
    - url: '{instance_url}/api/v1'
      description: Base API URL
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL (without /api/v1)
    - url: '{instance_url}'
      description: Root URL (used for MCP endpoints mounted at /mcp)
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL
  /knowledgeBase/{kbId}:
    get:
      tags:
      - Knowledge Base
      summary: Get knowledge base by ID
      description: 'Retrieve detailed information about a specific knowledge base.


        **Overview:**


        Returns complete KB metadata including name, timestamps, root-level folders, and the requesting user''s role.


        **Access Control:**


        User must have at least READER permission to view KB details.'
      operationId: getKnowledgeBase
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      - oauth2:
        - kb:read
      parameters:
      - name: kbId
        in: path
        required: true
        description: Knowledge base ID (non-empty string)
        schema:
          type: string
          minLength: 1
          example: 8a095180-2989-4018-b448-70eb75fba1c7
      responses:
        '200':
          description: Knowledge base retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetKnowledgeBaseById'
        '401':
          description: Unauthorized — valid bearer token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Forbidden. Possible reasons:


            - OAuth token lacks the `kb:read` scope

            - User does not have permission to access this knowledge base

            - Connector service denied the request

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Not found. Possible reasons:


            - Knowledge base does not exist

            - Authenticated user does not exist in the graph database

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error — retrieving knowledge base failed in connector or database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service unavailable — connector service is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - Knowledge Base
      summary: Update knowledge base
      description: 'Update a knowledge base''s name.


        **Required permission:**


        User must have one of `OWNER` or `WRITER` on the knowledge base.


        **Validation:**


        - `kbId` path parameter must be a valid UUID (`updateKBSchema`)

        - When provided, `kbName` must be 1–255 characters

        - XSS and format-specifier checks are applied to `kbName` in the gateway controller'
      operationId: updateKnowledgeBase
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      - oauth2:
        - kb:write
      parameters:
      - name: kbId
        in: path
        required: true
        description: Knowledge base ID (UUID)
        schema:
          type: string
          format: uuid
          example: 8a095180-2989-4018-b448-70eb75fba1c7
      requestBody:
        required: true
        description: Fields to update. `kbName` is optional; an empty object is valid.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                kbName:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: New name for the knowledge base
                  example: Updated Documentation Hub
      responses:
        '200':
          description: Knowledge base updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateKnowledgeBaseById'
        '400':
          description: 'Invalid request. Possible reasons:


            - `kbId` is not a valid UUID (gateway `updateKBSchema`)

            - `kbName` is empty or longer than 255 characters

            - `kbName` fails XSS or format-specifier validation in the gateway controller

            - Invalid JSON request body at the connector (`Invalid request body`)

            - Connector rejected the update payload

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized — valid bearer token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Forbidden. Possible reasons:


            - OAuth token lacks the `kb:write` scope

            - User has no permission on this knowledge base

            - User role is insufficient (`READER`; requires `OWNER` or `WRITER`)

            - Connector service denied the request

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Not found. Possible reasons:


            - Knowledge base does not exist

            - Authenticated user does not exist in the graph database

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error — updating knowledge base failed in connector or database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service unavailable — connector service is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Knowledge Base
      summary: Delete knowledge base
      description: 'Permanently delete a knowledge base and all its contents.


        **Required permission:**


        User must have `OWNER` role on the knowledge base.


        **What gets deleted:**


        - All folders within the KB

        - All records and their indexed content

        - All permission grants

        - Associated storage files


        **Warning:** This action is irreversible. Consider exporting data before deletion.'
      operationId: deleteKnowledgeBase
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      - oauth2:
        - kb:delete
      parameters:
      - name: kbId
        in: path
        required: true
        description: Knowledge base ID (non-empty string)
        schema:
          type: string
          minLength: 1
          example: 8a095180-2989-4018-b448-70eb75fba1c7
      responses:
        '200':
          description: Knowledge base deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteKnowledgeBaseById'
        '401':
          description: Unauthorized — valid bearer token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Forbidden. Possible reasons:


            - OAuth token lacks the `kb:delete` scope

            - User has no permission on this knowledge base

            - User is not `OWNER` (only KB owners can delete)

            - Connector service denied the request

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Not found. Possible reasons:


            - Knowledge base does not exist

            - Authenticated user does not exist in the graph database

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error — deleting knowledge base failed in connector or database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service unavailable — connector service is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    servers:
    - url: '{instance_url}/api/v1'
      description: Base API URL
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL (without /api/v1)
    - url: '{instance_url}'
      description: Root URL (used for MCP endpoints mounted at /mcp)
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL
  /knowledgeBase/record/{recordId}:
    get:
      tags:
      - Knowledge Base
      summary: Get record by ID
      description: 'Retrieve detailed information about a specific record.


        **Overview:**


        Returns complete record metadata including name, type, indexing status, storage information, and version history.


        **File conversion:**


        Use the optional `convertTo` parameter to request file format conversion (e.g., PDF to text). Supported conversions include PPT to PDF and PPTX to PDF.'
      operationId: getRecordById
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      - oauth2:
        - kb:read
      parameters:
      - name: recordId
        in: path
        required: true
        description: Record ID
        schema:
          type: string
      - name: convertTo
        in: query
        description: Optional format to convert the file to (e.g., PDF to text). Supported conversions include PPT to PDF and PPTX to PDF.
        schema:
          type: string
          example: txt
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRecordByIdResponseSchema'
        '400':
          description: Invalid request parameters or query shape
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid, expired, or revoked authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: OAuth token is missing the required kb:read scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'Internal server error while retrieving record details.


            Current API behavior includes record-access lookup failures returning

            `HTTP_INTERNAL_SERVER_ERROR` with messages such as

            `Failed to check record access`, including cases where callers might

            otherwise expect a not-found style response.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Connector service unavailable or connection refused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - Knowledge Base
      summary: Update record
      description: 'Update a record''s name and/or file content.


        **Overview:**


        Allows updating the display name and optionally replacing the file content. Triggers re-indexing when content changes.


        **Required permission:**


        WRITER or higher


        **Updating file content:**


        Include a new file in the request to replace the existing content. The file extension must match the original.


        **Side effects:**


        - Updates `updatedAtTimestamp`

        - Increments version if file content changed

        - Triggers re-indexing for content changes'
      operationId: updateRecord
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      - oauth2:
        - kb:write
      parameters:
      - name: recordId
        in: path
        required: true
        description: Record ID
        schema:
          type: string
      requestBody:
        description: Request payload
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                recordName:
                  type: string
                  description: New name for the record
                  maxLength: 255
                file:
                  type: string
                  format: binary
                  description: Replacement file content
      responses:
        '200':
          description: Record updated successfully
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    success:
                      type: boolean
                    message:
                      type: string
                    record:
                      $ref: '#/components/schemas/Record'
                - $ref: '#/components/schemas/UpdateRecordEnrichment'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid, expired, or revoked authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: OAuth token is missing the required kb:write scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error while updating record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Connector service unavailable or connection refused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Knowledge Base
      summary: Delete record
      description: 'Permanently delete a record from the knowledge base.


        **Required permission:**


        WRITER or higher


        **What gets deleted:**


        - Record metadata

        - Associated storage file

        - Indexed content and embeddings


        **Warning:** This action is irreversible.'
      operationId: deleteRecord
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      - oauth2:
        - kb:delete
      parameters:
      - name: recordId
        in: path
        required: true
        description: Record ID
        schema:
          type: string
      responses:
        '200':
          description: Record deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteRecordResponseSchema'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid, expired, or revoked authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: OAuth token is missing the required kb:delete scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error while deleting record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Connector service unavailable or connection refused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    servers:
    - url: '{instance_url}/api/v1'
      description: Base API URL
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL (without /api/v1)
    - url: '{instance_url}'
      description: Root URL (used for MCP endpoints mounted at /mcp)
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL
  /knowledgeBase/stream/record/{recordId}:
    get:
      tags:
      - Knowledge Base
      summary: Stream record content
      description: 'Stream the binary content of a record''s file.


        **Overview:**


        Returns the raw file content with appropriate `Content-Type` and `Content-Disposition` headers for download or inline viewing.


        **Use cases:**


        - File downloads

        - Inline document preview

        - Content extraction pipelines


        **Format conversion:**


        Use the `convertTo` parameter to convert between formats (e.g. DOCX to PDF).'
      operationId: streamRecordBuffer
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      - oauth2:
        - kb:read
      parameters:
      - name: recordId
        in: path
        required: true
        description: Record ID
        schema:
          type: string
      - name: convertTo
        in: query
        description: Target format for conversion
        schema:
          type: string
      responses:
        '200':
          description: File content stream
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '400':
          description: Invalid record ID or query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid, expired, or revoked authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Forbidden. Returned either when the OAuth token is missing the required

            `kb:read` scope or when the authenticated user does not have access to the record.

            '
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - $ref: '#/components/schemas/StreamRecordErrorResponse'
        '404':
          description: Record, organization, or backing connector not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamRecordErrorResponse'
        '409':
          description: 'Conflict - the connector instance for this record is disabled. Enable it from Connector Settings and try again.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamRecordErrorResponse'
        '500':
          description: 'Internal streaming failure, downstream conversion failure, or connector/backend

            error proxied by the gateway.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamRecordErrorResponse'
    servers:
    - url: '{instance_url}/api/v1'
      description: Base API URL
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL (without /api/v1)
    - url: '{instance_url}'
      description: Root URL (used for MCP endpoints mounted at /mcp)
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL
  /knowledgeBase/{kbId}/folder:
    post:
      tags:
      - Knowledge Base
      summary: Create folder
      description: 'Create a folder in a knowledge base. Omit `folderId` to create at the KB root;

        pass `folderId` as a query parameter to create a nested subfolder inside an

        existing parent folder.


        **Required permission:** WRITER or higher


        **Folder features:**


        - Organize records hierarchically

        - Support nested subfolders (unlimited depth)

        - Inherit parent KB permissions


        **Naming rules:**


        - 1–255 characters

        - XSS protection applied

        - Spaces and special characters allowed

        - Duplicate names rejected within the same parent (`409`)


        **Response:** Returns `id` and `name` for the created folder.'
      operationId: createFolder
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      - oauth2:
        - kb:write
      parameters:
      - name: kbId
        in: path
        required: true
        description: Knowledge base ID
        schema:
          type: string
