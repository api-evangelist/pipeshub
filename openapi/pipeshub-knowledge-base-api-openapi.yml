  /knowledgeBase/{kbId}/upload:
    post:
      tags:
      - Knowledge Base
      summary: Upload files to knowledge base or folder
      description: 'Upload one or more files to a knowledge base root or to a specific folder.


        **Overview**


        Batch upload multiple files in a single request. Each file becomes a new record with automatic content indexing.

        Omit the `folderId` query parameter to upload to the KB root; include it to upload into that folder.


        **Upload Limits**


        - **Max files per request:** 1000

        - **Default max file size:** 30MB (configurable via platform settings)

        - Use `GET /knowledgeBase/limits` to check current limits


        **Supported File Types**


        Documents (PDF, DOCX, DOC, XLS, XLSX, PPT, PPTX, TXT, CSV, MD), Images (PNG, JPG, JPEG, SVG, WebP), Web (HTML, HTM), and Google Workspace formats.


        **File Metadata**


        Use `files_metadata` to provide additional info like file paths and last modified timestamps.


        **Versioning**


        Set `isVersioned: true` to enable version tracking for uploaded files.


        **Streaming response**


        This endpoint responds with `Content-Type: text/event-stream`.

        The upload and its per-file progress are a single request: the body streams

        a `file:succeeded` or `file:failed` event per file

        (including files rejected up front for size/type), followed by a final

        `done` summary, then closes. See the

        `UploadStreamSSEEvent` schema for the event/payload contract.'
      operationId: uploadRecords
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      - oauth2:
        - kb:upload
      parameters:
      - name: kbId
        in: path
        required: true
        description: Knowledge base ID
        schema:
          type: string
      - name: folderId
        in: query
        required: false
        description: Target folder ID. Omit to upload to the KB root.
        schema:
          type: string
      requestBody:
        required: true
        description: Request payload
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Files to upload (max 1000)
                files_metadata:
                  type: string
                  description: JSON array with file_path and last_modified for each file
                  example: '[{"file_path":"/docs/report.pdf","last_modified":"2024-01-15T10:30:00Z"}]'
                isVersioned:
                  type: boolean
                  default: true
                  description: Enable version tracking
                recordType:
                  type: string
                  default: FILE
                  description: Type of records to create
              required:
              - files
      responses:
        '200':
          description: 'SSE stream (`text/event-stream`) of per-file upload outcomes. The

            stream emits `file:succeeded` / `file:failed` per file and a final

            `done` summary, then closes. See `UploadStreamSSEEvent`.

            '
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/UploadStreamSSEEvent'
        '400':
          description: Invalid request - Check file types and sizes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions (requires WRITER or higher)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Knowledge base or folder not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: File size exceeds maximum allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many upload requests, or too many concurrent uploads for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to verify knowledge base or folder access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
