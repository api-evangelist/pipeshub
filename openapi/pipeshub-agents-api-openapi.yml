    AgentMessageStreamSSEEvent:
      type: object
      description: "Server-Sent Event envelope for `POST /agents/{agentKey}/conversations/{conversationId}/messages/stream`.\nAG-UI is the sole wire protocol.\n\n`event` carries the AG-UI type name and `data` is a JSON-encoded\nobject that includes a `\"type\"` field matching `event`, plus\ntype-specific fields. The public route requires `chatMode: quick`.\nForwarded lifecycle events may carry `runId`, `threadId`, and\n`parentRunId`. Stable gateway-generated top-level outcomes:\n\n- `CUSTOM` (`name: \"conversation_created\"`) — fired once after the\n  SSE stream opens.\n- `RUN_FINISHED` — fired once after the upstream AI's result is\n  parsed, citations are saved, and the updated conversation is\n  persisted. The gateway emits `{ type, result }`; `result` carries\n  `{ conversation, recordsUsed, meta }`.\n- `RUN_ERROR` — fired for runtime failures after the stream has\n  already started, including conversation lookup failures, upstream\n  AI startup failures, save failures, and stream transport errors.\n\nGateway-generated root terminal events do not contain `runId`,\n`threadId`, or `parentRunId`.\nClients should ignore unknown event names rather than treating them\nas errors.\n"
      properties:
        event:
          type: string
          enum:
          - RUN_STARTED
          - RUN_FINISHED
          - RUN_ERROR
          - STEP_STARTED
          - STEP_FINISHED
          - TEXT_MESSAGE_START
          - TEXT_MESSAGE_CONTENT
          - TEXT_MESSAGE_END
          - REASONING_START
          - REASONING_MESSAGE_START
          - REASONING_MESSAGE_CONTENT
          - REASONING_MESSAGE_END
          - REASONING_END
          - TOOL_CALL_START
          - TOOL_CALL_ARGS
          - TOOL_CALL_END
          - TOOL_CALL_RESULT
          - STATE_DELTA
          - STATE_SNAPSHOT
          - CUSTOM
          - HEARTBEAT
        data:
          type: string
          description: 'JSON-encoded event payload. The decoded JSON includes a `"type"`

            field matching `event`, plus type-specific fields. Shape depends

            on `event`.

            '
    AgentCreateConversationRequest:
      type: object
      additionalProperties: false
      description: 'First turn of an agent conversation. Used as-is by the non-streaming

        `POST /agents/{agentKey}/conversations`, where `chatMode` may be

        omitted; `AgentStreamCreateConversationRequest` additionally requires

        it. Unknown fields are stripped during validation.

        '
      required:
      - query
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 100000
          description: 'User prompt for the first turn. Saved as the initial `user_query`

            message and sent to the agent backend.

            '
        recordIds:
          type: array
          items:
            type: string
            format: objectId
          description: 'Optional record ids to include as context for this turn. Each id

            must be a 24-character MongoDB ObjectId.

            '
        filters:
          allOf:
          - $ref: '#/components/schemas/Filters'
          description: 'Optional retrieval scope (`apps` / `kb`) for this turn. Each id must

            be a valid UUID. Omit for agent defaults; send `{ "apps": [], "kb": [] }`

            to force no knowledge sources for this turn.

            '
        appliedFilters:
          allOf:
          - $ref: '#/components/schemas/AppliedFilters'
          description: 'UI filter state persisted on the saved user message. Not used for

            retrieval and not forwarded to the upstream agent backend.

            '
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/ChatAttachmentRef'
          description: 'Uploaded attachments to ground this turn. Each entry references a

            record id returned from the agent attachment upload endpoint.

            '
        projectId:
          type: string
          format: objectId
          description: 'Link the new agent conversation to a project the caller has at

            least viewer access to. Same fallback/merge semantics as

            `POST /conversations/create`. Ignored on follow-up turns — the

            session row is the source of truth once the conversation exists.

            '
        projectVisibility:
          type: string
          enum:
          - private
          - project
          description: 'Only meaningful together with `projectId`. Overrides the

            project''s default sharing behavior for this one conversation.

            '
        chatMode:
          type: string
          enum:
          - quick
          description: 'Execution mode. Scoped agent conversations support only `quick`.

            Required on the `/stream` route; optional on the non-streaming

            route.

            '
        modelKey:
          type: string
          minLength: 1
          description: 'AI model configuration id for this turn. Omit to use the agent''s

            default model.

            '
        modelName:
          type: string
          minLength: 1
          description: Provider model name (the underlying LLM identifier).
        modelFriendlyName:
          type: string
          minLength: 1
          description: Friendly UI label for the selected model.
        timezone:
          type: string
          minLength: 1
          description: 'Client IANA timezone, such as `America/New_York`. Helps the agent

            resolve relative date references in the prompt.

            '
        currentTime:
          type: string
          format: date-time
          description: 'Client time in ISO 8601 / RFC 3339 format (UTC `Z` or numeric

            offset). Sent alongside `timezone` for time-aware answers.

            '
        tools:
          type: array
          items:
            type: string
            minLength: 1
          description: 'Allowed tool ids for this turn, such as `jira.create_issue`. Omit

            to let the agent use its default toolset; send `[]` to disable

            tools for this turn.

            '
        protocol:
          type: string
          enum:
          - agui
          description: 'AG-UI is the only supported wire protocol. When present must be

            `"agui"`. Omitting the field is equivalent — the server always

            uses the AG-UI vocabulary (see `AgentStreamSSEEvent`). Kept in

            the schema for backward compatibility with callers that already

            send it.

            '
        agentCapabilities:
          $ref: '#/components/schemas/AgentCapabilities'
        runId:
          type: string
          format: uuid
          description: 'Client-generated identifier for this run. Send it here to enable

            `POST /agents/{agentKey}/conversations/{conversationId}/cancel

            {runId}` while the stream is still generating.

            '
      example:
        query: what are some latest tech news?
        modelKey: 5c1832f4-fa19-4167-b913-307fad3a6551
        modelName: gpt-5.6-luna
        modelFriendlyName: GPT 5.4 mini
