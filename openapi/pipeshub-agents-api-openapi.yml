        description: Filter messages by type
        schema:
          type: string
          enum:
          - user_query
          - bot_response
          - error
          - feedback
          - system
      responses:
        '200':
          description: Agent conversation detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConversationDetailResponse'
        '401':
          description: Unauthorized
        '404':
          description: Conversation not found
    servers:
    - url: '{instance_url}/api/v1'
      description: Base API URL
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL (without /api/v1)
    - url: '{instance_url}'
      description: Root URL (used for MCP endpoints mounted at /mcp)
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL
  /agents/{agentKey}/conversations:
    get:
      tags:
      - Agents
      summary: List agent conversations
      description: 'Paginated list of conversations for the agent (owned and shared-with-me),

        excluding archived threads.'
      operationId: listAgentConversations
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      - oauth2:
        - agent:read
      parameters:
      - name: agentKey
        in: path
        required: true
        description: Agent identifier used to scope the conversation list.
        schema:
          type: string
      - name: page
        in: query
        description: 1-based page number. Defaults to `1`.
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        description: Page size. Defaults to `20`; maximum `100`.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: sortBy
        in: query
        description: 'Preferred sort field. Supported values are `createdAt`,

          `lastActivityAt`, and `title`.


          The current gateway validator preserves legacy behavior: unsupported

          values are accepted but ignored, and the handler falls back to

          `lastActivityAt`.

          '
        schema:
          type: string
      - name: sortOrder
        in: query
        description: 'Preferred sort direction. Supported values are `asc` and `desc`.


          The current gateway validator preserves legacy behavior: unsupported

          values are accepted but ignored, and the handler falls back to

          descending order.

          '
        schema:
          type: string
      - name: search
        in: query
        description: 'Case-insensitive search term applied to conversation `title` and

          `messages.content`. Maximum length is 1000 characters. HTML/XSS

          payloads and format specifiers are rejected.

          '
        schema:
          type: string
          maxLength: 1000
      - name: startDate
        in: query
        description: 'Inclusive lower bound on `createdAt`. The handler accepts any

          JavaScript-parseable date string; invalid values return HTTP 400.

          '
        schema:
          type: string
          example: '2026-05-26T00:00:00.000Z'
      - name: endDate
        in: query
        description: 'Inclusive upper bound on `createdAt`. The handler accepts any

          JavaScript-parseable date string; invalid values return HTTP 400.

          '
        schema:
          type: string
          example: '2026-05-27T00:00:00.000Z'
      - name: status
        in: query
        description: 'Optional status filter applied to the `sharedWithMeConversations`

          branch of the response. The main `conversations` list ignores this

          parameter.

          '
        schema:
          type: string
      - name: isArchived
        in: query
        description: 'Optional archived flag applied to the `sharedWithMeConversations`

          branch before the route-level non-archived guard is enforced.

          Accepted values are `true` and `false`.

          '
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      - name: projectId
        in: query
        required: false
        description: 'Restrict results to a single project. Pass a project''s `id`, or

          the literal string `unassigned` to list agent conversations with

          no `projectId`.

          '
        schema:
          type: string
      responses:
        '200':
          description: Conversation list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConversationListResponse'
        '400':
          description: 'Invalid path or query parameter.


            This includes Zod validation failures such as invalid pagination,

            invalid booleans, malformed date values, duplicate `search`

            parameters, or overlong / invalid `search` input.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Agents
      summary: Create agent conversation (non-streaming)
      description: 'Start a conversation with an agent and wait for the complete answer.

        The JSON counterpart of `POST /agents/{agentKey}/conversations/stream`.


        **How a turn runs**


        1. The user''s message is saved (in its own short transaction on a

        replica set).

        2. The AI backend runs the same agent-loop pipeline as the `/stream`

        route and returns only its final result. No transaction is held

        during this call, and the call is never retried.

        3. The answer, citations and status are saved exactly as the

        streaming route saves them, and the updated conversation is

        returned.


        Every failure after step 1 is persisted: the conversation ends with

        status `Failed`, a `failReason`, and an `error` message, and the

        response carries `X-Conversation-Id` so the caller can fetch it.

        A 4xx from the AI backend (for example no model configured) keeps

        its status and user-facing message; other failures return 500 with

        a generic message.


        The response arrives only when the whole answer is ready, which can

        take minutes for agent runs. Allow a generous client and proxy

        timeout, or use the `/stream` variant for interactive clients.'
      operationId: createAgentConversation
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      - oauth2:
        - agent:execute
      parameters:
      - name: agentKey
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        description: The first question, with optional scope, model, project and tool overrides.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCreateConversationRequest'
      responses:
        '201':
          description: Conversation created with the agent's first answer.
          headers:
            X-Conversation-Id:
              $ref: '#/components/headers/X-Conversation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAgentConversationResponse'
        '400':
          description: 'Invalid request — `query` is missing or empty, contains markup or

            printf-style format specifiers, or another field fails validation.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized — valid bearer token required.
        '403':
          description: Forbidden — the token lacks the `agent:execute` OAuth scope, or the caller cannot use this agent.
        '413':
          description: The request is larger than the selected model accepts.
          headers:
            X-Conversation-Id:
              $ref: '#/components/headers/X-Conversation-Id'
        '422':
          description: The model provider's content filter blocked the request.
          headers:
            X-Conversation-Id:
              $ref: '#/components/headers/X-Conversation-Id'
        '424':
          description: 'No usable LLM — none is configured for the organization, or the

            selected one could not start. The message says what to fix.

            '
          headers:
            X-Conversation-Id:
              $ref: '#/components/headers/X-Conversation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: The model provider is rate limiting or out of quota.
          headers:
            X-Conversation-Id:
              $ref: '#/components/headers/X-Conversation-Id'
        '500':
          description: 'The answer failed (AI service unreachable, timed out, returned

            no answer, or could not be saved). The conversation is kept with

            status `Failed` and an `error` message.

            '
          headers:
            X-Conversation-Id:
              $ref: '#/components/headers/X-Conversation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    servers:
    - url: '{instance_url}/api/v1'
      description: Base API URL
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL (without /api/v1)
    - url: '{instance_url}'
      description: Root URL (used for MCP endpoints mounted at /mcp)
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL
components:
  schemas:
    AgentConversationDetailMeta:
      type: object
      additionalProperties: false
      description: 'Request-scoped metadata returned by the by-id GET route. `requestId`

        is omitted when upstream middleware did not attach one.

        '
      required:
      - timestamp
      - duration
      - conversationId
      - messageCount
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
        duration:
          type: integer
        conversationId:
          type: string
          format: objectId
        messageCount:
          type: integer
    AgentConversationDetailAccess:
      type: object
      additionalProperties: false
      properties:
        isOwner:
          type: boolean
        accessLevel:
          type: string
          enum:
          - read
          - write
    AgentCreateToolsetName:
      type: string
      description: Registered toolset name (lowercase) accepted by the create-agent gateway.
      enum:
      - calendar
      - clickup
      - confluence
      - confluencedatacenter
      - drive
      - github
      - gmail
      - jira
      - jiradatacenter
      - lumos
      - mariadb
      - onedrive
      - outlook
      - redshift
      - salesforce
      - sharepoint
      - slack
      - teams
      - zoom
    AgentConversation:
      type: object
      description: 'A conversation with a specific AI agent. Similar to regular conversations

        but tied to an agent''s configuration and capabilities.

        '
      properties:
        _id:
          type: string
          format: objectId
        agentKey:
          type: string
          description: The agent this conversation is with
        userId:
          type: string
          format: objectId
        orgId:
          type: string
          format: objectId
        title:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        status:
          type: string
          enum:
          - None
          - Inprogress
          - Complete
          - Failed
          - Stopped
          description: Same values as `Conversation.status`.
        isShared:
          type: boolean
        sharedWith:
          type: array
          items:
            type: object
            properties:
              userId:
                type: string
              accessLevel:
                type: string
                enum:
                - read
                - write
        lastActivityAt:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        projectId:
          type:
          - string
          - 'null'
          format: objectId
          description: The project this agent conversation is linked to, if any.
        projectVisibility:
          type:
          - string
          - 'null'
          enum:
          - private
          - project
          description: 'Only meaningful when `projectId` is set. `project` exposes the

            conversation to every member of the linked project.

            '
    ChatAttachmentRef:
      type: object
      additionalProperties: false
      description: 'Reference to an attachment produced by `POST /conversations/attachments/upload`

        (or the equivalent agent route). Include in create/stream/message bodies

        so the turn is sent with uploaded files.

        '
      required:
      - recordId
      properties:
        recordId:
          type: string
          minLength: 1
          description: Attachment record id returned from the upload endpoint.
        recordName:
          type: string
          minLength: 1
          description: Original display name of the file when known.
        mimeType:
          type: string
          minLength: 1
          description: MIME type of the uploaded file.
        extension:
          type: string
          minLength: 1
          description: File extension (e.g. `pdf`).
        virtualRecordId:
          type: string
          minLength: 1
          description: Optional synthetic record id used by the graph layer.
    AgentArchivedConversationSummary:
      type: object
      additionalProperties: false
      description: 'Archive counts and bounds for the current result page returned by

        `GET /agents/{agentKey}/conversations/show/archives`.

        '
      properties:
        totalArchived:
          type: integer
          description: Total archived conversations matching the filter
        oldestArchive:
          type: string
          format: date-time
          description: Archive timestamp of the first item in the current page. Omitted when the page is empty.
        newestArchive:
          type: string
          format: date-time
          description: Archive timestamp of the last item in the current page. Omitted when the page is empty.
    AgentConversationDetailResponse:
      type: object
      additionalProperties: false
      description: 'Envelope returned by `GET /agents/{agentKey}/conversations/{conversationId}`.

        '
      required:
      - conversation
      - filters
      - meta
      properties:
        conversation:
          $ref: '#/components/schemas/AgentConversationDetail'
        filters:
          $ref: '#/components/schemas/SemanticSearchHistoryFilters'
        meta:
          $ref: '#/components/schemas/AgentConversationDetailMeta'
    SemanticSearchHistorySortField:
      type: object
      additionalProperties: false
      description: 'Used for `available.sorting.{sortBy,sortOrder}` and

        `available.sortingMessages.{sortBy,sortOrder}`. The `applied` flag

        is present on `sorting.*` and absent on `sortingMessages.*`, so it

        is optional here.

        '
      required:
      - values
      - default
      - description
      - current
      properties:
        values:
          type: array
          items:
            type: string
        default:
          type: string
        description:
          type: string
        current:
          type: string
        applied:
          type: boolean
    SemanticSearchHistoryFiltersApplied:
      type: object
      additionalProperties: false
      description: 'Echo of which filters the caller actually supplied, built by

        `buildFiltersMetadata` (utils.ts:430-486). `page` and `limit` always

        appear because they are normalised to defaults before being recorded,

        so `filters` is never empty and `values` always contains at least

        `{ page, limit }`. Other keys appear only when the matching query

        param was non-empty (or, for `dateRange`, when `createdAt` was set

        on the Mongo filter).


        `values` keys are scalar strings rather than typed primitives

        (`''true''`/`''false''`, `''5''`, etc.) because they are passed through

        from `req.query` as Express parsed them — only `page` and `limit`

        are coerced to integers via `safeParsePagination`.

        '
      required:
      - filters
      - values
      properties:
        filters:
          type: array
          items:
            type: string
            enum:
            - page
            - limit
            - search
            - shared
            - tags
            - minMessages
            - sortBy
            - sortOrder
            - startDate
            - endDate
            - messageType
            - dateRange
        values:
          type: object
          additionalProperties: false
          properties:
            page:
              type: integer
            limit:
              type: integer
            search:
              type: string
            shared:
              type: string
            tags:
              type: string
            minMessages:
              type: string
            sortBy:
              type: string
            sortOrder:
              type: string
            startDate:
              type: string
            endDate:
              type: string
            messageType:
              type: string
            dateRange:
              $ref: '#/components/schemas/SemanticSearchHistoryAppliedDateRange'
    AgentCreateResponse:
      type: object
      additionalProperties: false
      required:
      - status
      - message
      - agent
      properties:
        status:
          type: string
          enum:
          - success
          - partial_success
        message:
          type: string
        agent:
          $ref: '#/components/schemas/AgentCreateResponseAgent'
        warnings:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AgentCreateWarning'
    SemanticSearchHistoryFilters:
      type: object
      additionalProperties: false
      required:
      - applied
      - available
      properties:
        applied:
          $ref: '#/components/schemas/SemanticSearchHistoryFiltersApplied'
        available:
          $ref: '#/components/schemas/SemanticSearchHistoryFiltersAvailable'
    AgentArchivedConversationListResponse:
      type: object
      additionalProperties: false
      description: 'Envelope returned by `GET /agents/{agentKey}/conversations/show/archives`.

        '
      required:
      - conversations
      - pagination
      - filters
      - summary
      - meta
      properties:
        conversations:
          type: array
          items:
            $ref: '#/components/schemas/AgentConversationListItem'
        pagination:
          $ref: '#/components/schemas/SemanticSearchHistoryPagination'
        filters:
          $ref: '#/components/schemas/SemanticSearchHistoryFilters'
        summary:
          $ref: '#/components/schemas/AgentArchivedConversationSummary'
        meta:
          $ref: '#/components/schemas/SemanticSearchHistoryMeta'
    AgentCreateResponseTool:
      type: object
      additionalProperties: false
      required:
      - name
      - fullName
      - key
      properties:
        name:
          type: string
        fullName:
          type: string
        key:
          type: string
    AgentRegenerateRequest:
      allOf:
      - $ref: '#/components/schemas/RegenerateRequest'
      - type: object
        description: 'Regeneration payload for a scoped agent conversation. The public

          gateway requires `chatMode: quick`; all other fields retain the

          semantics defined by `RegenerateRequest`.

          '
        required:
        - chatMode
        properties:
          chatMode:
            type: string
            enum:
            - quick
    AgentCreateWebSearch:
      description: 'Web-search attachment for an agent. Accepts a provider string, an object

        with at least a `provider` field, or `null`.

        '
      anyOf:
      - type:
        - string
        - 'null'
      - type: object
        additionalProperties: false
        properties:
          provider:
            type: string
          providerKey:
            type: string
            maxLength: 256
          providerLabel:
            type: string
            maxLength: 200
          iconPath:
            type: string
            maxLength: 500
        required:
        - provider
    AgentConversationDetailMessageCitation:
      type: object
      additionalProperties: false
      description: 'Citation entry returned inside a conversation message after the

        handler populates `messages.citations.citationId` and rewrites each

        item to `{ citationId, citationData }`.

        '
      properties:
        citationId:
          type: string
          format: objectId
        citationData:
          $ref: '#/components/schemas/Citation'
    AgentConversationArchiveMeta:
      type: object
      additionalProperties: false
      description: 'Request-scoped metadata returned by the archive route. `requestId` is

        omitted when upstream middleware did not attach one.

        '
      required:
      - timestamp
      - duration
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
        duration:
          type: integer
    AgentAddMessageRequest:
      type: object
      additionalProperties: false
      description: 'Follow-up turn on an agent conversation. Used as-is by the

        non-streaming `POST /agents/{agentKey}/conversations/{conversationId}/messages`,

        where `chatMode` may be omitted; `AgentAddMessageStreamRequest`

        additionally requires it. Unknown fields are stripped during validation.

        '
      required:
      - query
      properties:
        query:
          type: string
          minLength: 1
          description: 'User follow-up prompt to append to the existing agent conversation.

            Saved as a new `user_query` message before the upstream AI stream

            starts.

            '
        filters:
          allOf:
          - $ref: '#/components/schemas/Filters'
          description: 'Optional retrieval scope (`apps` / `kb`) for this turn. Each id must

            be a valid UUID. Omit to let the agent use its stored defaults;

            send `{ "apps": [], "kb": [] }` to force no knowledge sources for this turn.

            '
        appliedFilters:
          allOf:
          - $ref: '#/components/schemas/AppliedFilters'
          description: 'UI filter state persisted on the saved user message. Not used for

            retrieval and not forwarded to the upstream agent backend.

            '
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/ChatAttachmentRef'
          description: 'Uploaded attachments to ground this turn. Each entry references a

            record id returned from the agent attachment upload endpoint.

            '
        chatMode:
          type: string
          enum:
          - quick
          description: 'Execution mode. Scoped agent conversations support only `quick`.

            Required on the `/stream` route; optional on the non-streaming

            route.

            '
        modelKey:
          type: string
          minLength: 1
          description: 'AI model configuration id override for this turn. Omit to use the

            agent''s default model.

            '
        modelName:
          type: string
          minLength: 1
          description: Provider model name (the underlying LLM identifier).
        modelFriendlyName:
          type: string
          minLength: 1
          description: Friendly UI label for the selected model.
        timezone:
          type: string
          minLength: 1
          description: 'Client IANA timezone, such as `America/New_York`. Helps the agent

            resolve relative date references in the prompt.

            '
        currentTime:
          type: string
          format: date-time
          description: 'Client time in ISO 8601 / RFC 3339 format (UTC `Z` or numeric

            offset). Sent alongside `timezone` for time-aware answers.

            '
        tools:
          type: array
          items:
            type: string
            minLength: 1
          description: 'Allowed tool ids for this turn, such as `jira.create_issue`. Omit

            to let the agent use its default toolset; send `[]` to disable

            tools for this turn.

            '
        protocol:
          type: string
          enum:
          - agui
          description: 'AG-UI is the only supported wire protocol. When present must be

            `"agui"`. Omitting the field is equivalent — the server always

            uses the AG-UI vocabulary (see `AgentMessageStreamSSEEvent`).

            Kept in the schema for backward compatibility with callers that

            already send it.

            '
        agentCapabilities:
          $ref: '#/components/schemas/AgentCapabilities'
        runId:
          type: string
          format: uuid
          description: 'Client-generated identifier for this run. Send it here to enable

            `POST /agents/{agentKey}/conversations/{conversationId}/cancel

            {runId}` while the stream is still generating.

            '
      example:
        query: can you elaborate on the latest headlines?
        modelKey: 5c1832f4-fa19-4167-b913-307fad3a6551
        modelName: gpt-5.6-luna
        modelFriendlyName: GPT 5.4 mini
        chatMode: quick
        timezone: Asia/Kolkata
        currentTime: '2026-05-19T12:58:01+05:30'
        tools: []
        filters:
          apps:
          - 2605c882-61d4-4aa2-b480-a68c957c151d
          - ed6d6cc4-70bd-4838-9aeb-488e910c833a
          kb:
          - 8747da12-4724-4a95-ac92-827b88d79647
        appliedFilters:
          apps:
          - id: 2605c882-61d4-4aa2-b480-a68c957c151d
            name: US Headlines, abcnews
            nodeType: app
            connector: RSS
          - id: ed6d6cc4-70bd-4838-9aeb-488e910c833a
            name: ABC News RSS
            nodeType: app
            connector: RSS
          kb:
          - id: 8747da12-4724-4a95-ac92-827b88d79647
            name: Siddhant Ota's Private
            nodeType: recordGroup
            connector: KB
    AgentConversationDetail:
      type: object
      additionalProperties: false
      description: 'Reduced conversation view returned by the by-id GET route. This is

        not the raw `AgentConversation` document shape: fields like `agentKey`,

        `userId`, `orgId`, `conversationSource`, and root-level `messages`

        metadata outside the selected slice are omitted.

        '
      required:
      - id
      - createdAt
      - isShared
      - sharedWith
      - messages
      - pagination
      - access
      properties:
        id:
          type: string
          format: objectId
        title:
          type: string
        initiator:
          type: string
          format: objectId
        createdAt:
          type: string
          format: date-time
        isShared:
          type: boolean
        sharedWith:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              userId:
                type: string
                format: objectId
              accessLevel:
                type: string
                enum:
                - read
                - write
        status:
          type: string
          enum:
          - None
          - Inprogress
          - Complete
          - Failed
          - Stopped
        failReason:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/AgentConversationDetailMessage'
        modelInfo:
          $ref: '#/components/schemas/ConversationModelInfo'
        pagination:
          $ref: '#/components/schemas/AgentConversationDetailPagination'
        access:
          $ref: '#/components/schemas/AgentConversationDetailAccess'
    MessagePart:
      type: object
      additionalProperties: false
      description: 'One entry in the ordered agent-activity transcript for a message turn.

        Every field beyond `type` is optional and depends on the part kind, and

        `sub_agent` nests this same shape recursively under `parts`.


        Tool results here are always a bounded preview, never the full payload —

        `artifactId` points at the complete result.

        '
      properties:
        type:
          type: string
          enum:
          - text
          - reasoning
          - tool_call
          - sub_agent
        content:
          type: string
        toolCallId:
          type: string
        toolName:
          type: string
        displayName:
          type: string
        args:
          type: string
        argsSummary:
          type: string
          description: Human-readable summary of `args`, computed server-side.
        status:
          type: string
          enum:
          - running
          - completed
          - failed
          - blocked
        resultPreview:
          type: string
        resultSummary:
          type: string
          description: 'Human-readable summary of the tool result, computed server-side from

            the full untruncated output.

            '
        artifactId:
          type: string
          description: Blob-backed artifact id for the full tool result.
        runId:
          type: string
        roleName:
          type: string
        isFinal:
          type: boolean
          description: 'Set on the single root-level `text` part carrying the answer. Every

            other root `text` part is an abandoned preamble turn. Never set on

            child parts nested under a `sub_agent`.

            '
        parts:
          type: array
          description: Nested transcript of a `sub_agent` part.
          items:
            $ref: '#/components/schemas/MessagePart'
    GetAgentResponse:
      type: object
      additionalProperties: false
      description: 'Success envelope returned by `GET /agents/{agentKey}`.


        The Node gateway forwards the backend response as an envelope with a

        top-level status/message and the detailed agent projection nested under

        `agent`.

        '
      required:
      - status
      - message
      - agent
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Agent retrieved successfully
        agent:
          $ref: '#/components/schemas/Agent'
    MessageFeedbackUpdateResponse:
      type: object
      additionalProperties: false
      required:
      - conversationId
      - messageId
      - feedback
      - meta
      description: 'Gateway response after appending feedback to a bot-response message.

        '
      properties:
        conversationId:
          type: string
          format: objectId
          description: Conversation the feedback was attached to.
        messageId:
          type: string
          format: objectId
          description: Message the feedback was attached to.
        feedback:
          $ref: '#/components/schemas/MessageFeedbackAppendEntry'
        meta:
          type: object
          additionalProperties: false
          required:
          - requestId
          - timestamp
          - duration
          properties:
            requestId:
              type: string
              description: 'Server-side request identifier. Read from the `X-Request-ID`

                header when supplied, otherwise auto-generated, so this field

                is always present.

                '
            timestamp:
              type: string
              format: date-time
            duration:
              type: integer
              description: Server-side processing time in milliseconds.
    AgentListItem:
      type: object
      additionalProperties: false
      description: 'Agent projection returned by `GET /agents`.


        This is the list-view envelope item emitted by the Python backend and

        forwarded by the Node gateway. It is not the full detail projection

        used by `GET /agents/{agentKey}`.

        '
      properties:
        _id:
          type: string
          description: Full document id in the backing graph store.
          example: agentInstances/e6f848ca-e2ab-4594-9925-e1136629f474
        _key:
          type: string
          description: Stable agent key used in route params.
          example: e6f848ca-e2ab-4594-9925-e1136629f474
        _rev:
          type: string
          description: Backend document revision token.
          example: _lkNlcOm---
        createdAtTimestamp:
          type: integer
          format: int64
          description: Unix epoch timestamp in milliseconds when the agent was created.
        createdBy:
          type: string
          description: MongoDB user ID of the agent creator
        description:
          type:
          - string
          - 'null'
          description: Short human-readable description of the agent.
        instructions:
          type:
          - string
          - 'null'
          description: Additional execution instructions stored on the agent.
        isActive:
          type: boolean
          description: Whether the agent is active.
        isDeleted:
          type: boolean
          description: Whether the agent has been soft-deleted.
        isServiceAccount:
          type: boolean
          description: Whether this agent is a service-account agent.
        models:
          type: array
          description: 'Model entries configured on the agent.


            For `GET /agents`, the backend returns the stored normalized string

            representation, typically `modelKey_modelName`.

            '
          items:
            type: string
        name:
          type: string
          description: Display name of the agent.
        startMessage:
          type:
          - string
          - 'null'
          description: Greeting shown at conversation start.
        systemPrompt:
          type:
          - string
          - 'null'
          description: System prompt stored on the agent.
        tags:
          type: array
          items:
            type: string
          description: Free-form agent tags.
        updatedAtTimestamp:
          type: integer
          format: int64
          description: Unix epoch timestamp in milliseconds when the agent was last updated.
        updatedBy:
          type:
          - string
          - 'null'
          description: User id of the last updater, if present.
        usesOrgDefault:
          type: boolean
          description: 'True when this agent has no models configured and will use the

            organization''s default LLM (marked `isDefault: true` in the AI

            models configuration) at chat time. Derived from `models` being

            empty — not persisted separately.

            '
        webSearch:
          type:
          - object
          - 'null'
          additionalProperties: false
          description: 'Web-search provider attachment for this agent, or `null` when none is attached.


            For `GET /agents`, the response formatter always emits `provider`.

            It may also emit `providerKey` and `providerLabel` when those values

            were present on the stored attachment. It does not emit `iconPath`

            on this response path.

            '
          properties:
            provider:
              type: string
            providerKey:
              type: string
            providerLabel:
              type: string
        defaultReasoningEffort:
          type:
          - string
          - 'null'
          enum:
          - none
          - low
          - medium
          - high
          - max
          description: Agent-level reasoning effort used when a chat request omits its own. Null when unset.
        sendUserContext:
          type: boolean
          description: When false, this agent omits user name/email/org from its system prompt.
        shareWithOrg:
          type: boolean
          description: Whether the agent is shared with the organization.
        toolsets:
          type: array
          description: 'Toolset instances linked to the agent. Same projection as

            `GET /agents/{agentKey}`; the backend builds it from the graph edges

            for each agent on the returned page.

            '
          items:
            $ref: '#/components/schemas/Toolset'
        mcpServers:
          type: array
          description: 'MCP server instances linked to the agent. Same projection as

            `GET /agents/{agentKey}`; the backend builds it from the graph

            edges for each agent on the returned page.

            '
          items:
            $ref: '#/components/schemas/McpServer'
        knowledge:
          type: array
          description: 'Knowledge connectors and indexed scopes linked to the agent. Same

            projection as `GET /agents/{agentKey}`; the backend builds it from

            the graph edges for each agent on the returned page.

            '
          items:
            $ref: '#/components/schemas/Knowledge'
        can_view:
          type: boolean
          description: Effective permission to view the agent.
        can_share:
          type: boolean
          description: Effective permission to share the agent.
        can_edit:
          type: boolean
          description: Effective permission to edit the agent.
        can_delete:
          type: boolean
          description: Effective permission to delete the agent.
        user_role:
          type: string
          description: Effective role of the current user on this agent.
          example: OWNER
        access_type:
          type: string
          description: How the user can access this agent.
          example: INDIVIDUAL
      required:
      - _id
      - _key
      - createdAtTimestamp
      - createdBy
      - isActive
      - isDeleted
      - isServiceAccount
      - models
      - name
      - tags
      - updatedAtTimestamp
      - shareWithOrg
      - toolsets
      - mcpServers
      - knowledge
      - can_view
      - can_share
      - can_edit
      - can_delete
      - user_role
      - access_type
    MessageReasoningTurn:
      type: object
      additionalProperties: false
      description: 'One model turn''s chain-of-thought. Persisted only when reasoning

        persistence is enabled; the array is empty otherwise.

        '
      required:
      - content
      properties:
        messageId:
          type: string
        turnIndex:
          type: number
        content:
          type: string
    AppliedFilterNode:
      type: object
      additionalProperties: false
      description: A single filter node selected by the user (used for display/persistence of active filters)
      properties:
        id:
          type: string
          description: Unique identifier of the filter node
        name:
          type: string
          description: Display name of the filter node
        nodeType:
          type: string
          description: Type of the node (e.g. app, recordGroup, folder, record)
        connector:
          type: string
          description: Connector identifier associated with this node
    Message:
      type: object
      additionalProperties: false
      description: 'A single message within a conversation. Messages can be user queries,

        AI responses, system messages, or error notifications.

        '
      properties:
        _id:
          type: string
          format: objectId
          description: Unique message identifier
        messageType:
          type: string
          enum:
          - user_query
          - bot_response
          - error
          - feedback
          - system
          - tool_call
          description: 'Type of message:

            - `user_query` - User''s question or input

            - `bot_response` - AI-generated response

            - `error` - Error message from the system

            - `feedback` - User feedback on a response

            - `system` - System notification or status

            - `tool_call` - Tool invocation turn; details are on `tools`

            '
        content:
          type: string
          description: The message text content
        contentFormat:
          type: string
          enum:
          - MARKDOWN
          - JSON
          - HTML
          description: Format of the content for rendering
          default: MARKDOWN
        citations:
          type: array
          items:
            anyOf:
            - $ref: '#/components/schemas/CitationReference'
            - $ref: '#/components/schemas/PopulatedCitationReference'
          description: 'References to source documents used in the response. Routes that

            return the saved conversation after a turn (create, add message)

            populate each item to `{ citationId, citationData }`.

            '
        confidence:
          type:
          - string
          - 'null'
          description: 'AI confidence in the answer. Present only on `bot_response` messages,

            and only when the model emitted a trailing confidence block.


            This field is now optional and nullable; it was previously always present and non-nullable. Treat a missing or `null` value as "no confidence reported" and guard before using it. Change effective in SDK v1.3.0 (v1.2.0 and earlier always populated it).

            '
        followUpQuestions:
          type: array
          items:
            $ref: '#/components/schemas/FollowUpQuestion'
          description: Suggested follow-up questions
        feedback:
          type: array
          items:
            $ref: '#/components/schemas/MessageFeedback'
          description: User feedback on this message
        metadata:
          type: object
          additionalProperties: false
          properties:
            processingTimeMs:
              type: number
              description: Time taken to generate response in milliseconds
            modelVersion:
              type: string
              description: Version of the AI model used
            aiTransactionId:
              type: string
              description: Transaction ID for tracking in AI backend
            reason:
              type: string
              description: Additional context or reasoning
        modelInfo:
          $ref: '#/components/schemas/ConversationModelInfo'
        appliedFilters:
          $ref: '#/components/schemas/AppliedFilters'
        referenceData:
          type: array
          description: 'Reference identifiers extracted from tool responses, used to scope

            follow-up queries (for example Jira project keys or record IDs).

            '
          items:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
                description: Display name shown to the user.
              id:
                type: string
                description: Technical identifier (numeric ID, UUID, etc.).
              type:
                type: string
                description: Item type (e.g. `project`, `issue`, `file`, `notebook`, `page`).
              app:
                type: string
                description: 'Source application (e.g. `jira`, `confluence`, `sharepoint`,

                  `slack`, `drive`, `gmail`).

                  '
              webUrl:
                type: string
                description: URL to open the item in a browser.
              metadata:
                type: object
                additionalProperties:
                  type: string
                description: 'App-specific fields keyed by name (e.g. `key` for a Jira project,

                  `siteId` for a SharePoint document).

                  '
        attachments:
          type: array
          description: 'Files uploaded for this message turn (see

            `POST /conversations/attachments/upload`).

            '
          items:
            $ref: '#/components/schemas/ChatAttachmentRef'
        tools:
          type: array
          description: Tool call results invoked during this message turn.
          items:
            $ref: '#/components/schemas/MessageToolCall'
        reasoning:
          type: array
          description: Persisted chain-of-thought for this turn.
          items:
            $ref: '#/components/schemas/MessageReasoningTurn'
        parts:
          type: array
          description: Ordered agent-activity transcript for this turn.
          items:
            $ref: '#/components/schemas/MessagePart'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AgentListResponse:
      type: object
      additionalProperties: false
      description: 'Paginated response returned by `GET /agents`.


        The Node gateway forwards the Python backend response on success. If

        the backend returns a non-200 response, the gateway still returns HTTP

        200 with `success: true`, an empty `agents` array, and a zeroed

        pagination block derived from the requested `page` / `limit`.

        '
      required:
      - success
      - agents
      - pagination
      properties:
        success:
          type: boolean
          example: true
        agents:
          type: array
          items:
            $ref: '#/components/schemas/AgentListItem'
        pagination:
          $ref: '#/components/schemas/AgentListPagination'
    Filters:
      type: object
      additionalProperties: false
      description: 'App connector instance ids and knowledge-base / record-group ids that narrow retrieval

        for a turn. For **org assistant** chat streams, send explicit `apps` / `kb` lists.

        For **agent** chat streams, send explicit id lists, or **omit** `filters` (and `tools`)

        to let the service use the agent’s stored knowledge and tool configuration. Sending

        `{ "apps": [], "kb": [] }` on an agent stream means **no** knowledge sources for that

        turn (it is not “full org default”).

        '
      properties:
        apps:
          type: array
          items:
            type: string
          description: 'Connector instance ids to scope retrieval for this turn. Each element

            must be a valid UUID (connector app id, KB app id, record-group id, etc.).

            Gateway validation matches Zod `appOrKbIdSchema`.

            '
        kb:
          type: array
          items:
            type: string
          description: 'Knowledge-base app ids to scope retrieval for this turn.

            Each element must be a valid UUID.

            '
    AgentSkill:
      type: object
      additionalProperties: false
      description: 'A skill linked to the agent, as returned by the agent detail graph

        projection. Flat by design — a skill carries no sub-entities analogous

        to a toolset''s tools. Fields other than `name` are read straight off

        the skill document and are null when unset.

        '
      required:
      - name
      properties:
        name:
          type: string
          description: Unique skill name, used to reference the skill on agent create/update.
        description:
          type:
          - string
          - 'null'
        category:
          type:
          - string
          - 'null'
        subcategory:
          type:
          - string
          - 'null'
        version:
          type:
          - string
          - 'null'
        status:
          type:
          - string
          - 'null'
          description: Lifecycle state of the skill — `active`, `deprecated`, or `disabled`. `candidate` is a learning-loop record state, not an assignable skill, and is not returned here.
    CitationReference:
      type: object
      additionalProperties: false
      description: Reference to a source document cited in a response
      properties:
        citationId:
          type: string
          format: objectId
          description: ID of the citation record
        relevanceScore:
          type: number
          minimum: 0
          maximum: 1
          description: How relevant this citation is to the query (0-1)
        excerpt:
          type: string
          description: Relevant excerpt from the source document
        context:
          type: string
          description: Additional context around the citation
    AgentCreateResponseKnowledge:
      type: object
      additionalProperties: false
      required:
      - connectorId
      - key
      - filters
      properties:
        connectorId:
          type: string
        key:
          type: string
        filters:
          oneOf:
          - type: object
            additionalProperties: true
          - type: string
          - type: array
            items: {}
    AgentSkillAssignment:
      type: object
      additionalProperties: false
      description: Reference to an existing skill assigned to an agent.
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Lowercase skill name using single hyphens between segments.
    AgentCreateResponseSkill:
      type: object
      additionalProperties: false
      description: 'A skill linked to the agent at creation time. Creating or updating an

        agent only links edges to skills that already exist and never writes a

        skill document, so only the name is echoed back here.

        '
      required:
      - name
      properties:
        name:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      description: 'Standard error envelope returned by all errors routed through `ErrorMiddleware`.

        Applies to all `BaseError` subclasses including `HttpError`, `ValidationError`, and others.

        The `code` field is a machine-readable string identifying the error type (e.g.

        `HTTP_UNAUTHORIZED`, `HTTP_NOT_FOUND`, `VALIDATION_ERROR`, `INTERNAL_ERROR`).

        '
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          properties:
            requestId:
              type: string
              description: 'Identifier for this request, echoed so a bug report can quote it.

                Absent when the request never reached the middleware that assigns one.

                '
            code:
              type: string
              description: 'Machine-readable error code. For application errors it takes the form `HTTP_<VARIANT>`

                For unhandled runtime errors (e.g. database unavailable) it is `INTERNAL_ERROR`.

                '
              example: HTTP_BAD_REQUEST
            message:
              type: string
              description: Human-readable description of the error
              example: Admin access required
            metadata:
              type: object
              description: Additional context (only present in development environments)
              additionalProperties: true
      required:
      - error
    ConversationTitleUpdateRequest:
      type: object
      additionalProperties: false
      required:
      - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: New title for the conversation
          example: ABC News Follow-up
    AgentConversationDeleteResponse:
      type: object
      additionalProperties: false
      description: 'Envelope returned by `DELETE /agents/{agentKey}/conversations/{conversationId}`.

        When the conversation does not exist, belongs to a different agent, or

        was already deleted, the API still returns HTTP 200 with

        `conversation: null`.

        '
      required:
      - message
      - conversation
      properties:
        message:
          type: string
          enum:
          - Conversation deleted successfully
        conversation:
          anyOf:
          - $ref: '#/components/schemas/StoredAgentConversation'
          - type:
            - object
            - 'null'
            enum:
            - null
    AgentFilters:
      description: 'Knowledge scope filter as stored on the graph edge. The Node `getAgent`

        handler proxies this field unchanged from the AI service (only `agent.id`

        is stripped). May be a JSON string (typical graph storage) or an object.

        Prefer `filtersParsed` on GET for a guaranteed parsed object with the

        same keys as the object branch below.

        '
      oneOf:
      - $ref: '#/components/schemas/AgentKnowledgeFiltersParsed'
      - type: string
        description: JSON-encoded filter object (graph storage format).
    AgentCreateResponseMcpServer:
      type: object
      additionalProperties: false
      required:
      - name
      - displayName
      - key
      - tools
      properties:
        name:
          type: string
        displayName:
          type: string
          description: Human-readable MCP server product label (for example `Jira MCP`).
        key:
          type: string
        tools:
          type: array
          items:
            $ref: '#/components/schemas/AgentCreateResponseMcpServerTool'
    AgentConversationListResponse:
      type: object
      additionalProperties: false
      description: 'Envelope returned by `GET /agents/{agentKey}/conversations`.

        `conversations` contains rows owned by the caller for the agent;

        `sharedWithMeConversations` contains rows shared with the caller for

        the same agent. Both arrays use the same pagination and sort inputs,

        but `pagination.totalCount` and `totalPages` are computed only from

        `conversations` because the handler counts the owned-query filter only.

        '
      required:
      - conversations
      - sharedWithMeConversations
      - pagination
      - filters
      - meta
      properties:
        conversations:
          type: array
          items:
            $ref: '#/components/schemas/AgentConversationListItem'
        sharedWithMeConversations:
          type: array
          items:
            $ref: '#/components/schemas/AgentConversationListItem'
        pagination:
          $ref: '#/components/schemas/SemanticSearchHistoryPagination'
        filters:
          $ref: '#/components/schemas/SemanticSearchHistoryFilters'
        meta:
          $ref: '#/components/schemas/SemanticSearchHistoryMeta'
    AgentConversationDetailMessage:
      type: object
      additionalProperties: false
      description: 'Message shape returned by `GET /agents/{agentKey}/conversations/{conversationId}`.

        The response spreads the stored message document and replaces

        `citations` with populated citation objects.

        '
      properties:
        _id:
          type: string
          format: objectId
        messageType:
          type: string
          enum:
          - user_query
          - bot_response
          - error
          - feedback
          - system
          - tool_call
        content:
          type: string
        contentFormat:
          type: string
          enum:
          - MARKDOWN
          - JSON
          - HTML
        citations:
          type: array
          items:
            $ref: '#/components/schemas/AgentConversationDetailMessageCitation'
        confidence:
          type:
          - string
          - 'null'
          enum:
          - Very High
          - High
          - Medium
          - Low
          - Unknown
          description: 'AI confidence in the answer. Present only on `bot_response` messages,

            and only when the model emitted a trailing confidence block.


            This field is now optional and nullable; it was previously always present and non-nullable. Treat a missing or `null` value as "no confidence reported" and guard before using it. Change effective in SDK v1.3.0 (v1.2.0 and earlier always populated it).

            '
        followUpQuestions:
          type: array
          items:
            $ref: '#/components/schemas/FollowUpQuestion'
        feedback:
          type: array
          items:
            $ref: '#/components/schemas/MessageFeedback'
        referenceData:
          type: array
          description: 'Reference identifiers surfaced from tool responses, used to scope

            follow-up queries.

            '
          items:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
                description: Display name shown to the user.
              id:
                type: string
                description: Technical identifier (numeric ID, UUID, etc.).
              type:
                type: string
                description: Item type (e.g. `project`, `issue`, `file`, `notebook`, `page`).
              app:
                type: string
                description: 'Source application (e.g. `jira`, `confluence`, `sharepoint`,

                  `slack`, `drive`, `gmail`).

                  '
              webUrl:
                type: string
                description: URL to open the item in a browser.
              metadata:
                type: object
                additionalProperties:
                  type: string
                description: 'App-specific fields keyed by name (e.g. `key` for a Jira project,

                  `siteId` for a SharePoint document).

                  '
        attachments:
          type: array
          description: 'Files uploaded for this message turn (see

            `POST /agents/{agentKey}/conversations/attachments/upload`).

            '
          items:
            $ref: '#/components/schemas/ChatAttachmentRef'
        tools:
          type: array
          description: Tool call results invoked during this message turn.
          items:
            $ref: '#/components/schemas/MessageToolCall'
        reasoning:
          type: array
          description: Persisted chain-of-thought for this turn.
          items:
            $ref: '#/components/schemas/MessageReasoningTurn'
        parts:
          type: array
          description: Ordered agent-activity transcript for this turn.
          items:
            $ref: '#/components/schemas/MessagePart'
        modelInfo:
          $ref: '#/components/schemas/ConversationModelInfo'
        appliedFilters:
          $ref: '#/components/schemas/AppliedFilters'
        metadata:
          type: object
          additionalProperties: false
          properties:
            processingTimeMs:
              type: number
            modelVersion:
              type: string
            aiTransactionId:
              type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AgentStreamCreateConversationRequest:
      allOf:
      - $ref: '#/components/schemas/AgentCreateConversationRequest'
      - type: object
        description: 'Request body for `POST /agents/{agentKey}/conversations/stream`.

          `query` and `chatMode: quick` are required; all other fields are

          optional overrides. Unknown fields are stripped during validation.

          '
        required:
        - chatMode
    AgentCreateRequest:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Agent display name
          example: Product Support Agent
        description:
          type: string
          maxLength: 100000
          description: What the agent does
        startMessage:
          type: string
          maxLength: 100000
          description: Initial greeting shown when conversation starts
        systemPrompt:
          type: string
          maxLength: 100000
          description: System instructions for the agent
        instructions:
          type: string
          maxLength: 100000
          description: Additional agent execution instructions
        models:
          type: array
          minItems: 0
          default: []
          description: 'Agent model configuration entries. Optional — an agent created without

            any models (an empty array or an omitted field) uses the organization''s

            default LLM at chat time. When at least one model entry IS provided, the

            gateway requires at least one object entry with `isReasoning: true`.

            String-only arrays are schema-valid but rejected at runtime with HTTP 400

            unless the array is empty.

            '
          items:
            $ref: '#/components/schemas/AgentCreateModelEntry'
        tags:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 100
        shareWithOrg:
          type: boolean
          default: false
          description: Share agent with the organization
        isServiceAccount:
          type: boolean
          default: false
          description: Create the agent as a service-account agent
        toolsets:
          type: array
          maxItems: 100
          description: Toolsets attached to the agent (instance-aware)
          items:
            $ref: '#/components/schemas/AgentCreateToolset'
        knowledge:
          type: array
          maxItems: 100
          description: Knowledge sources connected to the agent
          items:
            $ref: '#/components/schemas/AgentCreateKnowledge'
        skills:
          type: array
          maxItems: 100
          description: Existing skills to assign to the agent
          items:
            $ref: '#/components/schemas/AgentSkillAssignment'
        webSearch:
          $ref: '#/components/schemas/AgentCreateWebSearch'
        defaultReasoningEffort:
          type:
          - string
          - 'null'
          enum:
          - none
          - low
          - medium
          - high
          - max
          description: Agent-level reasoning effort used when a chat request omits its own.
        sendUserContext:
          type: boolean
          default: true
          description: 'When true (default), include the current user''s name, email, and

            organization in this agent''s system prompt. When false, omit that

            profile data.

            '
    Conversation:
      type: object
      description: 'A conversation represents a chat session between a user and the AI.

        Conversations maintain context across multiple messages and can be

        shared, archived, and organized.

        '
      properties:
        _id:
          type: string
          format: objectId
          description: Unique conversation identifier
        userId:
          type: string
          format: objectId
          description: ID of the user who owns this conversation
        orgId:
          type: string
          format: objectId
          description: Organization this conversation belongs to
        title:
          type: string
          description: 'Conversation title, auto-generated from first query

            or manually updated

            '
          example: Q4 Financial Report Discussion
        initiator:
          type: string
          format: objectId
          description: User who started the conversation
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
          description: All messages in this conversation
        status:
          type: string
          enum:
          - None
          - Inprogress
          - Complete
          - Failed
          - Stopped
          description: "Current status of the conversation:\n- `None` — no activity yet\n- `Inprogress` — AI is processing\n- `Complete` — response ready\n- `Failed` — error occurred\n- `Stopped` — cancelled, or the client disconnected mid-answer;\n  the last message keeps the partial answer\n"
        failReason:
          type: string
          description: Error description, populated only when `status` is `Failed`.
        modelInfo:
          type: object
          properties:
            modelKey:
              type: string
            modelName:
              type: string
            modelFriendlyName:
              type: string
              description: Friendly display name of the selected model
            modelProvider:
              type: string
            chatMode:
              type: string
          description: AI model configuration used
        isShared:
          type: boolean
          default: false
          description: Whether this conversation is shared with others
        shareLink:
          type: string
          description: Shareable link if conversation is shared
        sharedWith:
          type: array
          items:
            type: object
            properties:
              userId:
                type: string
                format: objectId
              accessLevel:
                type: string
                enum:
                - read
                - write
          description: Users this conversation is shared with
        isArchived:
          type: boolean
          default: false
          description: Whether this conversation is archived
        archivedBy:
          type:
          - string
          - 'null'
          format: objectId
          description: 'User ID of the last user who archived this row, or `null` after

            unarchive cleared the archive state. Absent on rows that have

            never been archived.

            '
        isDeleted:
          type: boolean
          default: false
          description: Whether this conversation has been soft-deleted.
        deletedBy:
          type: string
          format: objectId
          description: User who soft-deleted this conversation.
        conversationErrors:
          type: array
          description: Errors recorded against this conversation (e.g. failed message generations).
          items:
            type: object
            required:
            - message
            properties:
              message:
                type: string
              errorType:
                type: string
              timestamp:
                type: string
                format: date-time
              messageId:
                type: string
                format: objectId
              stack:
                type: string
              metadata:
                type: object
                additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
          description: Free-form metadata attached to the conversation.
        lastActivityAt:
          type: integer
          description: Unix timestamp of last activity
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        isOwner:
          type: boolean
          description: 'Computed per request. `true` when the requesting user is the

            conversation''s `initiator`.

            '
          readOnly: true
        accessLevel:
          type: string
          enum:
          - read
          - write
          description: 'Computed per request. The requester''s effective access level:

            their entry in `sharedWith`, or `read` by default.

            '
          readOnly: true
        projectId:
          type:
          - string
          - 'null'
          format: objectId
          description: 'The project this conversation is linked to, if any. Set via

            `PUT /conversations/{conversationId}/project` or at creation

            time; absent on conversations that were never linked.

            '
        projectVisibility:
          type:
          - string
          - 'null'
          enum:
          - private
          - project
          description: 'Only meaningful when `projectId` is set. `private` (default)

            keeps the conversation visible to its owner only; `project`

            exposes it to every member of the linked project. See

            `PATCH /conversations/{conversationId}/project-visibility`.

            '
        sharedBy:
          $ref: '#/components/schemas/ConversationSharedBy'
    ChatAttachmentUploadRef:
      type: object
      additionalProperties: false
      description: 'Concrete attachment metadata returned by `POST /conversations/attachments/upload`

        (or the equivalent agent route).

        '
      required:
      - recordId
      - recordName
      - mimeType
      - extension
      - virtualRecordId
      properties:
        recordId:
          type: string
          minLength: 1
          description: Server-assigned attachment record id.
        recordName:
          type: string
          minLength: 1
          description: Original filename stored for the attachment.
        mimeType:
          type: string
          minLength: 1
          description: MIME type of the uploaded file.
        extension:
          type: string
          minLength: 1
          description: File extension derived by the backend.
        virtualRecordId:
          type: string
          minLength: 1
          description: Synthetic record id used by the graph layer.
        parseMode:
          type: string
          minLength: 1
          description: Backend-reported parsing mode used for the attachment (e.g. `pdfplumber`, `docling`, `csv_lightweight`).
        ocrMode:
          type: string
          minLength: 1
          deprecated: true
          description: Deprecated alias for `parseMode`, kept for backward compatibility. Use `parseMode` instead.
    MessageFeedbackAppendEntry:
      type: object
      additionalProperties: false
      required:
      - feedbackProvider
      - timestamp
      - metrics
      description: 'The feedback entry just appended to the message. Echoes the fields

        supplied in the request plus server-stamped `feedbackProvider`,

        `timestamp`, and `metrics`.

        '
      properties:
        isHelpful:
          type: boolean
          description: Echoed from the request when supplied.
        categories:
          type: array
          description: Echoed categories from the request.
          items:
            type: string
            enum:
            - incorrect_information
            - missing_information
            - irrelevant_information
            - unclear_explanation
            - poor_citations
            - excellent_answer
            - helpful_citations
            - well_explained
            - other
        comments:
          type: object
          additionalProperties: false
          description: Echoed free-text comments from the request.
          properties:
            positive:
              type: string
            negative:
              type: string
        feedbackProvider:
          type: string
          format: objectId
          description: User who submitted the feedback. Always present.
        timestamp:
          type: integer
          format: int64
          description: 'Submission time as epoch milliseconds (not an ISO 8601 datetime).

            Always present.

            '
        metrics:
          $ref: '#/components/schemas/MessageFeedbackAppendMetrics'
    MessageFeedbackSubmitRequest:
      type: object
      additionalProperties: false
      description: 'Gateway request body for submitting message feedback (Zod

        `feedbackBodySchema`). All fields are optional; an empty object is

        accepted. Matches the first-party chat UI payload shape.

        '
      properties:
        isHelpful:
          type: boolean
          description: Overall helpfulness signal (thumbs up/down).
        categories:
          type: array
          description: Issue or positive categories that apply to the response.
          items:
            type: string
            enum:
            - incorrect_information
            - missing_information
            - irrelevant_information
            - unclear_explanation
            - poor_citations
            - excellent_answer
            - helpful_citations
            - well_explained
            - other
        comments:
          type: object
          additionalProperties: false
          description: Free-text comments grouped by sentiment.
          properties:
            positive:
              type: string
              description: What was good about the response.
            negative:
              type: string
              description: What could be improved.
    AgentRegenerateSSEEvent:
      type: object
      additionalProperties: false
      description: "SSE event envelope for `POST /agents/{agentKey}/conversations/{conversationId}/message/{messageId}/regenerate`.\nAG-UI is the sole wire protocol.\n\n`event` carries the AG-UI type name and `data` is a JSON object that\nincludes a `\"type\"` field matching `event`, plus type-specific\nfields. Stable gateway-generated top-level outcomes:\n\n- `RUN_FINISHED` returns `{ type, result }` where\n  `result` is `{ conversation, recordsUsed, meta }` — the updated\n  conversation plus request metadata after the regenerated response\n  is persisted.\n- `RUN_ERROR` returns `{ type, message, code? }`. Conversation\n  lookup failures, unauthorized conversation access, and regenerate\n  rule failures such as \"not the last message\" are reported here.\n\nOther events are forwarded from the agent backend and should be\ntreated as informational updates. Those forwarded lifecycle and\nchild-run events may contain `runId`, `threadId`, and `parentRunId`;\nthe gateway-generated root terminal event does not.\n"
      properties:
        event:
          type: string
          enum:
          - RUN_STARTED
          - RUN_FINISHED
          - RUN_ERROR
          - STEP_STARTED
          - STEP_FINISHED
          - TEXT_MESSAGE_START
          - TEXT_MESSAGE_CONTENT
          - TEXT_MESSAGE_END
          - REASONING_START
          - REASONING_MESSAGE_START
          - REASONING_MESSAGE_CONTENT
          - REASONING_MESSAGE_END
          - REASONING_END
          - TOOL_CALL_START
          - TOOL_CALL_ARGS
          - TOOL_CALL_END
          - TOOL_CALL_RESULT
          - STATE_DELTA
          - STATE_SNAPSHOT
          - CUSTOM
          - HEARTBEAT
        data:
          type: string
          description: 'JSON-encoded event payload. The decoded JSON includes a `"type"`

            field matching `event`, plus type-specific fields. Shape depends

            on `event`.

            '
    Citation:
      type: object
      additionalProperties: false
      description: 'A populated citation document. Represents a single chunk of source

        content (e.g. a passage from a document or record) referenced by an

        AI response, together with its provenance metadata.

        '
      required:
      - _id
      - content
      - chunkIndex
      - citationType
      - metadata
      - createdAt
      - updatedAt
      properties:
        _id:
          type: string
          format: objectId
        content:
          type: string
          description: The cited text chunk
        chunkIndex:
          type: integer
          description: Index of this chunk within the source record
        citationType:
          type: string
          description: Source type identifier (e.g. `vectordb|document`)
        metadata:
          $ref: '#/components/schemas/PersistedSemanticSearchCitationMetadata'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ConversationModelInfo:
      type: object
      additionalProperties: false
      description: AI model configuration recorded against a conversation or message.
      properties:
        modelKey:
          type: string
          description: Stable identifier of the configured model record
        modelName:
          type: string
          description: Provider-facing model name (e.g. `gpt-5.6-luna`)
        modelProvider:
          type: string
          description: Provider key (e.g. `openai`, `anthropic`)
        modelFriendlyName:
          type: string
          description: Human-readable display name
        chatMode:
          type: string
          description: Chat mode used for this turn (e.g. `quick`, `internal_search`)
    AgentKnowledgeFiltersParsed:
      type: object
      additionalProperties: false
      description: 'Indexed scope for a knowledge connector: record-group ids and

        individual record ids. On GET, `filtersParsed` is this shape parsed

        from the stored `filters` JSON string.

        '
      properties:
        recordGroups:
          type: array
          items:
            type: string
          description: 'Deprecated/legacy: record-group ids for connector record-group scoping (e.g. Confluence spaces, Jira projects). No longer set for KB (Collection) entries — a KB is identified by its own `connectorId`, not by an id in this list.'
        records:
          type: array
          items:
            type: string
          description: Individual record ids in scope.
    AgentCreateModelEntry:
      description: 'Accepted model entry for `POST /agents/create`.

        The gateway accepts either a non-empty string model entry or an object entry

        with a required `modelKey`.


        The `models` array itself is optional and may be empty (the agent then uses

        the organization''s default LLM). When the array is non-empty, it must include

        at least one object entry with `isReasoning: true`. String-only entries are

        schema-valid but, if present without any reasoning-flagged object entry, are

        rejected at the gateway with HTTP 400.

        '
      oneOf:
      - type: string
        minLength: 1
      - type: object
        additionalProperties: false
        required:
        - modelKey
        properties:
          modelKey:
            type: string
            minLength: 1
          modelName:
            type: string
          provider:
            type: string
          isReasoning:
            type: boolean
    ConversationSharedBy:
      type: object
      additionalProperties: false
      description: 'Present on conversations the caller received via share. Identifies the

        conversation initiator (the only user who can share a chat).

        '
      required:
      - userId
      - name
      properties:
        userId:
          type: string
          format: objectId
        name:
          type: string
          description: Display name, falling back to email or the user id
    McpServer:
      type: object
      additionalProperties: false
      description: 'MCP server instance linked to an agent, as projected by the graph

        store on `GET /agents/{agentKey}` and `GET /agents` — same shape as

        `Toolset`. MCP server nodes carry no secrets, only the attach-time

        snapshot of `instanceId`/`typeId`/`name`.

        '
      properties:
        _key:
          type: string
          description: MCP server instance node key in the backing graph store.
        name:
          type: string
          description: MCP server attachment name (attach-time snapshot).
        displayName:
          type: string
          description: Human-readable MCP server product label (for example `Jira MCP`).
        typeId:
          type: string
          description: Catalog server type id, when this instance came from a registered template.
        instanceId:
          type: string
          description: Admin-created MCP server instance id.
        tools:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              _key:
                type: string
                description: Tool node key in the backing graph store.
              name:
                type: string
              fullName:
                type: string
              description:
                type: string
    AgentUpdateResponse:
      type: object
      additionalProperties: false
      required:
      - status
