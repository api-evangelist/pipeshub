    MessageFeedbackAppendMetrics:
      type: object
      additionalProperties: false
      required:
      - timeToFeedback
      description: 'Telemetry recorded server-side alongside the feedback. Always present

        on append responses.

        '
      properties:
        timeToFeedback:
          type: number
          description: 'Milliseconds between message creation and feedback submission.

            Always present.

            '
        userAgent:
          type: string
          description: Value of the `User-Agent` request header captured server-side.
    AgentStreamSSEEvent:
      type: object
      description: 'SSE event envelope for `POST /agents/{agentKey}/conversations/stream`.

        AG-UI is the sole wire protocol.


        `event` carries the AG-UI type name and `data` is a JSON-encoded

        object that includes a `"type"` field matching `event`, plus

        type-specific fields. The public route requires `chatMode: quick`.

        Forwarded lifecycle events may carry `runId`, `threadId`, and

        `parentRunId`; gateway-generated root terminal events do not.


        Stable gateway-generated top-level outcomes are `RUN_FINISHED` as

        `{ type, result }` and `RUN_ERROR` as `{ type, message, code? }`.

        Clients should ignore unknown event names rather than treating them

        as errors.

        '
      properties:
        event:
          type: string
          enum:
          - RUN_STARTED
          - RUN_FINISHED
          - RUN_ERROR
          - STEP_STARTED
          - STEP_FINISHED
          - TEXT_MESSAGE_START
          - TEXT_MESSAGE_CONTENT
          - TEXT_MESSAGE_END
          - REASONING_START
          - REASONING_MESSAGE_START
          - REASONING_MESSAGE_CONTENT
          - REASONING_MESSAGE_END
          - REASONING_END
          - TOOL_CALL_START
          - TOOL_CALL_ARGS
          - TOOL_CALL_END
          - TOOL_CALL_RESULT
          - STATE_DELTA
          - STATE_SNAPSHOT
          - CUSTOM
          - HEARTBEAT
        data:
          type: string
          description: 'JSON-encoded event payload. The decoded JSON includes a `"type"`

            field matching `event`, plus type-specific fields. Shape depends

            on `event`.

            '
