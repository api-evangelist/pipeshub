  /agents/{agentKey}/conversations/{conversationId}/cancel:
    post:
      tags:
      - Agents
      summary: Cancel an in-flight agent chat stream
      description: 'Cooperatively stop a `POST /agents/{agentKey}/conversations/stream`

        or `.../messages/stream` run that is still generating, using the

        `runId` sent when that stream started.


        Same synchronous JSON ack contract as the assistant

        `POST /conversations/{conversationId}/cancel` — both forward to the

        same backend cancellation endpoint, since the run registry is keyed

        by `runId` alone. `{ cancelled: false }` covers a `runId` that

        already finished or was never registered.


        `runId` must belong to a run started on THIS `conversationId` — a

        `runId` that exists but was registered under a different

        conversation (even one owned by the same caller) is rejected with

        `403`, same as a `runId` owned by a different user/org.'
      operationId: cancelAgentConversationStream
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      - oauth2:
        - agent:execute
      parameters:
      - name: agentKey
        in: path
        required: true
        description: Stable key identifying the agent that owns this conversation.
        schema:
          type: string
          minLength: 1
      - name: conversationId
        in: path
        required: true
        description: ID of the agent conversation to cancel a run for.
        schema:
          type: string
          format: objectId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - runId
              properties:
                runId:
                  type: string
                  format: uuid
                  description: The `runId` sent when the stream was started.
      responses:
        '200':
          description: Cancellation requested, or the run had already finished.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelled:
                    type: boolean
        '400':
          description: Missing or malformed `runId`.
        '401':
          description: Unauthorized
        '403':
          description: '`runId` exists but was registered under a different user, org, or conversation than this request.'
        '404':
          description: Conversation not found or unauthorized
