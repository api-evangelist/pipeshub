            '
        isDeleted:
          type: boolean
        deletedBy:
          type:
          - string
          - 'null'
          format: objectId
        conversationErrors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              message:
                type: string
              errorType:
                type: string
              timestamp:
                type: string
                format: date-time
              messageId:
                type: string
                format: objectId
              stack:
                type: string
              metadata:
                type: object
                additionalProperties: true
        conversationSource:
          type: string
          enum:
          - agent_chat
        lastActivityAt:
          type: integer
          format: int64
          description: Epoch milliseconds of the latest activity on the thread
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        isOwner:
          type: boolean
          readOnly: true
          description: 'Computed per request. `true` when the conversation `initiator`

