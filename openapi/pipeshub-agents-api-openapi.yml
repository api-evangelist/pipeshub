    Agent:
      type: object
      additionalProperties: false
      description: 'Detailed agent projection returned by agent detail-style endpoints such

        as `GET /agents/{agentKey}`.

        '
      properties:
        _id:
          type: string
          description: Full document id in the backing graph store.
          example: agentInstances/e6f848ca-e2ab-4594-9925-e1136629f474
        _key:
          type: string
          description: Stable agent key used in route params.
          example: e6f848ca-e2ab-4594-9925-e1136629f474
        _rev:
          type: string
          description: Backend document revision token.
          example: _lkNlcOm---
        name:
          type: string
          description: Display name of the agent
          example: Customer Support Assistant
        description:
          type: string
          description: What this agent is designed to do
        systemPrompt:
          type: string
          description: System instructions that define agent behavior
        createdBy:
          type: string
          format: objectId
          description: MongoDB user ID of the agent creator
        startMessage:
          type: string
          description: Initial greeting shown when a conversation with this agent starts
        instructions:
          type:
          - string
          - 'null'
          description: Additional agent execution instructions
        models:
          type: array
          description: 'Configured model entries for this agent.

            '
          example:
          - modelType: llm
            provider: azureOpenAI
            modelName: gpt-5.6-luna
            modelKey: f3a4b5b6-5b6c-4e85-9097-3202cfe696fc
            isMultimodal: true
            isReasoning: true
            isDefault: true
            modelFriendlyName: GPT 5.4 mini
          items:
            oneOf:
            - type: string
            - type: object
              additionalProperties: false
              properties:
                modelKey:
                  type: string
                modelName:
                  type: string
                provider:
                  type: string
                isReasoning:
                  type: boolean
                isMultimodal:
                  type: boolean
                isDefault:
                  type: boolean
                modelType:
                  type: string
                  description: 'Model category. Must be `llm` for agent model entries (same

                    value as `ModelType` for LLMs; string only — enum is not used here).

                    '
                  example: llm
                modelFriendlyName:
                  type: string
        usesOrgDefault:
          type: boolean
          description: 'True when this agent has no models configured and will use the

            organization''s default LLM (marked `isDefault: true` in the AI

            models configuration) at chat time. Derived from `models` being

            empty — not persisted separately.

            '
        toolsets:
          type: array
          description: 'Toolset instances linked to the agent (GET /agents/{agentKey} graph projection).

            Multiple instances of the same integration type are distinguished by `instanceId`

            and optional `instanceName`.

            '
          items:
            $ref: '#/components/schemas/Toolset'
        mcpServers:
          type: array
          description: 'MCP server instances linked to the agent (GET /agents/{agentKey} graph

            projection). Same shape/semantics as `toolsets`, keyed by `instanceId`.

            '
          items:
            $ref: '#/components/schemas/McpServer'
        knowledge:
          type: array
          description: Knowledge connectors and indexed scopes linked to the agent
          items:
            $ref: '#/components/schemas/Knowledge'
        skills:
          type: array
          description: Skills linked to the agent via `agentHasSkill` edges
          items:
            $ref: '#/components/schemas/AgentSkill'
        shareWithOrg:
          type: boolean
          description: Whether the agent is shared with the whole organization
        webSearch:
          type:
          - object
          - 'null'
          additionalProperties: false
          description: Web search provider attached to this agent. Null when none is configured.
          properties:
            provider:
              type: string
              description: Provider identifier (e.g. "tavily", "serper", "exa", "duckduckgo")
            providerKey:
              type: string
            providerLabel:
              type: string
          required:
          - provider
          example:
            provider: serper
        defaultReasoningEffort:
          type:
          - string
          - 'null'
          enum:
          - none
          - low
          - medium
          - high
          - max
          description: Agent-level reasoning effort used when a chat request omits its own. Null when unset.
        sendUserContext:
          type: boolean
          description: 'When true (default), the agent''s system prompt includes the current

            user''s name, email, and organization. When false, the agent relies

            on tools, actions, and knowledge sources without that profile data.

            '
        tags:
          type: array
          items:
            type: string
          description: Free-form agent tags.
        createdAtTimestamp:
          type: integer
          format: int64
          description: Unix epoch timestamp in milliseconds when the agent was created.
        updatedAtTimestamp:
          type: integer
          format: int64
          description: Unix epoch timestamp in milliseconds when the agent was last updated.
        updatedBy:
          type:
          - string
          - 'null'
          description: User id of the last updater, if present.
        isActive:
          type: boolean
          description: Whether the agent is active.
        isDeleted:
          type: boolean
          description: Whether the agent has been soft-deleted.
        isServiceAccount:
          type: boolean
          description: Whether this agent is a service-account agent.
        access_type:
          type: string
          description: How the user can access this agent.
          example: INDIVIDUAL
        user_role:
          type: string
          description: Effective role of the current user on this agent.
          example: OWNER
        can_view:
          type: boolean
          description: Effective permission to view the agent.
        can_share:
          type: boolean
          description: Effective permission to share the agent.
        can_edit:
          type: boolean
          description: Effective permission to edit the agent.
        can_delete:
          type: boolean
          description: Effective permission to delete the agent.
      required:
      - _id
      - _key
      - createdAtTimestamp
      - createdBy
      - isActive
      - isDeleted
      - isServiceAccount
      - models
      - name
      - tags
      - updatedAtTimestamp
      - shareWithOrg
      - knowledge
      - toolsets
      - mcpServers
      - skills
      - can_view
      - can_share
      - can_edit
      - can_delete
      - user_role
      - access_type
    CreateAgentConversationResponse:
      type: object
      description: 'Envelope returned by `POST /agents/{agentKey}/conversations`: the

        persisted agent conversation (initial user message plus the agent''s

        answer) and request metadata.

        '
      required:
      - conversation
      - meta
      properties:
        conversation:
          $ref: '#/components/schemas/AgentConversation'
        meta:
          type: object
          required:
          - timestamp
          - duration
          properties:
            requestId:
              type: string
            timestamp:
              type: string
              format: date-time
            duration:
              type: integer
              minimum: 0
    RegenerateRequest:
      type: object
      additionalProperties: false
      description: "Request body for regenerating an AI response. All fields are optional;\nwhen omitted the model selection and execution context from the\noriginal message are reused.\n\nSupported fields:\n- `filters` — optional `{ apps?, kb? }` filter object\n- `chatMode` — optional non-empty chat mode string\n- `modelKey`, `modelName`, `modelFriendlyName` —\n  optional non-empty model override fields\n- `timezone` — optional non-empty client timezone string\n- `currentTime` — optional ISO 8601 / RFC 3339 datetime string with\n  UTC `Z` or a numeric offset\n- `tools` — optional array of non-empty tool identifiers\n- `protocol` — optional inert compatibility field; when present it must\n  be `agui`, which is also the protocol used when the field is omitted\n- `agentCapabilities` — optional per-request agent capability toggles\n"
      properties:
        filters:
          $ref: '#/components/schemas/Filters'
        modelKey:
          type: string
          minLength: 1
          description: 'Identifier of the AI model configuration to use for regeneration.

            Typically a UUID returned by the model-management endpoints. When

            omitted, the model used for the original message is reused.

            '
          example: 05438a37-68f2-4641-a8dc-6c47e63278ca
        modelName:
          type: string
          minLength: 1
          description: Provider model name (e.g. the underlying LLM identifier).
          example: gpt-5.6-luna
        modelFriendlyName:
          type: string
          minLength: 1
          description: Friendly display name of the selected model.
          example: mini
        chatMode:
          type: string
          minLength: 1
          description: 'Chat mode used for regeneration (for example `internal_search`,

            `web_search`, or the universal `agent` mode).

            '
          example: internal_search
        timezone:
          type: string
          minLength: 1
          description: 'IANA timezone identifier from the client. Used to provide

            time-aware context to the AI during regeneration.

            '
          example: Asia/Calcutta
        currentTime:
          type: string
          format: date-time
          description: 'ISO 8601 / RFC 3339 datetime from the client (UTC `Z` or numeric

            offset). Used to anchor any relative time references in the query.

            '
          example: '2026-05-11T15:43:21+05:30'
        tools:
          type: array
          items:
            type: string
            minLength: 1
          description: 'Optional list of tool identifiers (fully-qualified action names

            such as `jira.create_issue`) the agent may invoke when

            regenerating. Applicable only in agent chat modes.

            '
          example:
          - jira.create_issue
          - confluence.search_content
        protocol:
          type: string
          enum:
          - agui
          description: 'AG-UI is the only supported wire protocol. When present must be

            `"agui"`. Omitting the field is equivalent — the server always

            uses the AG-UI vocabulary. Kept in the schema for backward

            compatibility with callers that already send it.

            '
        agentCapabilities:
          $ref: '#/components/schemas/AgentCapabilities'
        runId:
          type: string
          format: uuid
          description: 'Client-generated identifier for this regeneration run. Send it

            here to enable `POST .../cancel {runId}` while it is still

            generating.

            '
    PopulatedCitationReference:
      type: object
      additionalProperties: false
      description: 'A message''s citation reference after the handler populates it: the

        stored reference fields, with `citationId` as the id and the cited

        document under `citationData`.

        '
      properties:
        citationId:
          type: string
          format: objectId
