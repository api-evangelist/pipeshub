          description: Additional context around the citation
        citationData:
          $ref: '#/components/schemas/Citation'
    AgentAddMessageStreamRequest:
      allOf:
      - $ref: '#/components/schemas/AgentAddMessageRequest'
      - type: object
        description: 'Request body for `POST /agents/{agentKey}/conversations/{conversationId}/messages/stream`.

          `query` and `chatMode: quick` are required; all other fields are

          optional overrides. Unknown fields are stripped during validation.

          '
