        hasPrevPage:
          type: boolean
          description: True when newer messages exist outside the returned page
        messageRange:
          type: object
          additionalProperties: false
          required:
          - start
          - end
          properties:
            start:
              type: integer
            end:
              type: integer
    PersistedSemanticSearchBoundingBox:
      type: object
