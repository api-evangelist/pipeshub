openapi: 3.2.0
info:
  title: Pipeshub Agents API
  version: 1.0.0
  contact:
    name: API Support
    email: support@pipeshub.com
  description: 'Operations tagged Agents across 2 of this provider''s published API definitions: pipeshub-openapi.yaml, pipeshub-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: '{instance_url}/api/v1'
  description: Base API URL
  variables:
    instance_url:
      default: https://app.pipeshub.com
      description: Base server URL (without /api/v1)
- url: '{instance_url}'
  description: Root URL (used for MCP endpoints mounted at /mcp)
  variables:
    instance_url:
      default: https://app.pipeshub.com
      description: Base server URL
security:
- bearerAuth: []
- oauth2: []
tags:
- name: Agents
  description: Custom AI agents with specialized capabilities and tool integrations
paths:
  /agents:
    get:
      tags:
      - Agents
      summary: List agents
      description: 'Retrieve a paginated list of agents available to the authenticated user.


        **Overview**


        Returns agents accessible through direct, team, or org-level permissions.

        Search is performed across agent name, description, and tags. Sorting and

        pagination are applied by the AI backend and the resulting envelope is

        forwarded unchanged by the Node gateway.


        **Gateway contract**


        The Node route supports only these query params: `page`, `limit`, `search`,

        `sort_by`, and `sort_order`.


        The Python backend also understands `isDeleted`, but this gateway route

        does not forward it, so it is not part of the public API contract here.'
      operationId: listAgents
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      - oauth2:
        - agent:read
      parameters:
      - in: query
        name: page
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: 1-based page number.
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
        description: Maximum number of agents to return in the current page.
      - in: query
        name: search
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 1000
        description: Case-insensitive search across agent name, description, and tags. Leading/trailing whitespace is trimmed; blank-after-trim values are rejected.
      - in: query
        name: sort_by
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 100
          default: updatedAtTimestamp
        description: Backend sort field. Leading/trailing whitespace is trimmed. Common value is `updatedAtTimestamp`.
      - in: query
        name: sort_order
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
        description: Sort direction.
      responses:
        '200':
          description: Paginated list of accessible agents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentListResponse'
              examples:
                success:
                  summary: Example paginated response
                  value:
                    success: true
                    agents:
                    - _id: agentInstances/11111111-2222-3333-4444-555555555555
                      _key: 11111111-2222-3333-4444-555555555555
                      _rev: _exampleRev---
                      createdAtTimestamp: 1779792574728
                      createdBy: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
                      description: AI agent for customer support workflows
                      isActive: true
                      isDeleted: false
                      isServiceAccount: false
                      models:
                      - 99999999-8888-7777-6666-555555555555_gpt-5.6-luna
                      name: Customer Support Agent
                      startMessage: Hello! How can I help you today?
                      systemPrompt: You are a helpful assistant.
                      tags: []
                      updatedAtTimestamp: 1779792574728
                      shareWithOrg: false
                      toolsets: []
                      knowledge: []
                      can_view: true
                      can_share: true
                      can_edit: true
                      can_delete: true
                      user_role: OWNER
                      access_type: INDIVIDUAL
                    pagination:
                      currentPage: 1
                      limit: 20
                      totalItems: 2
                      totalPages: 1
                      hasNext: false
                      hasPrev: false
        '400':
          description: Validation failed for one or more query params.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    servers:
    - url: '{instance_url}/api/v1'
      description: Base API URL
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL (without /api/v1)
    - url: '{instance_url}'
      description: Root URL (used for MCP endpoints mounted at /mcp)
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL
  /agents/create:
    post:
      tags:
      - Agents
      summary: Create agent
      description: 'Create a new custom AI agent.


        **Overview:**

        Agents are specialized AI assistants configured for specific tasks.

        They can have custom system prompts, access to specific tools, and

        be limited to certain knowledge bases.


        **Agent Configuration:**

        - **System prompt:** Instructions that define agent behavior

        - **Tools:** Capabilities like web search, code execution, etc.

        - **Knowledge bases:** Data sources the agent can access

        - **Model config:** AI model settings (temperature, max tokens)


        **Use Cases:**

        - Customer support bot with product knowledge

        - Code review assistant with repository access

        - HR assistant with policy documents'
      operationId: createAgent
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      - oauth2:
        - agent:write
      requestBody:
        required: true
        description: Request payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCreateRequest'
      responses:
        '201':
          description: Agent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCreateResponse'
        '400':
          description: Invalid agent configuration
        '401':
          description: Unauthorized
    servers:
    - url: '{instance_url}/api/v1'
      description: Base API URL
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL (without /api/v1)
    - url: '{instance_url}'
      description: Root URL (used for MCP endpoints mounted at /mcp)
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL
  /agents/{agentKey}:
    get:
      tags:
      - Agents
      summary: Get agent
      description: 'Retrieve agent details by its unique key.


        **Gateway not-found behavior:**

        Unknown `agentKey`, lookup after soft-delete, and other AI-backend failures

        that return 404 from the Python query service are surfaced by the Node

        gateway as **HTTP 404** with an `ErrorResponse` body.'
      operationId: getAgent
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      - oauth2:
        - agent:read
      parameters:
      - name: agentKey
        in: path
        required: true
        description: Unique agent identifier
        schema:
          type: string
          minLength: 1
        example: customer-support-agent
      responses:
        '200':
          description: Agent details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAgentResponse'
        '401':
          description: Missing or invalid bearer token (e.g. `No token provided`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — insufficient OAuth scope (`agent:read` required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: 'Gateway validation failure (non-empty `agentKey` path param) or missing

            organization/user context on the authenticated request.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Agent not found, inaccessible, or previously deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected AI-backend or gateway failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: AI query service unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - Agents
      summary: Update agent
      description: 'Apply a partial update to an existing agent configuration.


        **Gateway contract**


        The Node gateway validates the request body via Zod middleware before

        forwarding to the Python agent service. The `agentKey` path param and

        the request body are both validated. Query parameters are ignored by

        the controller.


        **Update semantics**


        Only fields present in the request body are updated. `models` may be

        omitted (the agent''s existing models are kept), set to an empty array

        (clears the agent''s models so it falls back to the organization''s

        default LLM at chat time), or set to a non-empty array. When a

        non-empty array is provided, the gateway Zod middleware requires at

        least one object entry with `isReasoning: true`.


        **Permissions**


        The authenticated user must have `can_edit` on the agent (typically the

        owner). Service-account and `shareWithOrg` transitions follow additional

        Python business rules.


        **Success response**


        Returns a lightweight success envelope only. Use

        `GET /agents/{agentKey}` to read the persisted agent after an update.'
      operationId: updateAgent
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      - oauth2:
        - agent:write
      parameters:
      - name: agentKey
        in: path
        required: true
        description: Unique agent identifier
        schema:
          type: string
          minLength: 1
        example: customer-support-agent
      requestBody:
        required: true
        description: Partial agent configuration fields to update
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentUpdateRequest'
      responses:
        '200':
          description: Agent updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentUpdateResponse'
        '401':
          description: Missing or invalid authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — insufficient OAuth scope (`agent:write` required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: 'Gateway validation failure. Returned for missing/invalid `agentKey`,

            empty `models` array, `models` without a reasoning entry, malformed

            JSON, and other Zod schema violations. Syntactically invalid JSON may

            also surface as `500` depending on the Express parser.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Agent not found or inaccessible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected AI-backend or gateway failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Agents
      summary: Delete agent
      description: 'Soft-delete an agent (tombstone) in the graph database.


        **Overview:**

        The Python query service marks the agent instance deleted inside a transaction.

        List and search endpoints exclude tombstoned agents. Toolsets, tools, and

        knowledge linked to the agent are not removed by this call.


        **Permissions:**

        Only the agent owner may delete (`can_delete` on the permission check).


        **Warning:**

        All conversations with this agent will become inaccessible.


        **Gateway not-found behavior:**

        Unknown `agentKey`, deleting an already-deleted agent, and `GET /agents/{agentKey}`

        after delete return **HTTP 404** with an `ErrorResponse` body.'
      operationId: deleteAgent
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      - oauth2:
        - agent:write
      parameters:
      - name: agentKey
        in: path
        required: true
        description: Unique agent identifier (gateway Zod requires non-empty string).
        schema:
          type: string
          minLength: 1
        example: customer-support-agent
      responses:
        '200':
          description: Agent soft-deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDeleteResponse'
        '401':
          description: Missing or invalid bearer token (e.g. `No token provided`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Agent not found, inaccessible, or already deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected AI-backend or gateway failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    servers:
    - url: '{instance_url}/api/v1'
      description: Base API URL
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL (without /api/v1)
    - url: '{instance_url}'
      description: Root URL (used for MCP endpoints mounted at /mcp)
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL
  /agents/conversations/show/archives:
    get:
      tags:
      - Agents
      summary: List archived agent conversations grouped by agent
      description: 'Returns archived agent conversations for the current user, grouped by

        `agentKey`, with pagination over agent groups. Excludes conversations

        whose agent was soft-deleted upstream.'
      operationId: listAgentArchivedConversationsGrouped
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      - oauth2:
        - agent:read
      parameters:
      - name: agentPage
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: agentLimit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 5
      responses:
        '200':
          description: Grouped archived conversations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentArchivedGroupsResponse'
        '401':
          description: Unauthorized
    servers:
    - url: '{instance_url}/api/v1'
      description: Base API URL
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL (without /api/v1)
    - url: '{instance_url}'
      description: Root URL (used for MCP endpoints mounted at /mcp)
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL
  /agents/{agentKey}/conversations/show/archives:
    get:
      tags:
      - Agents
      summary: List archived conversations for an agent
      description: Paginated list of archived conversations for the given agent key.
      operationId: listAgentConversationArchives
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      - oauth2:
        - agent:read
      parameters:
      - name: agentKey
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: sortBy
        in: query
        schema:
          type: string
          enum:
          - createdAt
          - lastActivityAt
          - title
      - name: sortOrder
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
      - name: search
        in: query
        schema:
          type: string
          maxLength: 1000
      - name: startDate
        in: query
        schema:
          type: string
          format: date-time
      - name: endDate
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Archived conversations for the agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentArchivedConversationListResponse'
        '400':
          description: Invalid query parameters (gateway validation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
    servers:
    - url: '{instance_url}/api/v1'
      description: Base API URL
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL (without /api/v1)
    - url: '{instance_url}'
      description: Root URL (used for MCP endpoints mounted at /mcp)
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL
  /agents/{agentKey}/conversations/attachments/upload:
    post:
      tags:
      - Agents
      summary: Upload agent chat attachments
      description: 'Multipart upload of PDF, JPEG, or PNG files for agent chat. Same limits as assistant

        chat (`POST /conversations/attachments/upload`): up to 10 files, 5 MiB each. Proxies to

        the AI backend. Optional `conversationId` associates uploads with an existing agent thread.'
      operationId: uploadAgentConversationChatAttachments
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      - oauth2:
        - agent:execute
      parameters:
      - name: agentKey
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        description: Multipart form with attachment files and optional `conversationId`.
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - files
              properties:
                conversationId:
                  type: string
                  pattern: ^$|^[0-9a-fA-F]{24}$
                  description: 'Optional existing agent conversation id. Empty string is treated as unset; any non-empty value must be a 24-character ObjectId.

                    '
                files:
                  type: array
                  minItems: 1
                  maxItems: 10
                  description: 'One or more files; field name must be `files`. Accepted MIME types: `application/pdf`, `image/jpeg`, `image/jpg`, `image/png`, `text/plain`, `text/markdown`, `text/mdx`, `application/vnd.openxmlformats-officedocument.wordprocessingml.document`, `application/vnd.openxmlformats-officedocument.spreadsheetml.sheet`, `text/csv`, `text/tab-separated-values`. Max 5 MiB each.

                    '
                  items:
                    type: string
                    format: binary
                    x-speakeasy-name-override: File
      responses:
        '200':
          description: 'Success. The gateway proxies the AI-backend JSON envelope after transforming the multipart upload into the backend attachment payload.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatAttachmentUploadResponse'
        '400':
          description: 'Invalid `conversationId`, no files, unsupported MIME type, or Multer rejection (e.g. file too large).

            '
        '401':
          description: Unauthorized
        '403':
          description: Missing `agent:execute` scope
        '500':
          description: 'Gateway fallback when the upstream call does not return a status (implementation default).

            '
    servers:
    - url: '{instance_url}/api/v1'
      description: Base API URL
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL (without /api/v1)
    - url: '{instance_url}'
      description: Root URL (used for MCP endpoints mounted at /mcp)
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL
  /agents/{agentKey}/conversations/attachments/{recordId}:
    delete:
      tags:
      - Agents
      summary: Delete an agent chat attachment
      description: 'Deletes a previously uploaded attachment by proxying `DELETE` to the query service

        (`/api/v1/chat/attachments/{recordId}`). The Node handler always ends the response **without

        a JSON body** on success (empty body); the **status code** is the upstream status, or **204**

        if none is returned.


        On validation failure in the gateway (invalid / blank path params), the response is **400**

        with a small JSON error object. Same fire-and-forget semantics as

        `DELETE /conversations/attachments/{recordId}` on the client.'
      operationId: deleteAgentConversationChatAttachment
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      - oauth2:
        - agent:execute
      parameters:
      - name: agentKey
        in: path
        required: true
        description: Agent key path parameter. Must be non-empty.
        schema:
          type: string
          minLength: 1
      - name: recordId
        in: path
        required: true
        description: Attachment record id (from the upload response). Must be non-blank after trim.
        schema:
          type: string
          minLength: 1
      responses:
        '204':
          description: Success with no content (typical when upstream returns 204).
        '400':
          description: Invalid or blank path params (`agentKey` or `recordId`).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - error
                properties:
                  error:
                    type: string
                    example: recordId is required
        '401':
          description: Unauthorized
        '403':
          description: Missing `agent:execute` scope
        default:
          description: 'Other status codes are forwarded from the query service (e.g. 404) with an **empty** response body from this route.

            '
    servers:
    - url: '{instance_url}/api/v1'
      description: Base API URL
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL (without /api/v1)
    - url: '{instance_url}'
      description: Root URL (used for MCP endpoints mounted at /mcp)
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL
  /agents/{agentKey}/conversations/stream:
    post:
      tags:
      - Agents
      summary: Create agent conversation with streaming response
      description: 'Start a new conversation with the specified agent and stream the AI

        response as Server-Sent Events (SSE). The first user message is saved

        and forwarded to the upstream agent backend; subsequent tokens, tool

        calls, and lifecycle events are emitted on the open SSE connection.


        AG-UI is the sole wire protocol. The request must include

        `chatMode: quick`; see `AgentStreamSSEEvent` for the event vocabulary.'
      operationId: streamAgentConversation
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      - oauth2:
        - agent:execute
      parameters:
      - name: agentKey
        in: path
        required: true
        description: Stable key identifying the agent that owns this conversation.
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        description: Initial turn payload for the new agent conversation stream.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentStreamCreateConversationRequest'
      responses:
        '200':
          description: SSE stream (text/event-stream)
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/AgentStreamSSEEvent'
        '400':
          description: Invalid request body
        '401':
          description: Unauthorized
    servers:
    - url: '{instance_url}/api/v1'
      description: Base API URL
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL (without /api/v1)
    - url: '{instance_url}'
      description: Root URL (used for MCP endpoints mounted at /mcp)
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL
  /agents/{agentKey}/conversations/{conversationId}/messages/stream:
    post:
      tags:
      - Agents
      summary: Add message to agent conversation with streaming response
      description: 'Append a user message to an existing agent conversation and stream the

        assistant reply over SSE.


        AG-UI is the sole wire protocol. The request must include

        `chatMode: quick`; see `AgentMessageStreamSSEEvent` for the event

        vocabulary.'
      operationId: streamAgentConversationMessage
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      - oauth2:
        - agent:execute
      parameters:
      - name: agentKey
        in: path
        required: true
        schema:
          type: string
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: objectId
      requestBody:
        required: true
        description: Follow-up message payload for the agent conversation stream.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentAddMessageStreamRequest'
      responses:
        '200':
          description: SSE stream (text/event-stream)
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/AgentMessageStreamSSEEvent'
        '400':
          description: Invalid request body
        '401':
          description: Unauthorized
        '404':
          description: Conversation not found
    servers:
    - url: '{instance_url}/api/v1'
      description: Base API URL
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL (without /api/v1)
    - url: '{instance_url}'
      description: Root URL (used for MCP endpoints mounted at /mcp)
      variables:
        instance_url:
          default: https://app.pipeshub.com
          description: Base server URL
  /agents/{agentKey}/conversations/{conversationId}/message/{messageId}/regenerate:
    post:
      tags:
      - Agents
      summary: Regenerate agent conversation message
      description: 'Regenerate the AI response for a specific message in an agent

        conversation and stream the new answer over Server-Sent Events.


        **Constraints:**


        - Only the last message in the conversation can be regenerated.

        - The target message must be of type `bot_response`.


        **Request body:**


        `chatMode: quick` is required. Other fields are optional and reuse

        the original model/context when omitted. The body supports:

        - `filters`

        - `chatMode`

        - `modelKey`

        - `modelName`

        - `modelFriendlyName`

        - `timezone`

        - `currentTime`

        - `tools`

        - `protocol`

        - `agentCapabilities`


        **Streaming behavior:**


        The response is delivered as an AG-UI `text/event-stream`. Stable

        outcomes are `RUN_FINISHED` and `RUN_ERROR`; see

        `AgentRegenerateSSEEvent`.


        Additional agent/tool lifecycle events may be forwarded by the

        backend and should be treated as informational updates.


        Validation failures on params/body are returned as normal HTTP `400`

        responses before the stream starts. Valid-shape requests that fail

        conversation lookup or regenerate rules are reported as

        `RUN_ERROR` events after stream initialization.'
      operationId: regenerateAgentConversationMessage
      x-pipeshub-sdk: true
      security:
      - bearerAuth: []
      - oauth2:
        - agent:execute
      parameters:
      - name: agentKey
        in: path
        required: true
        description: Stable key identifying the agent that owns this conversation.
        schema:
          type: string
          minLength: 1
      - name: conversationId
        in: path
        required: true
        description: ID of the agent conversation containing the target message.
        schema:
          type: string
          format: objectId
      - name: messageId
        in: path
        required: true
        description: ID of the bot-response message to regenerate.
        schema:
          type: string
          format: objectId
      requestBody:
        required: true
        description: 'Regeneration payload requiring `chatMode: quick`.

          '
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRegenerateRequest'
      responses:
        '200':
          description: "SSE stream established.\n\nStable event names:\n- `RUN_FINISHED` — `{ type, result }`, where `result` contains the\n  updated conversation and metadata\n- `RUN_ERROR` — `{ type, message, code? }`, reporting lookup,\n  authorization, or regenerate-rule failures\n\nForwarded lifecycle and child-run events may include `runId`,\n`threadId`, and `parentRunId`. Additional backend-defined\nagent/tool events may be emitted.\nClients should ignore unknown event names.\n"
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/AgentRegenerateSSEEvent'
        '400':
          description: 'Validation failed for path parameters or request body. Common

            causes include invalid ObjectId formats, empty strings for fields

            that require content, malformed `filters`, invalid `tools`

            entries, or `currentTime` values that are not ISO 8601 datetimes

            with offset information.

            '
        '401':
          description: Unauthorized
