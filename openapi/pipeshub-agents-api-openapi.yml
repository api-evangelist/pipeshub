          $ref: '#/components/schemas/SemanticSearchHistoryPagination'
    AgentUpdateRequest:
      type: object
      additionalProperties: false
      description: 'Partial update payload for `PUT /agents/{agentKey}`.


        Every field is optional — only the fields present in the request body

        are updated. `models` may be omitted, set to an empty array to clear

        the agent''s models (reverting it to the organization''s default LLM at

        chat time), or set to a non-empty array. When a non-empty array is

        provided, the gateway Zod middleware (mirroring the Python backend)

        requires at least one object entry with `isReasoning: true`.

        '
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Agent display name
          example: Renamed Agent
        description:
          type: string
          maxLength: 100000
          description: What the agent does
        startMessage:
          type: string
          maxLength: 100000
          description: Initial greeting shown when conversation starts
        systemPrompt:
          type: string
          maxLength: 100000
          description: System instructions for the agent
        instructions:
          type: string
          maxLength: 100000
          description: Additional agent execution instructions
        models:
          type: array
          minItems: 0
          description: 'Agent model configuration entries. Optional. An empty array clears the

            agent''s models so it falls back to the organization''s default LLM.

            When a non-empty array is present, the Zod middleware requires at

            least one object entry with `isReasoning: true`. String-only arrays

            are schema-valid but rejected at runtime with HTTP 400 unless empty.

            '
          items:
            $ref: '#/components/schemas/AgentCreateModelEntry'
        tags:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 100
        shareWithOrg:
          type: boolean
          default: false
          description: Share agent with the organization
        isServiceAccount:
          type: boolean
          default: false
          description: Mark agent as a service account
        toolsets:
          type: array
          maxItems: 100
          description: Toolsets attached to the agent (instance-aware)
          items:
            $ref: '#/components/schemas/AgentCreateToolset'
        knowledge:
          type: array
          maxItems: 100
          description: Knowledge sources connected to the agent
          items:
            $ref: '#/components/schemas/AgentCreateKnowledge'
        skills:
          type: array
          maxItems: 100
          description: 'Complete replacement set of skills assigned to the agent. Send

            an empty array to clear all skill assignments.

            '
          items:
            $ref: '#/components/schemas/AgentSkillAssignment'
        webSearch:
          $ref: '#/components/schemas/AgentCreateWebSearch'
        defaultReasoningEffort:
          type:
          - string
          - 'null'
          enum:
          - none
          - low
          - medium
          - high
          - max
          description: Agent-level reasoning effort used when a chat request omits its own.
        sendUserContext:
          type: boolean
          description: 'When true (default), include the current user''s name, email, and

            organization in this agent''s system prompt. When false, omit that

            profile data.

            '
    AgentDeleteResponse:
