        indexing_status:
          type:
          - string
          - 'null'
        connector:
          type:
          - string
          - 'null'
        context_block:
          type:
          - string
          - 'null'
          description: Type-specific metadata for the current node when it is a record — for a ticket, status, assignee, priority and dates.
        text:
          type: string
          description: 'Flat-text rendering of this view: breadcrumbs, the current node''s

            metadata, the children listing with an id per row, `Related:`, and

            a closing `Next:` line naming a follow-up call.


            Shape depends on the page: pages after the first omit the header,

            breadcrumbs and related rows to stay compact, while the structured

            fields above remain complete. Capped at 25,000 bytes, with a

            truncation marker appended when exceeded.

            '
  securitySchemes:
