      - breadcrumbs
      - rows
      - related
      - pagination
      - web_url
      - indexing_status
      - connector
      - text
      properties:
        current:
          allOf:
          - $ref: '#/components/schemas/KnowledgeGraphNodeRefSchema'
          description: The node that was opened. Null at the root listing.
        breadcrumbs:
          type: array
          description: Root to parent, not including `current`.
          items:
            $ref: '#/components/schemas/KnowledgeGraphNodeRefSchema'
        rows:
          type: array
          description: The current node's children for this page. With `depth` > 1 this is a flat list of all descendants up to that depth, each row carrying its own `level`.
          items:
            $ref: '#/components/schemas/KnowledgeGraphNodeRowSchema'
        related:
          type: array
          description: Cross-referenced records (non-containment edges), e.g. the Confluence page linked from a Jira ticket. Page 1 only.
          items:
            $ref: '#/components/schemas/KnowledgeGraphNodeRowSchema'
        pagination:
          allOf:
          - $ref: '#/components/schemas/KnowledgeGraphPaginationSchema'
        web_url:
          type:
